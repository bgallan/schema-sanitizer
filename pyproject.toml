[build-system]
requires = ["scikit-build-core==0.11.6"]
build-backend = "scikit_build_core.build"

[project]
name = "schema-sanitizer"
dynamic = ["version"]
description = "Path- and URI-based data sanitization for CSV, JSON, JSON arrays, JSON Lines, XML, and Parquet pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["arrow", "pyarrow", "json", "xml", "csv", "schema", "sanitization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython"
]

[[project.authors]]
name = "bgallan"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pre-commit>=3.7",
  "build>=1.2",
  "detect-secrets==1.5.0",
  "ruff>=0.6.0",
  "mypy>=1.10",
  "aiohttp>=3.9",
  "pyarrow>=14.0.0",
  "pandas>=2.0",
  "polars>=0.20",
  "duckdb>=1.0"
]
pyarrow = [
  "pyarrow>=14.0.0"
]
polars = [
  "polars>=0.20"
]
pandas = [
  "pandas>=2.0"
]
duckdb = [
  "duckdb>=1.0"
]
gcs = [
  "aiohttp>=3.9",
  "google-auth>=2.0"
]
s3 = [
  "aiobotocore>=2.13",
  "botocore>=1.34"
]
azure = [
  "aiohttp>=3.9",
  "azure-identity>=1.16",
  "azure-storage-blob>=12.20"
]
bigquery = [
  "pyarrow>=14.0.0",
  "adbc-driver-bigquery[dbapi]"
]
cloud = [
  "aiohttp>=3.9",
  "google-auth>=2.0",
  "aiobotocore>=2.13",
  "botocore>=1.34",
  "azure-identity>=1.16",
  "azure-storage-blob>=12.20"
]
all = [
  "pyarrow>=14.0.0",
  "polars>=0.20",
  "pandas>=2.0",
  "duckdb>=1.0",
  "adbc-driver-bigquery[dbapi]",
  "aiohttp>=3.9",
  "google-auth>=2.0",
  "aiobotocore>=2.13",
  "botocore>=1.34",
  "azure-identity>=1.16",
  "azure-storage-blob>=12.20"
]

[project.urls]
Homepage = "https://github.com/bgallan/schema-sanitizer"
Repository = "https://github.com/bgallan/schema-sanitizer"
Changelog = "https://github.com/bgallan/schema-sanitizer/releases"
Issues = "https://github.com/bgallan/schema-sanitizer/issues"

[tool.cibuildwheel]
# CI runs the same strict ABI audit explicitly after wheel output so a cold
# runner does not need cibuildwheel's auxiliary virtualenv.pyz download.
audit-command = ""
build = "cp311-*"
build-frontend = {name = "build", args = ["--no-isolation"]}
build-verbosity = 0
before-build = 'python "{package}/meta/ci/quality/ensure_pinned_pip.py" && python -m pip --version && python "{package}/meta/ci/quality/install_locked_requirements.py" --lock "{package}/meta/ci/requirements/build-tools.txt" --artifact-lock "{package}/meta/ci/requirements/python-artifact-sha256.lock" --packages build auditwheel scikit-build-core cmake ninja'
before-test = 'python "{project}/meta/ci/quality/ensure_pinned_pip.py" && python -m pip --version && python "{project}/meta/ci/quality/install_locked_requirements.py" --lock "{project}/meta/ci/requirements/build-tools.txt" --artifact-lock "{project}/meta/ci/requirements/python-artifact-sha256.lock" --packages pyarrow'
dependency-versions = "meta/ci/requirements/build-tools.txt"
test-requires = []
test-command = "python {project}/meta/ci/parquet/check_parquet_compression_matrix.py"

[tool.cibuildwheel.linux]
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = {DEVELOPER_DIR = "/Applications/Xcode_16.4.app/Contents/Developer", MACOSX_DEPLOYMENT_TARGET = "11.0", PIP_FIND_LINKS = "$GITHUB_WORKSPACE/.work/python-artifacts", PIP_NO_INDEX = "1"}

[tool.cibuildwheel.windows]
environment = {CMAKE_BUILD_PARALLEL_LEVEL = "1", CMAKE_GENERATOR = "Visual Studio 17 2022", CMAKE_GENERATOR_INSTANCE = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise", CMAKE_GENERATOR_PLATFORM = "x64", CMAKE_GENERATOR_TOOLSET = "v143,host=x64,version=14.44.35207", PIP_FIND_LINKS = "$GITHUB_WORKSPACE/.work/python-artifacts", PIP_NO_INDEX = "1"}
repair-wheel-command = "python -W error -m delvewheel repair --extract-dir {project}/.work/delvewheel-extract --add-path {project}/.work/msvc-redist -w {dest_dir} -v {wheel}"

[tool.coverage.html]
directory = ".work/coverage/html"

[tool.coverage.json]
output = ".work/coverage/coverage.json"

[tool.coverage.run]
data_file = ".work/coverage/.coverage"

[tool.coverage.xml]
output = ".work/coverage/coverage.xml"

[tool.mypy]
python_version = "3.11"
files = ["src/schema_sanitizer"]
exclude = [".work", "build", "dist", "wheelhouse", "cpp"]
cache_dir = ".work/mypy"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests"]
cache_dir = ".work/pytest"
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
  "error::pytest.PytestUnraisableExceptionWarning"
]
markers = [
  "native_stress: high-volume native concurrency coverage run explicitly in CI"
]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".work/ruff"

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.scikit-build]
# Keep builds predictable and fast.
build-dir = ".work/build/{wheel_tag}"

[tool.scikit-build.build]
verbose = true

[tool.scikit-build.cmake]
# Let scikit-build-core inject the exact native tools into isolated builds.
version = "==4.3.4"

[tool.scikit-build.cmake.define]
SCHEMA_SANITIZER_REQUIRE_ZLIB = "ON"
SCHEMA_SANITIZER_ZLIB_PROVIDER = "bundled"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "meta/VERSION"
regex = '^(?P<value>\d+\.\d+(?:\.\d+)?(?:\.post\d+)?)$'

[tool.scikit-build.ninja]
version = "==1.13.0"
make-fallback = false

[tool.scikit-build.sdist]
# Let scikit-build-core collect the source tree through .gitignore semantics.
# Broad force-includes override exclusions in 0.11.x and can accidentally pull
# local caches/build trees into release artifacts.
include = [
  "/CMakeLists.txt",
  "/cmake/SchemaSanitizerCompression.cmake",
  "/docs/**",
  "/meta/ci/parquet/check_parquet_compression_matrix.py",
  "/meta/ci/requirements/build-tools.txt",
  "/meta/ci/requirements/downstream.txt",
  "/meta/ci/requirements/platform-tests.txt",
  "/meta/ci/requirements/pre-commit-hooks.txt",
  "/meta/ci/requirements/quality.txt",
  "/meta/ci/requirements/release-verification.txt",
  "/LICENSE",
  "/README.md",
  "/meta/VERSION",
  "/pyproject.toml"
]
exclude = [
  "**/__pycache__/",
  "**/*.pyc",
  "**/*.pyo",
  "/.github/",
  "/.work/",
  "/benchmarks/",
  "/build/",
  "/build-*/",
  "/cmake-build-*/",
  "/.build*/",
  "/dist/",
  "/examples/",
  "/fuzz/corpus/",
  "/fuzz/regressions/*.sha1.zip",
  "/release-dist/",
  "/wheelhouse/"
]

[tool.scikit-build.wheel]
py-api = "cp311"
packages = ["src/schema_sanitizer"]
