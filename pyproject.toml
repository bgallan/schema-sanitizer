[build-system]
requires = [
  "scikit-build-core==0.11.6"
]
build-backend = "scikit_build_core.build"

[project]
name = "schema-sanitizer"
dynamic = ["version"]
description = "Path- and URI-based data sanitization for CSV, JSON, JSON arrays, JSON Lines, XML, and Parquet pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["arrow", "pyarrow", "json", "xml", "csv", "schema", "sanitization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython"
]

[[project.authors]]
name = "bgallan"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pre-commit>=3.7",
  "build>=1.2",
  "ruff>=0.6.0",
  "mypy>=1.10",
  "aiohttp>=3.9",
  "pyarrow>=14.0.0",
  "pandas>=2.0",
  "polars>=0.20",
  "duckdb>=1.0"
]
pyarrow = [
  "pyarrow>=14.0.0"
]
polars = [
  "polars>=0.20"
]
pandas = [
  "pandas>=2.0"
]
duckdb = [
  "duckdb>=1.0"
]
cloud = [
  "aiohttp>=3.9",
  "google-auth>=2.0",
  "aiobotocore>=2.13",
  "botocore>=1.34",
  "azure-identity>=1.16",
  "azure-storage-blob>=12.20"
]
all = [
  "pyarrow>=14.0.0",
  "polars>=0.20",
  "pandas>=2.0",
  "duckdb>=1.0",
  "aiohttp>=3.9",
  "google-auth>=2.0",
  "aiobotocore>=2.13",
  "botocore>=1.34",
  "azure-identity>=1.16",
  "azure-storage-blob>=12.20"
]

[project.urls]
Homepage = "https://github.com/bgallan/schema-sanitizer"
Repository = "https://github.com/bgallan/schema-sanitizer"
Changelog = "https://github.com/bgallan/schema-sanitizer/releases"
Issues = "https://github.com/bgallan/schema-sanitizer/issues"

[tool.cibuildwheel]
build = "cp311-*"
build-verbosity = 1
test-requires = ["pyarrow"]
test-command = "python {project}/meta/ci/check_parquet_compression_matrix.py"

[tool.cibuildwheel.linux]
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET = "11.0"}

[tool.mypy]
python_version = "3.11"
files = ["src/schema_sanitizer"]
exclude = ["build", "dist", "wheelhouse", "cpp"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.scikit-build]
# Keep builds predictable and fast.
build-dir = "build/{wheel_tag}"

[tool.scikit-build.build]
verbose = true

[tool.scikit-build.cmake]
version = ">=4.3,<4.4"

[tool.scikit-build.cmake.define]
SCHEMA_SANITIZER_REQUIRE_ZLIB = "ON"
SCHEMA_SANITIZER_ZLIB_PROVIDER = "bundled"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "meta/VERSION"
regex = '^(?P<value>\d+\.\d+(?:\.\d+)?(?:\.post\d+)?)$'

[tool.scikit-build.sdist]
# Let scikit-build-core collect the source tree through .gitignore semantics.
# Broad force-includes override exclusions in 0.11.x and can accidentally pull
# local caches/build trees into release artifacts.
include = [
  "/CMakeLists.txt",
  "/COMPATIBILITY.md",
  "/cmake/SchemaSanitizerCompression.cmake",
  "/meta/ci/check_parquet_compression_matrix.py",
  "/LICENSE",
  "/README.md",
  "/HEURISTICS.md",
  "/meta/VERSION",
  "/pyproject.toml"
]
exclude = [
  "**/__pycache__/",
  "**/*.pyc",
  "**/*.pyo",
  "/.pytest_cache/",
  "/.mypy_cache/",
  "/.ruff_cache/",
  "/build/",
  "/build-*/",
  "/cmake-build-*/",
  "/.build*/",
  "/dist/",
  "/release-dist/",
  "/wheelhouse/"
]

[tool.scikit-build.wheel]
py-api = "cp311"
packages = ["src/schema_sanitizer"]
