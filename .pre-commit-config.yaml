---
minimum_pre_commit_version: 3.7.0
default_stages: [pre-commit, pre-push]
exclude: ^(\.work/|dist/|wheelhouse/|\.venv.*/|__pycache__/)
repos:
  # The repository dispatcher reuses an exact current environment or creates one
  # content-addressed, hash-locked tool environment below the ignored .work tree.
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: python meta/ci/quality/run_pre_commit_tool.py end-of-file-fixer
        language: system
        types: [text]
        exclude: ^fuzz/(corpus|regressions)/
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: python meta/ci/quality/run_pre_commit_tool.py trailing-whitespace
        language: system
        types: [text]
        exclude: ^fuzz/(corpus|regressions)/
      - id: check-yaml
        name: check-yaml
        entry: python meta/ci/quality/run_pre_commit_tool.py check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check-toml
        entry: python meta/ci/quality/run_pre_commit_tool.py check-toml
        language: system
        types: [toml]
      - id: check-json
        name: check-json
        entry: python meta/ci/quality/run_pre_commit_tool.py check-json
        language: system
        types: [json]
        exclude: ^fuzz/(corpus|regressions)/json/
      - id: pretty-format-json
        name: pretty-format-json
        entry: python meta/ci/quality/run_pre_commit_tool.py pretty-format-json
        language: system
        types: [json]
        exclude: ^fuzz/(corpus|regressions)/json/
        args: [--autofix, --indent=2, --no-sort-keys]
      - id: clang-format
        name: clang-format
        entry: python meta/ci/quality/run_pre_commit_tool.py clang-format
        language: system
        files: ^cpp/src/.*\.(c|cc|cpp|h|hh|hpp|inc)$
        types_or: [text]
        args: [--style=file, -i]
      - id: clang-format-check
        name: clang-format-check
        entry: python meta/ci/quality/run_pre_commit_tool.py clang-format-check
        language: system
        files: ^cpp/src/.*\.(c|cc|cpp|h|hh|hpp|inc)$
        types_or: [text]
        args: [--style=file, --dry-run, --Werror]
      - id: ruff-check
        name: ruff-check
        entry: python meta/ci/quality/run_pre_commit_tool.py ruff-check
        language: system
        files: ^(src|tests|benchmarks|examples|meta/ci)/.*\.py$
        args: [--fix]
      - id: ruff-format
        name: ruff-format
        entry: python meta/ci/quality/run_pre_commit_tool.py ruff-format
        language: system
        files: ^(src|tests|benchmarks|examples|meta/ci)/.*\.py$
      - id: mdformat
        name: mdformat
        entry: python meta/ci/quality/run_pre_commit_tool.py mdformat
        language: system
        files: \.md$
        types: [markdown]
      - id: mdformat-check
        name: mdformat-check
        entry: python meta/ci/quality/run_pre_commit_tool.py mdformat-check
        language: system
        files: \.md$
        types: [markdown]
        args: [--check]
      - id: shellcheck
        name: shellcheck
        entry: python meta/ci/quality/run_pre_commit_tool.py shellcheck
        language: system
        files: \.sh$
      - id: shfmt
        name: shfmt
        entry: python meta/ci/quality/run_pre_commit_tool.py shfmt
        language: system
        files: \.sh$
        args: [-w, -i, '2', -ci]
      - id: actionlint
        name: GitHub Actions semantics
        entry: python meta/ci/quality/run_pre_commit_tool.py actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: GitHub Actions security
        entry: python meta/ci/quality/run_pre_commit_tool.py zizmor --offline --persona
          auditor --min-severity medium
        language: system
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml)$
      - id: mypy
        name: mypy
        entry: python meta/ci/quality/run_pre_commit_tool.py mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: primary-cleanup-safety
        name: primary cleanup safety
        entry: python meta/ci/quality/run_pre_commit_tool.py primary-cleanup-safety
        language: system
        pass_filenames: false
        always_run: true
      - id: action-sha-pins
        name: immutable GitHub Action references
        entry: python meta/ci/quality/run_pre_commit_tool.py action-sha-pins
        language: system
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml)$
        pass_filenames: false
      - id: fuzz-corpus-integrity
        name: fuzz corpus integrity
        entry: python meta/ci/quality/run_pre_commit_tool.py fuzz-corpus-integrity
        language: system
        pass_filenames: false
        always_run: true
      - id: cmake-format
        name: cmake-format
        entry: python meta/ci/quality/run_pre_commit_tool.py cmake-format
        language: system
        files: (^|/)(CMakeLists\.txt|.*\.cmake(\.in)?)$
        args: [--in-place]
      - id: cmake-format-check
        name: cmake-format-check
        entry: python meta/ci/quality/run_pre_commit_tool.py cmake-format-check
        language: system
        files: (^|/)(CMakeLists\.txt|.*\.cmake(\.in)?)$
        args: [--check]
      - id: yamlfix
        name: yamlfix
        entry: python meta/ci/quality/run_pre_commit_tool.py yamlfix
        language: system
        files: \.(yaml|yml)$
        exclude: ^\.github/dependabot\.yml$
      - id: toml-sort
        name: toml-sort
        entry: python meta/ci/quality/run_pre_commit_tool.py toml-sort
        language: system
        files: \.toml$
        args: [--in-place]
