---
name: Run quality, security, and Python coverage
description: Execute source-only quality, security, audit, and coverage checks.
inputs:
  python-version:
    description: Exact quality-runner Python patch included in environment-cache keys.
    required: true
runs:
  using: composite
  steps:
    - name: Install development and audit tools
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/build
        python meta/ci/quality/ensure_pinned_pip.py
        python -m meta.ci.quality.install_locked_requirements \
          --lock meta/ci/requirements/quality.txt --all
        python -m meta.ci.quality.install_locked_requirements \
          --lock meta/ci/requirements/pre-commit-hooks.txt \
          --packages setuptools wheel requests semver
        for attempt in 1 2 3; do
          if python -m meta.ci.quality.install_locked_requirements \
            --lock meta/ci/requirements/pre-commit-hooks.txt --all \
            --allow-sdist actionlint-py; then
            break
          fi
          if (( attempt == 3 )); then
            exit 1
          fi
          sleep "${attempt}"
        done
        actionlint_version=$(actionlint -version)
        [[ "${actionlint_version%%$'\n'*}" == '1.7.12' ]] || {
          echo "Unexpected actionlint version: ${actionlint_version}" >&2
          exit 2
        }
        python -m meta.ci.quality.install_locked_requirements \
          --lock meta/ci/requirements/build-tools.txt \
          --packages scikit-build-core cmake ninja
        python -m pip install --no-build-isolation --no-deps '.[dev]'
        python -m pip check
        python meta/ci/quality/run_pre_commit_tool.py --check-current
    - name: Compile every Python package module
      shell: bash
      run: |-
        set -euo pipefail
        python -m compileall -q src
    - name: Enforce immutable GitHub Action references
      shell: bash
      run: |-
        set -euo pipefail
        python meta/ci/quality/check_action_pins.py
    - name: Lint, format, and static typing
      env:
        PRE_COMMIT_HOME: ${{ github.workspace }}/.work/pre-commit-cache
        SCHEMA_SANITIZER_PRE_COMMIT_CERTIFIED_CURRENT: '1'
      shell: bash
      run: |-
        set -euo pipefail
        if [[ -L "${PRE_COMMIT_HOME}" || \
          ( -e "${PRE_COMMIT_HOME}" && ! -d "${PRE_COMMIT_HOME}" ) ]]; then
          rm -rf -- "${PRE_COMMIT_HOME}"
        fi
        mkdir -p -- "${PRE_COMMIT_HOME}"
        pre-commit run --all-files
    - name: Verify the reviewed dependency advisory snapshot
      shell: bash
      run: |-
        set -euo pipefail
        python -m meta.ci.quality.check_dependency_advisory_snapshot verify
    - name: Static Python security scan
      shell: bash
      run: bandit -r src meta/ci -l
    - name: Secret scan
      shell: bash
      run: |
        set -euo pipefail
        detect-secrets scan \
          --no-verify \
          --exclude-files '^(\.git/|\.work/|dist/|\.venv/|fuzz/(corpus|regressions)/parquet/|fuzz/regressions/(csv|json|parquet|xml)\.sha1\.zip$|fuzz/corpus/json/invalid-utf8\.json$)' \
          > .work/audit/detect-secrets.json
        python meta/ci/quality/check_detect_secrets_report.py \
          .work/audit/detect-secrets.json
    - name: Run source quality contracts
      shell: bash
      run: >-
        pytest -q
        --durations=20
        --durations-min=0.05
        tests/quality
    - name: Collect contextual Python branch coverage
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/coverage coverage-python-html
        rm -f -- coverage-python-summary.txt coverage-python.xml coverage-python.json
        mkdir -p .work/coverage
        coverage erase
        for suite in regular adversarial integration; do
          python meta/ci/quality/run_coverage_suite.py python "${suite}"
        done
        python meta/ci/quality/run_coverage_suite.py python --validate-inputs
        python - <<'PY'
        from coverage import Coverage
        coverage_data = Coverage()
        coverage_data.combine(strict=True)
        coverage_data.save()
        PY
        coverage report --fail-under=44 | tee coverage-python-summary.txt
        coverage html --show-contexts -d coverage-python-html
        coverage xml -o coverage-python.xml
        coverage json -o coverage-python.json
        python meta/ci/quality/report_risk_coverage.py coverage-python.json \
          --output coverage-python-risk-gaps.txt
