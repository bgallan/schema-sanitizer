---
name: Run quality, security, and Python coverage
description: Execute source-only quality, security, audit, and coverage checks.
inputs:
  python-version:
    description: Exact quality-runner Python patch included in environment-cache keys.
    required: true
runs:
  using: composite
  steps:
    - name: Install development and audit tools
      env:
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/quality.txt
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/build
        python meta/ci/quality/ensure_pinned_pip.py
        python -m pip install --no-deps --only-binary=:all: \
          -r meta/ci/requirements/quality.txt
        python -m pip install --no-deps '.[dev]'
        python -m pip check
    - name: Compile every Python package module
      shell: bash
      run: |-
        set -euo pipefail
        python -m compileall -q src
    - name: Reset the owned pre-commit cache path
      shell: bash
      run: |-
        set -euo pipefail
        python - <<'PY'
        import os
        import shutil
        from pathlib import Path
        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        work_root = workspace / ".work"
        if work_root.is_symlink() or (work_root.exists() and not work_root.is_dir()):
            raise SystemExit(f"pre-commit cache parent is unsafe: {work_root}")
        work_root.mkdir(parents=True, exist_ok=True)
        cache = work_root / "pre-commit-cache"
        if cache.is_symlink() or (cache.exists() and not cache.is_dir()):
            cache.unlink()
        elif cache.exists():
            shutil.rmtree(cache)
        PY
    - name: Restore the exact pre-commit environment cache
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .work/pre-commit-cache
        key: >-
          pre-commit-v1-${{ runner.os }}-${{ runner.arch
          }}-python-${{ inputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml',
          'meta/ci/requirements/quality.txt',
          'meta/ci/requirements/pre-commit-hooks.txt') }}
    - name: Lint, format, and static typing
      env:
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/pre-commit-hooks.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/pre-commit-hooks.txt
        PRE_COMMIT_HOME: ${{ github.workspace }}/.work/pre-commit-cache
        VIRTUALENV_NO_PERIODIC_UPDATE: '1'
        VIRTUALENV_PIP: 26.2.1
        VIRTUALENV_SETUPTOOLS: 84.0.0
      shell: bash
      run: |-
        set -euo pipefail
        if [[ -L "${PRE_COMMIT_HOME}" || \
          ( -e "${PRE_COMMIT_HOME}" && ! -d "${PRE_COMMIT_HOME}" ) ]]; then
          rm -rf -- "${PRE_COMMIT_HOME}"
        fi
        mkdir -p -- "${PRE_COMMIT_HOME}"
        for attempt in 1 2 3; do
          if timeout --signal=TERM --kill-after=15s 120s pre-commit install-hooks; then
            break
          fi
          if (( attempt == 3 )); then
            exit 1
          fi
          rm -rf -- "${PRE_COMMIT_HOME}"
          mkdir -p -- "${PRE_COMMIT_HOME}"
          sleep $((attempt * 2))
        done
        pre-commit run --all-files
    - name: Build dependency inputs and audit them
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/audit
        mapfile -t audit_inputs < <(
          python meta/ci/quality/build_dependency_audit_inputs.py \
            --output-dir .work/audit
        )
        (( ${#audit_inputs[@]} > 0 ))
        for requirements in "${audit_inputs[@]}"; do
          pip-audit -r "${requirements}" --no-deps --disable-pip --strict \
            --progress-spinner off
        done
    - name: Static Python security scan
      shell: bash
      run: bandit -r src meta/ci -ll
    - name: Secret scan
      shell: bash
      run: |
        set -euo pipefail
        detect-secrets scan \
          --no-verify \
          --exclude-files '^(\.git/|\.work/|dist/|\.venv/|fuzz/(corpus|regressions)/(csv|json|parquet|xml)/)' \
          > .work/audit/detect-secrets.json
        python meta/ci/quality/check_detect_secrets_report.py \
          .work/audit/detect-secrets.json
    - name: Run source quality contracts
      shell: bash
      run: >-
        pytest -q
        --durations=20
        --durations-min=0.05
        tests/quality
    - name: Collect contextual Python branch coverage
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/coverage coverage-python-html
        rm -f -- coverage-python-summary.txt coverage-python.xml coverage-python.json
        mkdir -p .work/coverage
        coverage erase
        for suite in regular adversarial integration; do
          python meta/ci/quality/run_coverage_suite.py python "${suite}"
        done
        python meta/ci/quality/run_coverage_suite.py python --validate-inputs
        python - <<'PY'
        from coverage import Coverage
        coverage_data = Coverage()
        coverage_data.combine(strict=True)
        coverage_data.save()
        PY
        coverage report --fail-under=44 | tee coverage-python-summary.txt
        coverage html --show-contexts -d coverage-python-html
        coverage xml -o coverage-python.xml
        coverage json -o coverage-python.json
        python meta/ci/quality/report_risk_coverage.py coverage-python.json \
          --output coverage-python-risk-gaps.txt
