---
name: Run quality, security, and Python coverage
description: Execute source-only quality, security, audit, and coverage checks.
runs:
  using: composite
  steps:
    - name: Install development and audit tools
      shell: bash
      run: |-
        set -euo pipefail
        python -m pip install pip==26.1.2
        python -m pip install -c meta/ci/requirements/quality.txt \
          '.[dev]' coverage==7.15.4 pip-audit==2.10.1 \
          bandit==1.9.4 tomli==2.4.1
    - name: Lint, format, and static typing
      shell: bash
      run: |-
        set -euo pipefail
        for attempt in 1 2 3; do
          if timeout --signal=TERM --kill-after=15s 120s pre-commit install-hooks; then
            break
          fi
          if (( attempt == 3 )); then
            exit 1
          fi
          sleep $((attempt * 2))
        done
        pre-commit run --all-files
    - name: Build dependency inputs and audit them
      shell: bash
      run: |
        python - <<'PY'
        try:
            import tomllib
        except ModuleNotFoundError:
            import tomli as tomllib
        from pathlib import Path
        pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
        project = pyproject.get("project", {})
        runtime = list(project.get("dependencies", []))
        build = list(pyproject.get("build-system", {}).get("requires", []))
        extras = [
            requirement
            for values in project.get("optional-dependencies", {}).values()
            for requirement in values
        ]
        ci_tools = [
            "abi3audit==0.0.26",
            "actionlint-py==1.7.12.24",
            "bandit==1.9.4",
            "build==1.5.0",
            "cibuildwheel==4.2.0",
            "cmakelang==0.6.13",
            "coverage==7.15.4",
            "detect-secrets==1.5.0",
            "mypy==1.19.1",
            "packaging==26.3",
            "pip-audit==2.10.1",
            "shellcheck-py==0.11.0.1",
            "shfmt-py==4.0.0",
            "toml-sort==0.24.3",
            "twine==7.0.0",
            "yamlfix==1.18.0",
            "zizmor==1.29.0",
        ]
        ci_constraints = [
            requirement
            for path in sorted(Path("meta/ci/requirements").glob("*.txt"))
            for requirement in path.read_text(encoding="utf-8").splitlines()
            if requirement and not requirement.startswith("#")
        ]
        audit_dir = Path(".work/audit")
        audit_dir.mkdir(parents=True, exist_ok=True)
        for name, requirements in (
            ("runtime-requirements.txt", runtime),
            (
                "full-requirements.txt",
                runtime + build + extras + ci_tools + ci_constraints,
            ),
        ):
            (audit_dir / name).write_text(
                "\n".join(dict.fromkeys(requirements)) + "\n",
                encoding="utf-8",
            )
        PY
        pip-audit -r .work/audit/runtime-requirements.txt --progress-spinner off
        pip-audit -r .work/audit/full-requirements.txt --progress-spinner off
    - name: Static Python security scan
      shell: bash
      run: bandit -r src meta/ci -ll
    - name: Secret scan
      shell: bash
      run: |
        detect-secrets scan \
          --no-verify \
          --exclude-files '^(\.git/|\.work/|dist/|\.venv/|fuzz/(corpus|regressions)/(csv|json|parquet|xml)/)' \
          > .work/audit/detect-secrets.json
        python meta/ci/quality/check_detect_secrets_report.py \
          .work/audit/detect-secrets.json
    - name: Benchmark harness smoke
      shell: bash
      run: python -m benchmarks.ingestion.cli --rows 8 --width 2 --repeats 1
    - name: Collect contextual Python branch coverage
      shell: bash
      run: |-
        coverage erase
        for suite in regular adversarial integration; do
          python meta/ci/quality/run_coverage_suite.py python "${suite}"
        done
        coverage combine
        coverage report --fail-under=44 | tee coverage-python-summary.txt
        coverage html --show-contexts -d coverage-python-html
        coverage xml -o coverage-python.xml
        coverage json -o coverage-python.json
        python meta/ci/quality/report_risk_coverage.py coverage-python.json \
          --output coverage-python-risk-gaps.txt
