---
name: Run quality, security, and Python coverage
description: Execute source-only quality, security, audit, and coverage checks.
runs:
  using: composite
  steps:
    - name: Install development and audit tools
      env:
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/quality.txt
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/build
        python -m pip install pip==26.2.1
        python -m pip install -c meta/ci/requirements/quality.txt \
          '.[dev]' coverage==7.15.4 pip-audit==2.10.1 \
          bandit==1.9.4 tomli==2.4.1
    - name: Lint, format, and static typing
      env:
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/pre-commit-hooks.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/pre-commit-hooks.txt
        VIRTUALENV_NO_PERIODIC_UPDATE: '1'
        VIRTUALENV_PIP: 26.2.1
        VIRTUALENV_SETUPTOOLS: 84.0.0
      shell: bash
      run: |-
        set -euo pipefail
        for attempt in 1 2 3; do
          if timeout --signal=TERM --kill-after=15s 120s pre-commit install-hooks; then
            break
          fi
          if (( attempt == 3 )); then
            exit 1
          fi
          sleep $((attempt * 2))
        done
        pre-commit run --all-files
    - name: Build dependency inputs and audit them
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/audit
        mapfile -t audit_inputs < <(
          python meta/ci/quality/build_dependency_audit_inputs.py \
            --output-dir .work/audit
        )
        (( ${#audit_inputs[@]} > 0 ))
        for requirements in "${audit_inputs[@]}"; do
          pip-audit -r "${requirements}" --no-deps --disable-pip --strict \
            --progress-spinner off
        done
    - name: Static Python security scan
      shell: bash
      run: bandit -r src meta/ci -ll
    - name: Secret scan
      shell: bash
      run: |
        set -euo pipefail
        detect-secrets scan \
          --no-verify \
          --exclude-files '^(\.git/|\.work/|dist/|\.venv/|fuzz/(corpus|regressions)/(csv|json|parquet|xml)/)' \
          > .work/audit/detect-secrets.json
        python meta/ci/quality/check_detect_secrets_report.py \
          .work/audit/detect-secrets.json
    - name: Benchmark harness smoke
      shell: bash
      run: python -m benchmarks.ingestion.cli --rows 8 --width 2 --repeats 1
    - name: Collect contextual Python branch coverage
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/coverage coverage-python-html
        rm -f -- coverage-python-summary.txt coverage-python.xml coverage-python.json
        mkdir -p .work/coverage
        coverage erase
        for suite in regular adversarial integration; do
          python meta/ci/quality/run_coverage_suite.py python "${suite}"
        done
        python meta/ci/quality/run_coverage_suite.py python --validate-inputs
        coverage combine --strict
        coverage report --fail-under=44 | tee coverage-python-summary.txt
        coverage html --show-contexts -d coverage-python-html
        coverage xml -o coverage-python.xml
        coverage json -o coverage-python.json
        python meta/ci/quality/report_risk_coverage.py coverage-python.json \
          --output coverage-python-risk-gaps.txt
