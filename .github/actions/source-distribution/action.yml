---
name: Validate source distribution and downstream packaging
description: Build, inspect, rebuild, install, and upload the source distribution.
runs:
  using: composite
  steps:
    - name: Validate version and build the source distribution
      env:
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        rm -rf -- dist downstream-wheel .work/build .work/sdist-reproducibility
        mkdir -p dist .work/sdist-reproducibility/first .work/sdist-reproducibility/second
        SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
        [[ "${SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]
        export SOURCE_DATE_EPOCH
        python meta/ci/release/validate_release_version.py
        python -m pip install pip==26.2.1 build==1.5.0 twine==7.0.0 packaging==26.3
        python -m build --sdist --outdir .work/sdist-reproducibility/first
        rm -rf -- .work/build
        python -m build --sdist --outdir .work/sdist-reproducibility/second
        shopt -s nullglob
        first=(.work/sdist-reproducibility/first/*.tar.gz)
        second=(.work/sdist-reproducibility/second/*.tar.gz)
        if (( ${#first[@]} != 1 || ${#second[@]} != 1 )); then
          echo "Expected exactly one source archive from each reproducibility build" >&2
          exit 1
        fi
        if [[ "${first[0]##*/}" != "${second[0]##*/}" ]]; then
          echo "Source reproducibility builds produced different archive names" >&2
          exit 1
        fi
        cmp -- "${first[0]}" "${second[0]}"
        cp -- "${first[0]}" dist/
        python -m twine check dist/*.tar.gz
        python meta/ci/release/check_distribution_contents.py dist/*.tar.gz
    - name: Rebuild and test as an isolated downstream consumer
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p downstream-wheel
        env \
          PIP_BUILD_CONSTRAINT="${GITHUB_WORKSPACE}/meta/ci/requirements/build-tools.txt" \
          PIP_CONSTRAINT="${GITHUB_WORKSPACE}/meta/ci/requirements/build-tools.txt" \
          python -m pip wheel --no-deps --wheel-dir downstream-wheel dist/*.tar.gz
        shopt -s nullglob
        wheels=(downstream-wheel/*.whl)
        if (( ${#wheels[@]} != 1 )); then
          echo "Expected exactly one downstream wheel, found ${#wheels[@]}" >&2
          exit 1
        fi
        python meta/ci/release/check_distribution_contents.py "${wheels[0]}"
        meta/ci/release/check_downstream_install.sh "${wheels[0]}"
    - name: Upload the validated source distribution
      id: upload-source-distribution
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: source-distribution
        path: dist/*.tar.gz
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
    - name: Retry the source-distribution upload after a transport failure
      if: ${{ always() && steps.upload-source-distribution.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: source-distribution
        path: dist/*.tar.gz
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
