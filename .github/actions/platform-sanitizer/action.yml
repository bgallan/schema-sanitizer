---
name: Run one platform sanitizer workload
description: Exercise native concurrency and fuzz targets under platform sanitizers.
inputs:
  sanitizer:
    description: Sanitizer selector passed to CMake.
    required: true
  mode:
    description: Sanitizer workload mode (linux-full or native).
    required: true
runs:
  using: composite
  steps:
    - name: Require a supported sanitizer tuple
      env:
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
        SANITIZER_MODE: ${{ inputs.mode }}
        SANITIZER_NAME: ${{ inputs.sanitizer }}
      shell: bash
      run: |-
        set -euo pipefail
        sanitizer_tuple="${RUNNER_SYSTEM}:${RUNNER_ARCHITECTURE}:${SANITIZER_MODE}:${SANITIZER_NAME}"
        case "${sanitizer_tuple}" in
          Linux:X64:linux-full:asan-ubsan | \
          Windows:X64:native:asan | \
          macOS:X64:native:asan-ubsan | \
          macOS:ARM64:native:asan-ubsan) ;;
          *)
            echo "Unsupported sanitizer tuple: ${sanitizer_tuple}" >&2
            exit 2
            ;;
        esac
    - name: Require the runner-provided Linux Clang 18 toolchain
      if: inputs.mode == 'linux-full'
      shell: bash
      run: |-
        set -euo pipefail
        [[ "$(command -v clang-18)" == '/usr/bin/clang-18' ]]
        [[ "$(command -v clang++-18)" == '/usr/bin/clang++-18' ]]
        [[ "$(clang-18 -dumpfullversion -dumpversion)" == '18.1.3' ]]
        [[ "$(clang++-18 -dumpfullversion -dumpversion)" == '18.1.3' ]]
    - name: Select the macOS sanitizer toolchain
      if: runner.os == 'macOS'
      env:
        DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      shell: bash
      run: |
        set -euo pipefail
        xcode_version=$(xcodebuild -version)
        [[ "${xcode_version}" == $'Xcode 16.4\nBuild version 16F6' ]]
        [[ "$(xcrun --sdk macosx15.5 --show-sdk-version)" == '15.5' ]]
        clang_version=$(xcrun --sdk macosx15.5 clang --version)
        [[ "${clang_version%%$'\n'*}" == \
          'Apple clang version 17.0.0 (clang-1700.0.13.5)' ]]
    - name: Install build dependencies
      env:
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |-
        set -euo pipefail
        python meta/ci/quality/ensure_pinned_pip.py
        python -m meta.ci.quality.install_locked_requirements \
          --lock meta/ci/requirements/build-tools.txt \
          --packages ninja cmake scikit-build-core pytest pyarrow
    - name: Reset generated sanitizer paths
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- .work/build .work/bin/python-asan .work/sanitizer-evidence
        mkdir -p .work/sanitizer-evidence
    - name: Build and install the Linux instrumented extension
      if: inputs.mode == 'linux-full'
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        CMAKE_BUILD_PARALLEL_LEVEL="$(
          python -c 'from meta.ci.quality.record_runner_environment import bounded_build_parallelism; print(bounded_build_parallelism())'
        )"
        [[ "${CMAKE_BUILD_PARALLEL_LEVEL}" =~ ^[1-4]$ ]]
        export CMAKE_BUILD_PARALLEL_LEVEL
        python -m pip install -v --no-build-isolation \
          --config-settings=cmake.define.CMAKE_C_COMPILER=clang-18 \
          --config-settings=cmake.define.CMAKE_CXX_COMPILER=clang++-18 \
          --config-settings=build-dir=.work/build/platform-sanitizer \
          --config-settings=cmake.build-type=RelWithDebInfo \
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_LTO=OFF \
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_PCH=OFF \
          --config-settings=cmake.define.SCHEMA_SANITIZER_SANITIZER=asan-ubsan \
          --config-settings=cmake.define.SCHEMA_SANITIZER_BUILD_FUZZERS=ON \
          --config-settings=cmake.define.SCHEMA_SANITIZER_FUZZ_ENGINE=libfuzzer \
          --config-settings=cmake.define.SCHEMA_SANITIZER_ZLIB_PROVIDER=bundled \
          --config-settings=cmake.define.SCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_WERROR=ON \
          .
    - name: Certify the reused Linux sanitizer build tree
      if: inputs.mode == 'linux-full'
      shell: bash
      run: |
        set -euo pipefail
        cache=.work/build/platform-sanitizer/CMakeCache.txt
        if [[ -L "${cache}" || ! -f "${cache}" ]]; then
          echo "Linux sanitizer CMake cache is missing or unsafe: ${cache}" >&2
          exit 2
        fi
        expected=(
          'CMAKE_BUILD_TYPE:STRING=RelWithDebInfo'
          'CMAKE_GENERATOR:INTERNAL=Ninja'
          'CMAKE_PROJECT_NAME:STATIC=schema_sanitizer'
          'SCHEMA_SANITIZER_BUILD_FUZZERS:BOOL=ON'
          'SCHEMA_SANITIZER_ENABLE_LTO:BOOL=OFF'
          'SCHEMA_SANITIZER_ENABLE_PCH:BOOL=OFF'
          'SCHEMA_SANITIZER_ENABLE_WERROR:BOOL=ON'
          'SCHEMA_SANITIZER_FUZZ_ENGINE:STRING=libfuzzer'
          'SCHEMA_SANITIZER_REQUIRE_ZLIB:BOOL=ON'
          'SCHEMA_SANITIZER_SANITIZER:STRING=asan-ubsan'
          'SCHEMA_SANITIZER_ZLIB_PROVIDER:STRING=bundled'
        )
        for entry in "${expected[@]}"; do
          grep -Fx -- "${entry}" "${cache}" >/dev/null || {
            echo "Linux sanitizer build mismatch: missing '${entry}'" >&2
            exit 2
          }
        done
        python - "${cache}" <<'PY'
        import os
        import shutil
        import sys
        from pathlib import Path
        cache = Path(sys.argv[1])
        values = {}
        for raw_line in cache.read_text(encoding="utf-8").splitlines():
            key_and_type, separator, value = raw_line.partition("=")
            key, type_separator, _cache_type = key_and_type.partition(":")
            if separator and type_separator:
                values[key] = value
        for variable, executable_name in (
            ("CMAKE_C_COMPILER", "clang-18"),
            ("CMAKE_CXX_COMPILER", "clang++-18"),
        ):
            configured_value = values.get(variable)
            if not configured_value:
                raise SystemExit(f"Linux sanitizer cache omits {variable}")
            configured_path = Path(configured_value)
            if not configured_path.is_absolute():
                configured_location = shutil.which(configured_value)
                if configured_location is None:
                    raise SystemExit(
                        f"Linux sanitizer compiler is not executable: {configured_value}"
                    )
                configured_path = Path(configured_location)
            expected_location = shutil.which(executable_name)
            if expected_location is None:
                raise SystemExit(f"Pinned compiler is unavailable: {executable_name}")
            try:
                configured_path = configured_path.resolve(strict=True)
                expected_path = Path(expected_location).resolve(strict=True)
            except OSError as error:
                raise SystemExit(f"Linux sanitizer compiler path is invalid: {error}") from error
            if configured_path != expected_path or not os.access(configured_path, os.X_OK):
                raise SystemExit(
                    f"Linux sanitizer {variable} mismatch: "
                    f"configured={configured_path}, expected={expected_path}"
                )
            print(f"{variable}={configured_path}")
        PY
    - name: Build the Linux sanitizer-first CPython launcher
      if: inputs.mode == 'linux-full'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .work/bin
        read -r -a python_embed_cflags <<< "$(python3-config --embed --cflags)"
        read -r -a python_embed_ldflags <<< "$(python3-config --embed --ldflags)"
        clang++-18 -std=c++17 -fsanitize=address,undefined \
          -fno-omit-frame-pointer -fno-sanitize-recover=all \
          "${python_embed_cflags[@]}" \
          meta/ci/sanitizers/asan_python_launcher.cc \
          -o .work/bin/python-asan \
          "${python_embed_ldflags[@]}"
    - name: Exercise malformed input, lifecycle, and nested Parquet
      if: inputs.mode == 'linux-full'
      env:
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
        LSAN_OPTIONS: ''
        TSAN_OPTIONS: ''
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      shell: bash
      run: >-
        python meta/ci/sanitizers/run_with_watchdog.py
        --certificate .work/sanitizer-evidence/watchdog-asan-ubsan-linux-full-Linux-X64-extension.json
        --environment "ASAN_OPTIONS=${ASAN_OPTIONS}"
        --environment "LSAN_OPTIONS=${LSAN_OPTIONS}"
        --environment "TSAN_OPTIONS=${TSAN_OPTIONS}"
        --environment "UBSAN_OPTIONS=${UBSAN_OPTIONS}"
        --label Linux-X64-asan-ubsan-linux-full-extension
        --timeout 900
        -- .work/bin/python-asan -m pytest -q
        tests/io/test_input_python_and_local.py
        tests/schema/test_options_bytes.py
        tests/concurrency/test_runtime_stream_materialization_and_registry_probes.py
        tests/concurrency/test_runtime_registry_round_trips_and_result_materialization.py
        tests/concurrency/test_runtime_resource_close_and_finalization.py
        tests/parquet/test_parquet_direct_nested_projection.py
        tests/parquet/test_parquet_native_nested_cases.py::test_native_nested_case[native_parquet_stream_materializes_list_map_nested_struct_list_values]
        tests/parquet/test_parquet_native_nested_cases.py::test_native_nested_case[native_parquet_stream_materializes_list_map_list_struct_values]
        tests/parquet/test_parquet_native_nested_cases.py::test_native_nested_case[native_parquet_stream_materializes_list_map_with_struct_values]
        tests/parquet/test_parquet_native_nested_cases.py::test_native_nested_case[native_parquet_stream_materializes_list_map_with_nested_struct_values]
        tests/parquet/test_parquet_native_nested_cases.py::test_native_nested_case[native_parquet_stream_materializes_list_map_with_struct_list_values]
        tests/parquet/test_parquet_native_nested_cases.py::test_native_nested_case[native_parquet_stream_materializes_list_map_with_struct_list_chain_values]
        tests/parquet/test_parquet_native_nested_cases.py::test_native_nested_case[native_parquet_stream_materializes_list_list_struct_values]
        tests/parquet/test_parquet_native_nested_cases.py::test_native_nested_case[native_parquet_stream_materializes_deep_list_chain_struct_values]
        tests/parquet/test_parquet_native_recursive_cases.py::test_native_recursive_case[native_parquet_stream_materializes_adversarial_recursive_struct_siblings]
        tests/parquet/test_parquet_native_recursive_cases.py::test_native_recursive_case[native_parquet_stream_projects_recursive_shapes_across_row_groups]
        tests/parquet/test_parquet_native_recursive_cases.py::test_native_recursive_case[native_parquet_stream_materializes_recursive_null_empty_matrix]
        tests/parquet/test_parquet_native_recursive_cases.py::test_native_recursive_case[native_parquet_stream_materializes_generated_extreme_recursive_shapes]
        tests/parquet/test_parquet_native_recursive_cases.py::test_native_recursive_case[native_parquet_stream_materializes_generated_recursive_shape_fuzzer]
        tests/pipeline/test_csv_union_projection.py
    - name: Configure Windows ASan
      if: runner.os == 'Windows'
      env:
        SANITIZER: ${{ inputs.sanitizer }}
      shell: bash
      run: |
        set -euo pipefail
        cmake -S . -B .work/build/platform-sanitizer \
          -G "Visual Studio 17 2022" \
          -A "x64,version=10.0.26100.0" \
          -T v143,host=x64,version=14.44.35207 \
          -DCMAKE_GENERATOR_INSTANCE='C:/Program Files/Microsoft Visual Studio/2022/Enterprise' \
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF \
          -DSCHEMA_SANITIZER_ENABLE_PCH=OFF \
          -DSCHEMA_SANITIZER_SANITIZER="${SANITIZER}" \
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON \
          -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone \
          -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled \
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
    - name: Certify the Windows ASan toolchain
      if: runner.os == 'Windows'
      shell: bash
      run: >-
        python meta/ci/native/certify_windows_toolchain.py
        .work/build/platform-sanitizer
        --direct-build
        --certificate .work/sanitizer-evidence/windows-toolchain-Windows-X64.json
    - name: Configure macOS ASan/UBSan
      if: runner.os == 'macOS'
      env:
        DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        SANITIZER: ${{ inputs.sanitizer }}
      shell: bash
      run: >-
        cmake -S . -B .work/build/platform-sanitizer -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_OSX_SYSROOT=macosx15.5
        -DSCHEMA_SANITIZER_ENABLE_LTO=OFF
        -DSCHEMA_SANITIZER_ENABLE_PCH=OFF
        -DSCHEMA_SANITIZER_SANITIZER="${SANITIZER}"
        -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON
        -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone
        -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled
        -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON
        -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
    - name: Build native concurrency and fuzz targets
      env:
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
        SANITIZER_MODE: ${{ inputs.mode }}
        SANITIZER_NAME: ${{ inputs.sanitizer }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_SYSTEM}" == 'Windows' ]]; then
          # Compiler-level /MP owns Windows fan-out; MSBuild stays serial.
          CMAKE_BUILD_PARALLEL_LEVEL=1
        else
          CMAKE_BUILD_PARALLEL_LEVEL="$(
            python -c 'from meta.ci.quality.record_runner_environment import bounded_build_parallelism; print(bounded_build_parallelism())'
          )"
        fi
        [[ "${CMAKE_BUILD_PARALLEL_LEVEL}" =~ ^[1-4]$ ]]
        export CMAKE_BUILD_PARALLEL_LEVEL
        cmake --build .work/build/platform-sanitizer \
          --config RelWithDebInfo \
          --target _core_abi3 schema_sanitizer_sanitizer_python_launcher \
          schema_sanitizer_sanitized_ordered_executor \
          schema_sanitizer_fuzz_json schema_sanitizer_fuzz_csv \
          schema_sanitizer_fuzz_xml schema_sanitizer_fuzz_parquet
    - name: Run externally bounded sanitized concurrency probe
      if: inputs.mode == 'native'
      env:
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
        LSAN_OPTIONS: ''
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
        SANITIZER_MODE: ${{ inputs.mode }}
        SANITIZER_NAME: ${{ inputs.sanitizer }}
        TSAN_OPTIONS: ''
        UBSAN_OPTIONS: ${{ inputs.sanitizer == 'asan-ubsan' && 'halt_on_error=1:print_stacktrace=1' || '' }}
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p .work/sanitizer-evidence
        if [[ "${RUNNER_SYSTEM}" == 'Windows' ]]; then
          executable=.work/build/platform-sanitizer/schema_sanitizer_sanitized_ordered_executor.exe
          arguments=(--case arena_backpressure_deadline)
          timeout_seconds=60
        else
          executable=.work/build/platform-sanitizer/schema_sanitizer_sanitized_ordered_executor
          # The standalone probe fixes its logical CPU governor at three so
          # every capability-bound case runs even when the host is smaller.
          arguments=(--fixed-cpu-capacity 3 --rounds 100)
          timeout_seconds=300
        fi
        [[ -f "${executable}" && ! -L "${executable}" ]] || {
          echo "Sanitized concurrency executable is missing or unsafe: ${executable}" >&2
          exit 2
        }
        python meta/ci/sanitizers/run_with_watchdog.py \
          --certificate ".work/sanitizer-evidence/watchdog-${SANITIZER_NAME}-${SANITIZER_MODE}-${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-concurrency.json" \
          --environment "ASAN_OPTIONS=${ASAN_OPTIONS}" \
          --environment "LSAN_OPTIONS=${LSAN_OPTIONS}" \
          --environment "TSAN_OPTIONS=${TSAN_OPTIONS}" \
          --environment "UBSAN_OPTIONS=${UBSAN_OPTIONS}" \
          --label "${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-${SANITIZER_NAME}-${SANITIZER_MODE}-concurrency" \
          --timeout "${timeout_seconds}" \
          -- "${executable}" "${arguments[@]}"
    - name: Exercise four-lane stealing under macOS ASan/UBSan
      if: inputs.mode == 'native' && runner.os == 'macOS'
      env:
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
        LSAN_OPTIONS: ''
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
        SANITIZER_MODE: ${{ inputs.mode }}
        SANITIZER_NAME: ${{ inputs.sanitizer }}
        TSAN_OPTIONS: ''
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      shell: bash
      run: |-
        set -euo pipefail
        executable=.work/build/platform-sanitizer/schema_sanitizer_sanitized_ordered_executor
        [[ -f "${executable}" && ! -L "${executable}" ]] || {
          echo "Sanitized concurrency executable is missing or unsafe: ${executable}" >&2
          exit 2
        }
        python meta/ci/sanitizers/run_with_watchdog.py \
          --certificate ".work/sanitizer-evidence/watchdog-${SANITIZER_NAME}-${SANITIZER_MODE}-${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-lane-stealing.json" \
          --environment "ASAN_OPTIONS=${ASAN_OPTIONS}" \
          --environment "LSAN_OPTIONS=${LSAN_OPTIONS}" \
          --environment "TSAN_OPTIONS=${TSAN_OPTIONS}" \
          --environment "UBSAN_OPTIONS=${UBSAN_OPTIONS}" \
          --label "${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-${SANITIZER_NAME}-${SANITIZER_MODE}-lane-stealing" \
          --timeout 60 \
          -- "${executable}" --fixed-cpu-capacity 4 --case lane_stealing
    - name: Exercise the instrumented extension through public conversions
      if: inputs.mode == 'native'
      env:
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
        LSAN_OPTIONS: ''
        PYTHONPATH: ${{ github.workspace }}/src
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
        SANITIZER_MODE: ${{ inputs.mode }}
        SANITIZER_NAME: ${{ inputs.sanitizer }}
        SCHEMA_SANITIZER_ABI_SMOKE_NATIVE_ROOT: ${{ github.workspace }}/.work/build/platform-sanitizer
        TSAN_OPTIONS: ''
        UBSAN_OPTIONS: ${{ inputs.sanitizer == 'asan-ubsan' && 'halt_on_error=1:print_stacktrace=1' || '' }}
      shell: bash
      run: |-
        set -euo pipefail
        launcher=.work/build/platform-sanitizer/schema_sanitizer_sanitizer_python_launcher
        if [[ "${RUNNER_SYSTEM}" == 'Windows' ]]; then
          launcher="${launcher}.exe"
        fi
        [[ -f "${launcher}" && ! -L "${launcher}" ]] || {
          echo "Sanitizer-first Python launcher is missing or unsafe: ${launcher}" >&2
          exit 2
        }
        python meta/ci/sanitizers/run_with_watchdog.py \
          --certificate ".work/sanitizer-evidence/watchdog-${SANITIZER_NAME}-${SANITIZER_MODE}-${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-extension.json" \
          --environment "ASAN_OPTIONS=${ASAN_OPTIONS}" \
          --environment "LSAN_OPTIONS=${LSAN_OPTIONS}" \
          --environment "TSAN_OPTIONS=${TSAN_OPTIONS}" \
          --environment "UBSAN_OPTIONS=${UBSAN_OPTIONS}" \
          --label "${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-${SANITIZER_NAME}-${SANITIZER_MODE}-extension" \
          --timeout 120 \
          -- "${launcher}" -u meta/ci/release/abi_public_smoke.py
    - name: Run platform fuzz regressions and mutation campaigns
      if: inputs.mode == 'native'
      env:
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
        LSAN_OPTIONS: ''
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
        SANITIZER_MODE: ${{ inputs.mode }}
        SANITIZER_NAME: ${{ inputs.sanitizer }}
        TSAN_OPTIONS: ''
        UBSAN_OPTIONS: ${{ inputs.sanitizer == 'asan-ubsan' && 'halt_on_error=1:print_stacktrace=1' || '' }}
      shell: bash
      run: >-
        python meta/ci/sanitizers/run_with_watchdog.py
        --certificate ".work/sanitizer-evidence/watchdog-${SANITIZER_NAME}-${SANITIZER_MODE}-${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-fuzz.json"
        --environment "ASAN_OPTIONS=${ASAN_OPTIONS}"
        --environment "LSAN_OPTIONS=${LSAN_OPTIONS}"
        --environment "TSAN_OPTIONS=${TSAN_OPTIONS}"
        --environment "UBSAN_OPTIONS=${UBSAN_OPTIONS}"
        --label "${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-${SANITIZER_NAME}-${SANITIZER_MODE}-fuzz"
        --timeout 900
        -- bash meta/ci/fuzz/run_fuzz_regressions.sh
        --build-root .work/build/platform-sanitizer/fuzz
        --campaign-runs 500
        --seed 15172026
        --max-len 262144
    - name: Run Linux ASan/UBSan fuzz regressions and mutation campaigns
      if: inputs.mode == 'linux-full'
      env:
        # CPython itself is not instrumented, so its extension suite keeps LSan
        # disabled. These standalone, fully instrumented binaries own the leak gate.
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
        LSAN_OPTIONS: exitcode=23
        TSAN_OPTIONS: ''
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      shell: bash
      run: >-
        python meta/ci/sanitizers/run_with_watchdog.py
        --certificate .work/sanitizer-evidence/watchdog-asan-ubsan-linux-full-Linux-X64-fuzz.json
        --environment "ASAN_OPTIONS=${ASAN_OPTIONS}"
        --environment "LSAN_OPTIONS=${LSAN_OPTIONS}"
        --environment "TSAN_OPTIONS=${TSAN_OPTIONS}"
        --environment "UBSAN_OPTIONS=${UBSAN_OPTIONS}"
        --label Linux-X64-asan-ubsan-linux-full-fuzz
        --timeout 900
        -- bash meta/ci/fuzz/run_fuzz_regressions.sh
        --build-root .work/build/platform-sanitizer/fuzz
        --engine libfuzzer
        --campaign-runs 1000
        --seed 15172026
        --max-len 262144
    - name: Certify the completed platform sanitizer workload
      env:
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
        SANITIZER_MODE: ${{ inputs.mode }}
        SANITIZER_NAME: ${{ inputs.sanitizer }}
      shell: bash
      run: |-
        set -euo pipefail
        certificate=".work/sanitizer-evidence/sanitizer-run-${RUNNER_SYSTEM}-${RUNNER_ARCHITECTURE}-${SANITIZER_NAME}.json"
        python meta/ci/sanitizers/certify_sanitizer_run.py create \
          --certificate "${certificate}" \
          --evidence-directory .work/sanitizer-evidence \
          --sanitizer "${SANITIZER_NAME}" \
          --mode "${SANITIZER_MODE}" \
          --runner-os "${RUNNER_SYSTEM}" \
          --runner-arch "${RUNNER_ARCHITECTURE}" \
          --github-sha "${GITHUB_SHA}" \
          --github-run-id "${GITHUB_RUN_ID}" \
          --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
        cat "${certificate}"
    - name: Upload platform sanitizer evidence
      id: upload-platform-sanitizer-evidence
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: sanitizer-certificate-${{ runner.os }}-${{ runner.arch }}-${{ inputs.sanitizer
          }}
        path: .work/sanitizer-evidence/*.json
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
    - name: Retry platform sanitizer evidence upload
      if: ${{ always() && steps.upload-platform-sanitizer-evidence.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: sanitizer-certificate-${{ runner.os }}-${{ runner.arch }}-${{ inputs.sanitizer
          }}
        path: .work/sanitizer-evidence/*.json
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
