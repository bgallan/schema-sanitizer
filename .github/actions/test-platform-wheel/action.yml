---
name: Test one platform-wheel shard
description: Install a certified wheel and execute one stable functional shard.
inputs:
  platform-name:
    description: Stable release-platform identifier used by the wheel artifact.
    required: true
  artifact:
    description: Short platform identifier used by evidence filenames.
    required: true
  shard:
    description: Functional workload (concurrency, memory-parquet, or io-pipeline).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        # Match the interpreter used to build every release wheel.
        python-version: 3.11.9
        cache: pip
        cache-dependency-path: meta/ci/requirements/platform-tests.txt
    - name: Download the certified platform wheel
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist-wheels-${{ inputs.platform-name }}
        path: wheelhouse
    - name: Install the wheel and full-suite dependencies
      shell: bash
      run: >-
        python -m pip install
        --retries 10
        --timeout 60
        -r meta/ci/requirements/platform-tests.txt
        wheelhouse/*.whl
    - name: Assert tests import the installed wheel
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        from pathlib import Path
        import schema_sanitizer as package
        import schema_sanitizer._core_abi3 as core
        checkout = Path.cwd().resolve()
        extension = Path(core.__file__).resolve()
        if extension.is_relative_to(checkout):
            raise SystemExit(f"native extension came from checkout, not wheel: {extension}")
        print(package.__version__, extension)
        PY
    - name: Compile and certify the Parquet runtime
      if: inputs.shard == 'memory-parquet'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
      shell: bash
      run: |
        set -euo pipefail
        python -m compileall -q src
        python meta/ci/parquet/check_parquet_contract_runtime.py
        mkdir -p artifacts
        python meta/ci/parquet/check_parquet_contract_runtime_suite.py \
          --certificate-output "artifacts/parquet-contract-runtime-certificate-${PLATFORM_ARTIFACT}.json"
    - name: Record runner CPU environment
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        TEST_SHARD: ${{ inputs.shard }}
      shell: bash
      run: >-
        python meta/ci/quality/record_runner_environment.py
        "artifacts/runner-cpu-${PLATFORM_ARTIFACT}-${TEST_SHARD}.json"
    - name: Cross-platform reader linear-scaling smoke
      if: inputs.shard == 'io-pipeline'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
      shell: bash
      run: >-
        python -I benchmarks/readers/linear_scaling.py
        --sizes 1024,2048
        --repeats 3
        --maximum-normalized-growth 8
        --latency-budget benchmarks/readers/linear_scaling_budget.json
        --wheel wheelhouse/*.whl
        --output "artifacts/reader-linear-scaling-${PLATFORM_ARTIFACT}.json"
    - name: Cross-platform threading benchmark smoke
      if: inputs.shard == 'concurrency'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
      shell: bash
      run: >-
        python -m benchmarks.concurrency.threading.matrix
        --profile ci
        --rows 256
        --warmups 0
        --repeats 1
        --only parquet
        --output "artifacts/threading-matrix-${PLATFORM_ARTIFACT}.json"
    - name: Cross-platform native completion stress
      if: inputs.shard == 'concurrency'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
      shell: bash
      run: |
        set -euo pipefail
        pytest -q -o pythonpath=. \
          -m native_stress \
          --durations=10 \
          --durations-min=0.05 \
          --junitxml="artifacts/pytest-native-stress-${PLATFORM_ARTIFACT}.xml" \
          tests/concurrency/test_ordered_executor_completion_probe.py \
          2>&1 | tee "artifacts/pytest-native-stress-durations-${PLATFORM_ARTIFACT}.log"
    - name: Run functional test shard
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        TEST_SHARD: ${{ inputs.shard }}
      shell: bash
      run: |
        set -euo pipefail
        case "${TEST_SHARD}" in
          concurrency)
            test_paths=(tests/concurrency)
            ;;
          memory-parquet)
            test_paths=(
              tests/memory
              tests/parquet
              tests/quality
              tests/sinks
            )
            ;;
          io-pipeline)
            test_paths=(
              tests/examples
              tests/io
              tests/pipeline
              tests/remote
              tests/schema
            )
            ;;
          *)
            echo "Unknown platform test shard: ${TEST_SHARD}" >&2
            exit 2
            ;;
        esac
        pytest -q -o pythonpath=. \
          -m 'not native_stress' \
          --durations=50 \
          --durations-min=0.05 \
          --junitxml="artifacts/pytest-${PLATFORM_ARTIFACT}-${TEST_SHARD}.xml" \
          "${test_paths[@]}" \
          2>&1 | tee "artifacts/pytest-durations-${PLATFORM_ARTIFACT}-${TEST_SHARD}.log"
    - name: Upload platform-shard evidence
      id: upload-platform-shard-evidence
      if: ${{ success() || (failure() && hashFiles('artifacts/**') != '') }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: platform-evidence-${{ inputs.artifact }}-${{ inputs.shard }}
        path: artifacts/
        if-no-files-found: error
        retention-days: 14
    - name: Retry platform-shard evidence upload
      if: ${{ always() && steps.upload-platform-shard-evidence.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: platform-evidence-${{ inputs.artifact }}-${{ inputs.shard }}
        path: artifacts/
        if-no-files-found: error
        retention-days: 14
        overwrite: true
