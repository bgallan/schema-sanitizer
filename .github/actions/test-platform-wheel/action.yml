---
name: Test one platform-wheel shard
description: Install a certified wheel and execute one stable functional shard.
inputs:
  platform-name:
    description: Stable release-platform identifier used by the wheel artifact.
    required: true
  artifact:
    description: Short platform identifier used by evidence filenames.
    required: true
  shard:
    description: Functional workload (concurrency, memory-parquet, or io-pipeline).
    required: true
runs:
  using: composite
  steps:
    - name: Require a supported platform-test tuple
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        PLATFORM_NAME: ${{ inputs.platform-name }}
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
        TEST_SHARD: ${{ inputs.shard }}
      shell: bash
      run: |-
        set -euo pipefail
        platform_tuple="${RUNNER_SYSTEM}:${RUNNER_ARCHITECTURE}:${PLATFORM_NAME}:${PLATFORM_ARTIFACT}"
        case "${platform_tuple}" in
          Linux:X64:linux-x86_64:linux | \
          Windows:X64:windows-amd64:windows | \
          macOS:X64:macos-x86_64:macos-x86_64 | \
          macOS:ARM64:macos-arm64:macos-arm64) ;;
          *)
            echo "Unsupported platform-test tuple: ${platform_tuple}" >&2
            exit 2
            ;;
        esac
        case "${TEST_SHARD}" in
          concurrency | memory-parquet | io-pipeline) ;;
          *)
            echo "Unknown platform test shard: ${TEST_SHARD}" >&2
            exit 2
            ;;
        esac
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        # Match the interpreter used to build every release wheel.
        python-version: 3.11.9
        cache: pip
        cache-dependency-path: |-
          meta/ci/requirements/platform-tests.txt
          meta/ci/requirements/python-artifact-sha256.lock
    - name: Reset generated platform-test paths
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- wheelhouse artifacts
        mkdir -p artifacts
    - name: Download the certified platform wheel
      id: download-platform-wheel
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist-wheels-${{ inputs.platform-name }}
        path: wheelhouse
    - name: Remove a partial platform-wheel download before retrying
      id: reset-platform-wheel-download
      if: ${{ always() && steps.download-platform-wheel.outcome == 'failure' }}
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- wheelhouse
    - name: Retry the certified platform-wheel download
      id: retry-platform-wheel-download
      if: ${{ always() && steps.download-platform-wheel.outcome == 'failure' && steps.reset-platform-wheel-download.outcome == 'success' }}
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist-wheels-${{ inputs.platform-name }}
        path: wheelhouse
    - name: Require the certified platform-wheel artifact
      id: platform-wheel-availability
      if: ${{ always() }}
      env:
        FIRST_DOWNLOAD_OUTCOME: ${{ steps.download-platform-wheel.outcome }}
        PLATFORM_NAME: ${{ inputs.platform-name }}
        RETRY_DOWNLOAD_OUTCOME: ${{ steps.retry-platform-wheel-download.outcome }}
      shell: bash
      run: |-
        set -euo pipefail
        if [[ "${FIRST_DOWNLOAD_OUTCOME}" != 'success' && \
          "${RETRY_DOWNLOAD_OUTCOME}" != 'success' ]]; then
          echo "::notice title=Skipped ${PLATFORM_NAME} shard::The upstream ${PLATFORM_NAME} build did not publish its certified artifact after two bounded download attempts. The wheel build and validation gate retain the root-cause failures; this dependent shard is a clean no-op."
          echo 'available=false' >> "${GITHUB_OUTPUT}"
        else
          echo 'available=true' >> "${GITHUB_OUTPUT}"
        fi
    - name: Install the wheel and functional-suite dependencies
      if: steps.platform-wheel-availability.outputs.available == 'true'
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/platform-tests.txt
      shell: bash
      run: |-
        set -euo pipefail
        python meta/ci/quality/ensure_pinned_pip.py
        python -m meta.ci.quality.install_locked_requirements \
          --lock meta/ci/requirements/platform-tests.txt --all
        python -m pip install --no-deps --only-binary=:all: wheelhouse/*.whl
        python -m pip check
    - name: Assert tests import the installed wheel
      if: steps.platform-wheel-availability.outputs.available == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import importlib
        import sys
        from pathlib import Path
        required = (
            "schema_sanitizer",
            "schema_sanitizer._core_abi3",
            "schema_sanitizer.api_impl.execution_context",
            "schema_sanitizer.core_impl.native_runtime",
        )
        for name in required:
            importlib.import_module(name)
        checkout = Path.cwd().resolve()
        provenance = {}
        for name, module in sorted(sys.modules.items()):
            if name != "schema_sanitizer" and not name.startswith("schema_sanitizer."):
                continue
            raw_path = getattr(module, "__file__", None)
            if not raw_path:
                continue
            path = Path(raw_path).resolve()
            provenance[name] = str(path)
            if path.is_relative_to(checkout):
                raise SystemExit(f"{name} came from checkout, not wheel: {path}")
        missing = sorted(set(required) - set(provenance))
        if missing:
            raise SystemExit(f"wheel provenance is incomplete: {missing}")
        print(provenance["schema_sanitizer"], provenance["schema_sanitizer._core_abi3"])
        PY
    - name: Record runner CPU environment
      if: steps.platform-wheel-availability.outputs.available == 'true'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        TEST_SHARD: ${{ inputs.shard }}
      shell: bash
      run: >-
        python meta/ci/quality/record_runner_environment.py
        "artifacts/runner-cpu-${PLATFORM_ARTIFACT}-${TEST_SHARD}.json"
    - name: Record a cross-platform reader scaling measurement
      if: steps.platform-wheel-availability.outputs.available == 'true' && inputs.shard
        == 'memory-parquet'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
      shell: bash
      run: |
        set -euo pipefail
        report="artifacts/reader-linear-scaling-${PLATFORM_ARTIFACT}.json"
        if python -I benchmarks/readers/linear_scaling.py \
          --sizes 1024,2048 \
          --repeats 3 \
          --maximum-normalized-growth 8 \
          --failure-confirmations 0 \
          --latency-budget benchmarks/readers/linear_scaling_budget.json \
          --wheel wheelhouse/*.whl \
          --commit-sha "${GITHUB_SHA}" \
          --output "${report}"; then
          exit 0
        fi
        python - "${report}" <<'PY'
        import json
        import sys
        from pathlib import Path
        report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        failures = report.get("failures")
        if not isinstance(failures, dict) or not failures:
            raise SystemExit("reader measurement failed without a timing-policy report")
        print(f"::warning title=Non-gating reader timing::host timing exceeded policy: {failures}")
        PY
    - name: Cross-platform threading benchmark smoke
      if: steps.platform-wheel-availability.outputs.available == 'true' && inputs.shard
        == 'concurrency'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
      shell: bash
      run: >-
        benchmarks/concurrency/threading/run_matrix.sh
        --profile ci
        --rows 256
        --warmups 0
        --repeats 1
        --only parquet
        --output "artifacts/threading-matrix-${PLATFORM_ARTIFACT}.json"
    - name: Cross-platform native completion stress
      if: steps.platform-wheel-availability.outputs.available == 'true' && inputs.shard
        == 'concurrency'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        SCHEMA_SANITIZER_EXPECT_NATIVE_STRESS_NODEIDS: tests/concurrency/test_ordered_executor_completion_probe.py::test_completion_probe_sustains_many_ring_generations
        SCHEMA_SANITIZER_INTEGRITY_EVIDENCE: artifacts/integrity-native-stress-${{ inputs.artifact }}.json
        SCHEMA_SANITIZER_PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        SCHEMA_SANITIZER_STRICT_TEST_RUNTIME: '1'
        SCHEMA_SANITIZER_TEST_SHARD: native-stress
      shell: bash
      run: |
        set -euo pipefail
        pytest -q -o pythonpath=. \
          -m native_stress \
          --durations=10 \
          --durations-min=0.05 \
          --junitxml="artifacts/pytest-native-stress-${PLATFORM_ARTIFACT}.xml" \
          tests/concurrency \
          2>&1 | tee "artifacts/pytest-native-stress-durations-${PLATFORM_ARTIFACT}.log"
    - name: Run the clean public 8-by-7 release matrix
      if: steps.platform-wheel-availability.outputs.available == 'true' && inputs.shard
        == 'concurrency'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        SCHEMA_SANITIZER_INTEGRITY_EVIDENCE: artifacts/integrity-release-matrix-${{ inputs.artifact }}.json
        SCHEMA_SANITIZER_PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        SCHEMA_SANITIZER_STRICT_TEST_RUNTIME: '1'
        SCHEMA_SANITIZER_TEST_SHARD: release-matrix
      shell: bash
      run: |
        set -euo pipefail
        pytest -q -o pythonpath=. \
          --durations=5 \
          --durations-min=0.05 \
          --junitxml="artifacts/pytest-release-matrix-${PLATFORM_ARTIFACT}.xml" \
          tests/concurrency/test_concurrency_route_release_gate.py \
          2>&1 | tee "artifacts/pytest-release-matrix-durations-${PLATFORM_ARTIFACT}.log"
    - name: Run functional test shard
      if: steps.platform-wheel-availability.outputs.available == 'true'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        SCHEMA_SANITIZER_INTEGRITY_EVIDENCE: artifacts/integrity-${{ inputs.artifact }}-${{
          inputs.shard }}.json
        SCHEMA_SANITIZER_PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        SCHEMA_SANITIZER_STRICT_TEST_RUNTIME: '1'
        SCHEMA_SANITIZER_TEST_SHARD: ${{ inputs.shard }}
        TEST_SHARD: ${{ inputs.shard }}
      shell: bash
      run: |-
        set -euo pipefail
        case "${TEST_SHARD}" in
          concurrency)
            test_paths=(
              tests/concurrency
            )
            ;;
          memory-parquet)
            test_paths=(
              tests/memory
              tests/parquet
              tests/sinks
            )
            ;;
          io-pipeline)
            test_paths=(
              tests/examples
              tests/io
              tests/pipeline
              tests/remote
              tests/schema
            )
            ;;
          *)
            echo "Unknown platform test shard: ${TEST_SHARD}" >&2
            exit 2
            ;;
        esac
        # Bash 3.2 treats an empty-array expansion as unbound under nounset.
        pytest_command=(
          pytest -q -o pythonpath=.
          -m 'not native_stress'
          --durations=50
          --durations-min=0.05
          --junitxml="artifacts/pytest-${PLATFORM_ARTIFACT}-${TEST_SHARD}.xml"
        )
        if [[ "${TEST_SHARD}" == 'concurrency' ]]; then
          # The release matrix runs in a fresh process and owns its complete evidence.
          pytest_command+=(
            --ignore=tests/concurrency/test_concurrency_route_release_gate.py
            --ignore=tests/concurrency/test_concurrency_wide_fixed_jsonl_matches_single_oracle.py
          )
        elif [[ "${TEST_SHARD}" == 'memory-parquet' ]]; then
          test_paths+=(
            tests/concurrency/test_concurrency_wide_fixed_jsonl_matches_single_oracle.py
            tests/quality/test_fuzz_regression_runner.py::test_standalone_mutation_stream_matches_its_cross_library_golden
          )
        fi
        "${pytest_command[@]}" \
          "${test_paths[@]}" \
          2>&1 | tee "artifacts/pytest-durations-${PLATFORM_ARTIFACT}-${TEST_SHARD}.log"
    - name: Certify the Parquet runtime from functional evidence
      if: steps.platform-wheel-availability.outputs.available == 'true' && inputs.shard
        == 'memory-parquet'
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
      shell: bash
      run: |-
        set -euo pipefail
        python meta/ci/parquet/check_parquet_contract_runtime_suite.py \
          --junit-xml "artifacts/pytest-${PLATFORM_ARTIFACT}-memory-parquet.xml" \
          --certificate-output "artifacts/parquet-contract-runtime-certificate-${PLATFORM_ARTIFACT}.json"
    - name: Consolidate the exact platform-job evidence
      if: ${{ always() && steps.platform-wheel-availability.outputs.available == 'true' }}
      env:
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        TEST_SHARD: ${{ inputs.shard }}
      shell: bash
      run: |-
        set -euo pipefail
        python meta/ci/quality/platform_test_evidence.py create \
          --evidence-dir artifacts \
          --certificate "artifacts/platform-test-certificate-${PLATFORM_ARTIFACT}-${TEST_SHARD}.json" \
          --platform "${PLATFORM_ARTIFACT}" \
          --shard "${TEST_SHARD}" \
          --github-sha "${GITHUB_SHA}" \
          --github-run-id "${GITHUB_RUN_ID}" \
          --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
    - name: Upload compact platform-test evidence
      if: ${{ always() && steps.platform-wheel-availability.outputs.available == 'true' }}
      id: upload-platform-test-evidence
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: platform-test-evidence-${{ inputs.platform-name }}-${{ inputs.shard
          }}
        path: artifacts
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: true
    - name: Retry the exact platform-test evidence upload
      if: ${{ always() && steps.platform-wheel-availability.outputs.available == 'true' && steps.upload-platform-test-evidence.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: platform-test-evidence-${{ inputs.platform-name }}-${{ inputs.shard
          }}
        path: artifacts
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: true
