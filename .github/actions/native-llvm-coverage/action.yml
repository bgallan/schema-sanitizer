---
name: Run native LLVM coverage
description: Build an LLVM-instrumented extension and publish native coverage.
runs:
  using: composite
  steps:
    - name: Install LLVM 18 coverage toolchain
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
          install -y clang-18=1:18.1.3-1ubuntu1 llvm-18=1:18.1.3-1ubuntu1
        clang-18 --version
        llvm-profdata-18 --version
        llvm-cov-18 --version
        [[ "$(dpkg-query -W -f='${Version}' clang-18)" == '1:18.1.3-1ubuntu1' ]]
        [[ "$(dpkg-query -W -f='${Version}' llvm-18)" == '1:18.1.3-1ubuntu1' ]]
        [[ "$(clang-18 -dumpfullversion -dumpversion)" == '18.1.3' ]]
        llvm-profdata-18 --version | grep -F 'LLVM version 18.1.3'
        llvm-cov-18 --version | grep -F 'LLVM version 18.1.3'
    - name: Install native coverage prerequisites
      env:
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install pip==26.2.1 ninja==1.13.0 cmake==4.3.4 \
          scikit-build-core==0.11.6
        python -m pip install -r meta/ci/requirements/platform-tests.txt
    - name: Build and install instrumented package
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        rm -rf -- coverage-native .work/build
        mkdir -p coverage-native/raw
        python -m pip install --no-build-isolation -v \
          --config-settings=install.strip=false \
          --config-settings=cmake.define.CMAKE_C_COMPILER=clang-18 \
          --config-settings=cmake.define.CMAKE_CXX_COMPILER=clang++-18 \
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_LTO=OFF \
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_COVERAGE=ON \
          --config-settings=cmake.define.SCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_WERROR=ON \
          --config-settings=cmake.define.SCHEMA_SANITIZER_COVERAGE_PROFILE_PATTERN='${{ github.workspace }}/coverage-native/raw/schema-sanitizer-%p.profraw' \
          .
    - name: Run native coverage suites
      shell: bash
      run: |
        set -euo pipefail
        for suite in regular adversarial integration; do
          mkdir -p "coverage-native/raw/${suite}"
          python meta/ci/quality/run_coverage_suite.py native "${suite}"
          mv coverage-native/raw/schema-sanitizer-*.profraw \
            "coverage-native/raw/${suite}/"
        done
    - name: Render LLVM reports
      shell: bash
      run: |-
        set -euo pipefail
        EXTENSION=$(python - <<'PY'
        import schema_sanitizer._core_abi3 as core
        print(core.__file__)
        PY
        )
        for suite in regular adversarial integration; do
          llvm-profdata-18 merge -sparse coverage-native/raw/${suite}/*.profraw \
            -o coverage-native/${suite}.profdata
          llvm-cov-18 report "${EXTENSION}" \
            -compilation-dir="${GITHUB_WORKSPACE}" \
            -instr-profile=coverage-native/${suite}.profdata \
            > coverage-native/${suite}-summary.txt
        done
        llvm-profdata-18 merge -sparse coverage-native/raw/*/*.profraw \
          -o coverage-native/combined.profdata
        render_diagnostics=coverage-native/llvm-cov-render.stderr
        if ! llvm-cov-18 show "${EXTENSION}" \
          -compilation-dir="${GITHUB_WORKSPACE}" \
          -instr-profile=coverage-native/combined.profdata \
          -format=html \
          -show-branches=count \
          -output-dir=coverage-native/html \
          2>"${render_diagnostics}"; then
          cat "${render_diagnostics}" >&2
          exit 1
        fi
        if [[ -s "${render_diagnostics}" ]]; then
          cat "${render_diagnostics}" >&2
          exit 1
        fi
        rm -- "${render_diagnostics}"
        test -s coverage-native/html/index.html
        llvm-cov-18 report "${EXTENSION}" \
          -compilation-dir="${GITHUB_WORKSPACE}" \
          -instr-profile=coverage-native/combined.profdata \
          > coverage-native/combined-summary.txt
        cat coverage-native/combined-summary.txt
