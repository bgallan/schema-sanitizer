---
name: Build and certify a platform wheel
description: Build one ABI3 wheel and run the platform-independent ABI checks.
inputs:
  platform-name:
    description: Stable release-platform identifier used by the wheel artifact.
    required: true
  artifact:
    description: Short platform identifier used by platform-specific conditions.
    required: true
  arch:
    description: cibuildwheel architecture selector.
    required: true
runs:
  using: composite
  steps:
    - name: Require a supported build-platform tuple
      env:
        BUILD_ARCH: ${{ inputs.arch }}
        PLATFORM_ARTIFACT: ${{ inputs.artifact }}
        PLATFORM_NAME: ${{ inputs.platform-name }}
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
        RUNNER_SYSTEM: ${{ runner.os }}
      shell: bash
      run: |-
        set -euo pipefail
        platform_tuple="${RUNNER_SYSTEM}:${RUNNER_ARCHITECTURE}:${PLATFORM_NAME}:${PLATFORM_ARTIFACT}:${BUILD_ARCH}"
        case "${platform_tuple}" in
          Linux:X64:linux-x86_64:linux:x86_64 | \
          Windows:X64:windows-amd64:windows:AMD64 | \
          macOS:X64:macos-x86_64:macos-x86_64:x86_64 | \
          macOS:ARM64:macos-arm64:macos-arm64:arm64) ;;
          *)
            echo "Unsupported build-platform tuple: ${platform_tuple}" >&2
            exit 2
            ;;
        esac
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        # Use one exact patch on all four platforms. Test shards use it too.
        python-version: 3.11.9
        cache: pip
        cache-dependency-path: |-
          pyproject.toml
          meta/ci/requirements/build-tools.txt
    - name: Install wheel tooling
      env:
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |-
        set -euo pipefail
        python meta/ci/quality/ensure_pinned_pip.py
        python -m pip install --only-binary=:all: \
          abi3audit==0.0.26 cibuildwheel==4.2.0 pytest==9.1.1
    - name: Assert the build environment has no PyArrow
      shell: bash
      run: >-
        python -c
        "import importlib.util,sys;
        sys.exit(0 if importlib.util.find_spec('pyarrow') is None else 1)"
    - name: Reset the owned Windows CPython package-cache path
      if: runner.os == 'Windows'
      shell: bash
      run: |-
        set -euo pipefail
        python - <<'PY'
        import shutil
        from pathlib import Path
        workspace = Path.cwd().resolve()
        cache_root = workspace / ".work" / "cache" / "nuget"
        for directory in (cache_root.parents[1], cache_root.parent, cache_root):
            if directory.is_symlink() or (directory.exists() and not directory.is_dir()):
                raise SystemExit(f"CPython package-cache parent is unsafe: {directory}")
            directory.mkdir(parents=True, exist_ok=True)
        target = cache_root / "python.3.11.9.nupkg"
        if target.is_symlink() or target.is_file():
            target.unlink()
        elif target.exists():
            shutil.rmtree(target)
        PY
    - name: Restore the verified Windows CPython package
      if: runner.os == 'Windows'
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .work/cache/nuget/python.3.11.9.nupkg
        key: >-
          nuget-cpython-v1-${{ runner.os }}-${{ runner.arch
          }}-python-3.11.9-cibuildwheel-4.2.0-9283876d58c017e0e846f95b490da3bca0fc0a6ee1134b2870677cfb7eec3c67
    - name: Install the verified Windows CPython package
      if: runner.os == 'Windows'
      shell: bash
      env:
        PYTHON_NUPKG_SHA256: 9283876d58c017e0e846f95b490da3bca0fc0a6ee1134b2870677cfb7eec3c67  # pragma: allowlist secret
      run: |-
        set -euo pipefail
        windows_python=$(
          python meta/ci/native/install_windows_cpython.py "${PYTHON_NUPKG_SHA256}"
        )
        "${windows_python}" -I - <<'PY'
        import platform
        import struct
        import sys
        if sys.version_info[:3] != (3, 11, 9):
            raise SystemExit(f"unexpected Windows Python version: {sys.version_info[:3]}")
        if struct.calcsize("P") != 8:
            raise SystemExit("the Windows wheel build requires a 64-bit interpreter")
        if platform.machine().upper() != "AMD64":
            raise SystemExit(f"unexpected Windows Python architecture: {platform.machine()}")
        PY
    - name: Prevent Arrow C++ headers
      if: runner.os == 'Linux'
      shell: bash
      run: meta/ci/native/check_no_arrow_cpp.sh
    - name: Select the macOS release toolchain
      if: runner.os == 'macOS'
      env:
        DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      shell: bash
      run: |
        set -euo pipefail
        xcode_version=$(xcodebuild -version)
        [[ "${xcode_version}" == $'Xcode 16.4\nBuild version 16F6' ]]
        [[ "$(xcrun --sdk macosx15.5 --show-sdk-version)" == '15.5' ]]
        clang_version=$(xcrun --sdk macosx15.5 clang --version)
        [[ "${clang_version%%$'\n'*}" == \
          'Apple clang version 17.0.0 (clang-1700.0.13.5)' ]]
    - name: Select the reviewed Windows release toolchain
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        vs_root='C:/Program Files/Microsoft Visual Studio/2022/Enterprise'
        tools_version_file="${vs_root}/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt"
        version_file="${vs_root}/VC/Auxiliary/Build/Microsoft.VCRedistVersion.default.txt"
        [[ -f "${tools_version_file}" && -f "${version_file}" ]] || {
          echo "VS 2022 toolchain version files are missing below ${vs_root}" >&2
          exit 2
        }
        tools_version=$(tr -d '\r\n' < "${tools_version_file}")
        redist_version=$(tr -d '\r\n' < "${version_file}")
        [[ "${tools_version}" == '14.44.35207' ]] || {
          echo "Unreviewed VS 2022 compiler tools: ${tools_version}" >&2
          exit 2
        }
        [[ "${redist_version}" == '14.44.35211' ]] || {
          echo "Unreviewed VS 2022 redistributable: ${redist_version}" >&2
          exit 2
        }
        compiler="${vs_root}/VC/Tools/MSVC/${tools_version}/bin/Hostx64/x64/cl.exe"
        sdk_root='C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0'
        [[ -f "${compiler}" && -d "${sdk_root}" ]] || {
          echo 'The reviewed MSVC 14.44.35207 / Windows SDK 10.0.26100.0 is unavailable' >&2
          exit 2
        }
        redist_directory="${vs_root}/VC/Redist/MSVC/${redist_version}/x64/Microsoft.VC143.CRT"
        for dll in \
          msvcp140.dll msvcp140_1.dll msvcp140_atomic_wait.dll \
          vcruntime140.dll vcruntime140_1.dll; do
          [[ -f "${redist_directory}/${dll}" ]] || {
            echo "Required v143 redistributable DLL is missing: ${redist_directory}/${dll}" >&2
            exit 2
          }
        done
        rm -rf -- .work/msvc-redist
        mkdir -p .work/msvc-redist
        cp -- "${redist_directory}"/*.dll .work/msvc-redist/
    - name: Build and test the CPython 3.11 ABI3 wheel
      env:
        CIBW_ARCH: ${{ inputs.arch }}
        CIBW_CONFIG_SETTINGS: >-
          build.verbose=false
          cmake.define.SCHEMA_SANITIZER_ENABLE_PCH=ON
        # macOS and Windows inherit these host-absolute constraints without
        # overriding platform-specific cibuildwheel configuration. Linux uses
        # cibuildwheel's copied-project path inside its OCI container.
        PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        CIBW_ENVIRONMENT_LINUX: >-
          PIP_BUILD_CONSTRAINT=/project/meta/ci/requirements/build-tools.txt
          PIP_CONSTRAINT=/project/meta/ci/requirements/build-tools.txt
        # cibuildwheel Linux builds run in a container; explicitly propagate
        # the deterministic timestamp and non-interactive pip policy.
        CIBW_ENVIRONMENT_PASS_LINUX: >-
          SOURCE_DATE_EPOCH PIP_DISABLE_PIP_VERSION_CHECK PIP_NO_INPUT
          PIP_RETRIES PIP_TIMEOUT PYTHONHASHSEED PYTHONUTF8 TZ
      shell: bash
      run: |-
        set -euo pipefail
        rm -rf -- wheelhouse .work/build .work/delvewheel-extract
        mkdir -p .work
        SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
        [[ "${SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]
        export SOURCE_DATE_EPOCH
        # Ninja receives no ambient cap; the Windows config reintroduces one lane.
        unset CMAKE_BUILD_PARALLEL_LEVEL
        python -m cibuildwheel --output-dir wheelhouse --archs "${CIBW_ARCH}" \
          2>&1 | tee .work/cibuildwheel.log
        if grep -Fq -- 'Exception ignored in:' .work/cibuildwheel.log; then
          echo 'cibuildwheel reported an unraisable exception' >&2
          exit 2
        fi
        if grep -Fq -- 'win-x86-commandline/latest/nuget.exe' \
          .work/cibuildwheel.log; then
          echo 'cibuildwheel attempted a mutable NuGet download' >&2
          exit 2
        fi
        if grep -Fq -- 'nuget.exe install python' .work/cibuildwheel.log || \
          grep -Fq -- '-FallbackSource' .work/cibuildwheel.log; then
          echo 'cibuildwheel ignored the verified local CPython installation' >&2
          exit 2
        fi
    - name: Certify the Windows release toolchain
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        caches=(.work/build/*/CMakeCache.txt)
        if [[ "${#caches[@]}" -ne 1 ]]; then
          echo "Expected exactly one root Windows CMake cache, found ${#caches[@]}" >&2
          for candidate in "${caches[@]}"; do
            printf '  %s\n' "${candidate}" >&2
          done
          exit 2
        fi
        cache="${caches[0]}"
        if [[ ! -f "${cache}" || -L "${cache}" ]]; then
          echo "Authoritative Windows CMake cache is missing or unsafe: ${cache}" >&2
          exit 2
        fi
        expected=(
          'CMAKE_PROJECT_NAME:STATIC=schema_sanitizer'
          'CMAKE_GENERATOR:INTERNAL=Visual Studio 17 2022'
          'CMAKE_GENERATOR_INSTANCE:INTERNAL=C:/Program Files/Microsoft Visual Studio/2022/Enterprise'
          'CMAKE_GENERATOR_PLATFORM:INTERNAL=x64'
          'CMAKE_GENERATOR_TOOLSET:INTERNAL=v143,host=x64'
          'SCHEMA_SANITIZER_MSVC_COMPILE_PROCESSES:STRING=auto'
        )
        for entry in "${expected[@]}"; do
          grep -Fx -- "${entry}" "${cache}" >/dev/null || {
            echo "Windows release toolchain mismatch: missing '${entry}' in ${cache}" >&2
            exit 2
          }
        done
        grep -F -- '-- The CXX compiler identification is MSVC 19.44.35228.0' \
          .work/cibuildwheel.log >/dev/null || {
          echo 'Windows compiler version is not the reviewed MSVC 19.44.35228.0' >&2
          exit 2
        }
        grep -F -- '-- Selecting Windows SDK version 10.0.26100.0 ' \
          .work/cibuildwheel.log >/dev/null || {
          echo 'Windows SDK version is not the reviewed 10.0.26100.0' >&2
          exit 2
        }
        python - "${cache}" <<'PY'
        import sys
        from pathlib import Path
        values = {}
        for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
            key_and_type, separator, value = line.partition("=")
            key, type_separator, _cache_type = key_and_type.partition(":")
            if separator and type_separator:
                values[key] = value.replace("\\", "/")
        expected_compiler = (
            "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/"
            "MSVC/14.44.35207/bin/Hostx64/x64/cl.exe"
        )
        for key in ("CMAKE_C_COMPILER", "CMAKE_CXX_COMPILER"):
            if values.get(key) != expected_compiler:
                raise SystemExit(
                    f"Windows release {key} mismatch: {values.get(key)!r} != {expected_compiler!r}"
                )
        if values.get("CMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION") != "10.0.26100.0":
            raise SystemExit(
                "Windows release SDK mismatch: "
                f"{values.get('CMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION')!r}"
            )
        PY
    - name: Audit the CPython stable ABI
      shell: bash
      run: |
        set -euo pipefail
        python -m abi3audit --strict --report wheelhouse/*.whl
        python meta/ci/release/check_distribution_contents.py wheelhouse/*.whl
    - name: Certify the platform-native wheel payload
      env:
        PLATFORM_NAME: ${{ inputs.platform-name }}
      shell: bash
      run: |-
        set -euo pipefail
        shopt -s nullglob
        wheels=(wheelhouse/*.whl)
        if [[ "${#wheels[@]}" -ne 1 ]]; then
          echo "Expected exactly one platform wheel, found ${#wheels[@]}" >&2
          exit 2
        fi
        certificate="wheelhouse/platform-wheel-certificate-${PLATFORM_NAME}.json"
        python meta/ci/native/certify_platform_wheel.py create \
          --wheel "${wheels[0]}" \
          --certificate "${certificate}" \
          --platform "${PLATFORM_NAME}" \
          --github-sha "${GITHUB_SHA}" \
          --github-run-id "${GITHUB_RUN_ID}" \
          --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
        cat "${certificate}"
    - name: Install the built wheel without adapters
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --only-binary=:all: wheelhouse/*.whl
        python - <<'PY'
        from pathlib import Path
        import schema_sanitizer as package
        import schema_sanitizer._core_abi3 as core
        checkout = Path.cwd().resolve()
        extension = Path(core.__file__).resolve()
        if extension.is_relative_to(checkout):
            raise SystemExit(f"native extension came from checkout, not wheel: {extension}")
        print(package.__version__, extension)
        PY
        pytest --collect-only -q \
          tests/parquet/test_parquet_contract_cases.py
    - name: Verify the extension does not link Arrow C++
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        EXT_PATH=$(python - <<'PY'
        import schema_sanitizer._core_abi3 as core
        print(core.__file__)
        PY
        )
        meta/ci/native/check_no_libarrow_linkage.sh "${EXT_PATH}"
    - name: Set up CPython 3.12 for stable-ABI functional coverage
      if: inputs.artifact == 'linux'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: 3.12.11
    - name: Exercise the ABI3 wheel on CPython 3.12
      if: inputs.artifact == 'linux'
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        python meta/ci/quality/ensure_pinned_pip.py
        python -m pip install --only-binary=:all: pyarrow==25.0.1 wheelhouse/*.whl
        python -I meta/ci/release/downstream_smoke.py
    - name: Set up CPython 3.13 for stable-ABI functional coverage
      if: inputs.artifact == 'linux'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: 3.13.15
    - name: Exercise the ABI3 wheel on CPython 3.13
      if: inputs.artifact == 'linux'
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        python meta/ci/quality/ensure_pinned_pip.py
        python -m pip install --only-binary=:all: pyarrow==25.0.1 wheelhouse/*.whl
        python -I meta/ci/release/downstream_smoke.py
    - name: Set up the newest supported Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: 3.14.7
    - name: Verify the ABI3 wheel on Python 3.14
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        python meta/ci/quality/ensure_pinned_pip.py
        python -m pip install --only-binary=:all: pyarrow==25.0.1 wheelhouse/*.whl
        python -c "import sys, schema_sanitizer as s, schema_sanitizer._core_abi3 as c; print(sys.version.split()[0], s.__version__, c.__file__)"
        python -I meta/ci/release/abi_public_smoke.py
    - name: Exercise the ABI3 wheel on CPython 3.14
      if: inputs.artifact == 'linux'
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --only-binary=:all: pyarrow==25.0.1
        python -I meta/ci/release/downstream_smoke.py
    - name: Set up the next CPython release candidate outside pull requests
      if: inputs.artifact == 'linux' && github.event_name != 'pull_request'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: 3.15.0-rc.1
    - name: Probe the ABI3 wheel on CPython 3.15 RC
      if: inputs.artifact == 'linux' && github.event_name != 'pull_request'
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
      shell: bash
      run: |-
        set -euo pipefail
        python meta/ci/quality/ensure_pinned_pip.py
        python -m pip install --only-binary=:all: wheelhouse/*.whl
        python -I -c \
          "import sys, schema_sanitizer as s, schema_sanitizer._core_abi3 as c; options=s.SanitizeOptions(); print(sys.version.split()[0], s.__version__, type(options).__name__, c.__file__)"
    - name: Upload the certified platform wheel
      id: upload-certified-platform-wheel
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist-wheels-${{ inputs.platform-name }}
        path: |-
          wheelhouse/*.whl
          wheelhouse/platform-wheel-certificate-*.json
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
    - name: Retry certified platform wheel upload
      if: ${{ always() && steps.upload-certified-platform-wheel.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist-wheels-${{ inputs.platform-name }}
        path: |-
          wheelhouse/*.whl
          wheelhouse/platform-wheel-certificate-*.json
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
