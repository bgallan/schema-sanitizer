---
name: Run GCC ThreadSanitizer
description: Build and exercise the full extension under GCC ThreadSanitizer.
runs:
  using: composite
  steps:
    - name: Install GCC 14 and build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 g++-14
        python -m pip install -U pip ninja 'cmake>=4.3,<4.4' pytest pyarrow
    - name: Configure and build the fully instrumented extension
      shell: bash
      run: |
        cmake -S . -B build/tsan -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DPython3_EXECUTABLE="$(command -v python)" \
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF \
          -DSCHEMA_SANITIZER_SANITIZER=tsan \
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON \
          -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone \
          -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled \
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
        cmake --build build/tsan --parallel 4
    - name: Run TSan fuzz regressions and mutation campaigns
      shell: bash
      run: >-
        python meta/ci/fuzz/run_fuzz_regressions.py
        --build-root build/tsan/fuzz
        --campaign-runs 1000
        --seed 15172026
        --max-len 262144
    - name: Build sanitizer-first CPython launcher
      shell: bash
      run: |
        set -euo pipefail
        read -r -a python_embed_cflags <<< "$(python3-config --embed --cflags)"
        read -r -a python_embed_ldflags <<< "$(python3-config --embed --ldflags)"
        g++-14 -std=c++17 -fsanitize=thread \
          -fno-omit-frame-pointer \
          "${python_embed_cflags[@]}" \
          meta/ci/sanitizers/tsan_python_launcher.cc \
          -o python-tsan \
          "${python_embed_ldflags[@]}"
    - name: Run the executor and all full-extension TSan domains
      shell: bash
      run: >-
        meta/ci/sanitizers/run_tsan_extension_suite.sh
        build/tsan ./python-tsan 2
        "$(python -c 'import site; print(site.getsitepackages()[0])')"
