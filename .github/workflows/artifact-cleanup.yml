---
name: Prune successful run artifacts
on:
  # The trusted default-branch definition never executes source-run content.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Publish to PyPI]
    types: [completed]
  # A trusted maintainer can reconcile a successful run when delivery of its
  # workflow_run event was missed. The script validates the run again by API.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful CI or Publish workflow run ID
        required: true
        type: string
permissions: {}
concurrency:
  group: artifact-prune-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false
jobs:
  prune-transient-artifacts:
    name: retain only the four certified wheel artifacts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # This sole job needs deletion authority for consumed source-run artifacts.
      actions: write  # zizmor: ignore[excessive-permissions]
    steps:
      # workflow_run executes this default-branch workflow with write authority.
      # Never check out or execute files from the triggering workflow run here.
      - name: Delete every consumed transient artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |-
            const repository = context.payload.repository;
            const repositoryName = `${context.repo.owner}/${context.repo.repo}`;
            const allowedSources = new Map([
              [
                '.github/workflows/ci.yml',
                {name: 'CI', events: new Set(['pull_request', 'push'])},
              ],
              [
                '.github/workflows/publish.yml',
                {name: 'Publish to PyPI', events: new Set(['workflow_dispatch'])},
              ],
            ]);
            if (!repository || repository.full_name !== repositoryName) {
              throw new Error('refusing to prune outside the current repository');
            }
            if (
              context.eventName === 'workflow_dispatch' &&
              (context.ref !== 'refs/heads/main' || repository.default_branch !== 'main')
            ) {
              throw new Error('manual cleanup must run from the default main branch');
            }
            let source;
            if (context.eventName === 'workflow_run') {
              source = context.payload.workflow_run;
            } else if (context.eventName === 'workflow_dispatch') {
              const requested = context.payload.inputs?.source_run_id;
              if (typeof requested !== 'string' || !/^[1-9][0-9]*$/.test(requested)) {
                throw new Error('source_run_id must be a positive decimal integer');
              }
              const requestedId = Number(requested);
              if (!Number.isSafeInteger(requestedId)) {
                throw new Error('source_run_id exceeds the safe integer range');
              }
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: requestedId,
              });
              source = response.data;
            } else {
              throw new Error(`unsupported cleanup event: ${context.eventName}`);
            }
            const allowedSource = allowedSources.get(source?.path);
            if (
              !source ||
              source.conclusion !== 'success' ||
              !allowedSource ||
              source.name !== allowedSource.name ||
              !allowedSource.events.has(source.event) ||
              !Number.isSafeInteger(source.id) ||
              source.id <= 0 ||
              !Number.isSafeInteger(source.run_attempt) ||
              source.run_attempt <= 0 ||
              !Number.isFinite(Date.parse(source.updated_at))
            ) {
              throw new Error('refusing to prune an unverified workflow run');
            }
            const sourceRunIsCurrent = async () => {
              const {data: current} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: source.id,
              });
              return (
                current.id === source.id &&
                current.path === source.path &&
                current.name === source.name &&
                current.event === source.event &&
                current.run_attempt === source.run_attempt &&
                current.status === 'completed' &&
                current.conclusion === 'success'
              );
            };
            if (!(await sourceRunIsCurrent())) {
              core.notice('source run advanced to another attempt; skipping stale cleanup');
              return;
            }
            const retainedNames = [
              'dist-wheels-linux-x86_64',
              'dist-wheels-macos-arm64',
              'dist-wheels-macos-x86_64',
              'dist-wheels-windows-amd64',
            ];
            const retained = new Set(retainedNames);
            const sourceCompletedAt = Date.parse(source.updated_at);
            const sleep = (milliseconds) =>
              new Promise((resolve) => setTimeout(resolve, milliseconds));
            const listArtifacts = async () =>
              github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: source.id,
                per_page: 100,
              });
            const validateArtifacts = (artifacts) => {
              const ids = new Set();
              for (const artifact of artifacts) {
                if (
                  !Number.isSafeInteger(artifact.id) ||
                  artifact.id <= 0 ||
                  ids.has(artifact.id) ||
                  typeof artifact.name !== 'string' ||
                  artifact.name.length === 0 ||
                  !Number.isFinite(Date.parse(artifact.created_at))
                ) {
                  throw new Error('source run returned malformed artifact metadata');
                }
                ids.add(artifact.id);
              }
            };
            const selectRetained = (artifacts) => {
              const selected = new Map();
              for (const artifact of artifacts) {
                if (
                  retained.has(artifact.name) &&
                  (!selected.has(artifact.name) || selected.get(artifact.name).id < artifact.id)
                ) {
                  selected.set(artifact.name, artifact);
                }
              }
              return selected;
            };
            const consistencyTimeoutMs = 120000;
            const consistencyPollMs = 2000;
            let artifacts = [];
            let selected;
            let stableInventory;
            let inventoryStable = false;
            const inventoryDeadline = Date.now() + consistencyTimeoutMs;
            while (true) {
              artifacts = await listArtifacts();
              validateArtifacts(artifacts);
              const newerArtifacts = artifacts.filter(
                (artifact) => Date.parse(artifact.created_at) > sourceCompletedAt,
              );
              if (newerArtifacts.length !== 0) {
                core.notice('newer-attempt artifacts detected; skipping stale cleanup');
                return;
              }
              selected = selectRetained(artifacts);
              const missing = retainedNames.filter((name) => !selected.has(name));
              if (missing.length === 0) {
                const inventory = JSON.stringify(
                  artifacts
                    .map((artifact) => ({id: artifact.id, name: artifact.name}))
                    .sort((left, right) => left.id - right.id),
                );
                if (inventory === stableInventory) {
                  inventoryStable = true;
                  break;
                }
                stableInventory = inventory;
                core.info('waiting for one stable complete artifact-inventory read');
              } else {
                stableInventory = undefined;
                core.info(`waiting for retained artifact inventory: ${missing.join(', ')}`);
              }
              if (Date.now() >= inventoryDeadline) {
                break;
              }
              await sleep(
                Math.max(0, Math.min(consistencyPollMs, inventoryDeadline - Date.now())),
              );
            }
            if (!inventoryStable || !selected || selected.size !== retainedNames.length) {
              const counts = Object.fromEntries(
                retainedNames.map((name) => [
                  name,
                  artifacts.filter((artifact) => artifact.name === name).length,
                ]),
              );
              throw new Error(
                `successful run is missing wheel artifacts after bounded polling: ${JSON.stringify(counts)}`,
              );
            }
            const retainedIds = new Set(
              retainedNames.map((name) => selected.get(name).id),
            );
            const deletionTargets = artifacts
              .filter((artifact) => !retainedIds.has(artifact.id))
              .sort((left, right) => {
                if (left.name !== right.name) {
                  return left.name < right.name ? -1 : 1;
                }
                return left.id - right.id;
              });
            if (!(await sourceRunIsCurrent())) {
              core.notice('source run began another attempt; skipping stale cleanup');
              return;
            }
            for (const artifact of deletionTargets) {
              if (!(await sourceRunIsCurrent())) {
                core.notice('source run began another attempt; stopping stale cleanup');
                return;
              }
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                core.info(`deleted ${artifact.name} (${artifact.id})`);
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                core.info(`artifact already absent: ${artifact.name} (${artifact.id})`);
              }
            }
            let finalArtifacts = [];
            let postconditionSatisfied = false;
            let stablePostcondition;
            const postDeleteDeadline = Date.now() + consistencyTimeoutMs;
            while (true) {
              if (!(await sourceRunIsCurrent())) {
                core.notice('source run began another attempt; skipping stale postcondition');
                return;
              }
              finalArtifacts = await listArtifacts();
              validateArtifacts(finalArtifacts);
              const exactPostcondition =
                finalArtifacts.length === retainedNames.length &&
                finalArtifacts.every(
                  (artifact) => selected.get(artifact.name)?.id === artifact.id,
                );
              const postcondition = JSON.stringify(
                finalArtifacts
                  .map((artifact) => ({id: artifact.id, name: artifact.name}))
                  .sort((left, right) => left.id - right.id),
              );
              if (exactPostcondition && postcondition === stablePostcondition) {
                postconditionSatisfied = true;
                break;
              }
              stablePostcondition = exactPostcondition ? postcondition : undefined;
              core.info('waiting for two stable exact post-delete inventory reads');
              if (Date.now() >= postDeleteDeadline) {
                break;
              }
              await sleep(
                Math.max(0, Math.min(consistencyPollMs, postDeleteDeadline - Date.now())),
              );
            }
            if (!postconditionSatisfied) {
              throw new Error(
                `cleanup postcondition failed: ${JSON.stringify(
                  finalArtifacts.map((artifact) => ({id: artifact.id, name: artifact.name})),
                )}`,
              );
            }
            core.info(
              `retained ${retainedNames.length} wheel artifacts and deleted ${deletionTargets.length} obsolete artifacts`,
            );
