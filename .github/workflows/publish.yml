---
name: Publish
on:
  # Manual only until the release process is intentionally activated.
  # Default mode builds and validates artifacts without uploading them.
  # GitHub only allows users with write access to run workflow_dispatch.
  # Jobs below also require the selected ref to be main.
  workflow_dispatch:
    inputs:
      repository:
        description: Publish target
        required: true
        default: check-only
        type: choice
        options: [check-only, testpypi, pypi]
      release_tag:
        description: Optional release tag to validate, for example v0.2.3
        required: false
        default: ''
        type: string
      confirm_publish:
        description: Type "publish schema-sanitizer" to allow an upload
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  validate-version:
    name: validate version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate package version and optional tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < meta/VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(\.post[0-9]+)?$ ]]; then
            echo "Invalid meta/VERSION: ${version}" >&2
            exit 1
          fi
          expected_tag="v${version}"
          release_tag="${{ inputs.release_tag }}"
          if [[ -n "${release_tag}" && "${release_tag}" != "${expected_tag}" ]]; then
            echo "release_tag (${release_tag}) does not match meta/VERSION (${expected_tag})" >&2
            exit 1
          fi
  sdist:
    name: sdist
    needs: [validate-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build sdist
        run: |
          python -m pip install -U pip build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*
  wheels:
    name: wheels (${{ matrix.name }})
    needs: [validate-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch_linux: x86_64
          - name: windows-amd64
            os: windows-latest
            arch_windows: AMD64
          - name: macos-x86_64
            os: macos-15-intel
            arch_macos: x86_64
          - name: macos-arm64
            os: macos-14
            arch_macos: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install cibuildwheel
        run: python -m pip install -U pip cibuildwheel
      - name: Build wheels (abi3, Linux)
        if: runner.os == 'Linux'
        run: >-
          python -m cibuildwheel --output-dir wheelhouse
          --archs '${{ matrix.arch_linux }}'
      - name: Build wheels (abi3, Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m cibuildwheel --output-dir wheelhouse
          --archs '${{ matrix.arch_windows }}'
      - name: Build wheels (abi3, macOS)
        if: runner.os == 'macOS'
        run: >-
          python -m cibuildwheel --output-dir wheelhouse
          --archs '${{ matrix.arch_macos }}'
      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.name }}
          path: wheelhouse/*
  validate-artifacts:
    name: validate artifacts
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Validate built distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip twine packaging
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from packaging.utils import parse_wheel_filename, parse_sdist_filename
          files = sorted(Path("dist").iterdir())
          for path in files:
              print(path.name)
          sdists = [p for p in files if p.name.endswith(".tar.gz")]
          wheels = [p for p in files if p.suffix == ".whl"]
          if len(sdists) != 1:
              raise SystemExit(f"Expected exactly 1 sdist, found {len(sdists)}")
          if len(wheels) != 4:
              raise SystemExit(f"Expected exactly 4 wheels, found {len(wheels)}")
          sdist_name, sdist_version = parse_sdist_filename(sdists[0].name)
          wheel_versions = set()
          wheel_platforms = set()
          for wheel in wheels:
              name, version, _build, tags = parse_wheel_filename(wheel.name)
              if name != sdist_name:
                  raise SystemExit(f"Wheel project name {name!s} != sdist name {sdist_name!s}")
              wheel_versions.add(version)
              wheel_platforms.update(tag.platform for tag in tags)
          versions = {sdist_version, *wheel_versions}
          if len(versions) != 1:
              raise SystemExit(f"Mismatched distribution versions: {sorted(map(str, versions))}")
          required_platform_markers = ("manylinux_2_28_x86_64", "win_amd64", "macosx")
          joined_platforms = " ".join(sorted(wheel_platforms))
          for marker in required_platform_markers:
              if marker not in joined_platforms:
                  raise SystemExit(f"Missing wheel platform marker {marker!r}: {joined_platforms}")
          PY
  wheel-smoke:
    name: wheel smoke (${{ matrix.name }}, py${{ matrix.python-version }})
    needs: [wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        target: [linux-x86_64, windows-amd64, macos-x86_64, macos-arm64]
        include:
          - target: linux-x86_64
            name: linux-x86_64
            artifact: dist-wheels-linux-x86_64
            os: ubuntu-latest
          - target: windows-amd64
            name: windows-amd64
            artifact: dist-wheels-windows-amd64
            os: windows-latest
          - target: macos-x86_64
            name: macos-x86_64
            artifact: dist-wheels-macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            name: macos-arm64
            artifact: dist-wheels-macos-arm64
            os: macos-14
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install wheel and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import sys
          import schema_sanitizer as ss
          import schema_sanitizer._core_abi3 as core
          print("python", sys.version.split()[0])
          print("schema-sanitizer", ss.__version__)
          print("core", core.__file__)
          PY
  publish:
    name: publish
    needs: [validate-artifacts, wheel-smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.repository != 'check-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC / Trusted Publishing
    steps:
      - name: Confirm upload
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_publish }}" != "publish schema-sanitizer" ]]; then
            echo 'Refusing upload: confirm_publish must be exactly "publish schema-sanitizer".' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish to PyPI with Trusted Publishing
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to TestPyPI with Trusted Publishing
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
