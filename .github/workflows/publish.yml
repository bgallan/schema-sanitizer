---
name: Publish
on:
  # The only manual workflow with release side effects. Check-only runs the
  # complete PR/main validation without uploading anything.
  workflow_dispatch:
    inputs:
      repository:
        description: Publish target
        required: true
        default: check-only
        type: choice
        options: [check-only, testpypi, pypi]
      release_tag:
        description: Optional release tag to validate, for example v0.3.8
        required: false
        default: ''
        type: string
      confirm_publish:
        description: Type "publish schema-sanitizer" to allow an upload
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  validate-request:
    name: validate publish request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require main and validate the package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Publish must run from the main branch, got ${GITHUB_REF}" >&2
            exit 1
          fi
          python meta/ci/validate_release_version.py --github-event "${GITHUB_EVENT_PATH}"
  validation:
    name: canonical release validation
    needs: [validate-request]
    uses: ./.github/workflows/ci.yml
  publish:
    name: publish
    needs: [validation]
    if: inputs.repository != 'check-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC / Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - name: Confirm upload
        run: >-
          python meta/ci/validate_release_version.py
          --github-event "${GITHUB_EVENT_PATH}"
          --require-publish-confirmation
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish to PyPI with Trusted Publishing
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to TestPyPI with Trusted Publishing
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
