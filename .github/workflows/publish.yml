---
name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact meta/VERSION value, for example 0.4.2
        required: true
        type: string
      confirm_publish:
        description: Type "publish schema-sanitizer"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # PyPI accepts only one production publication at a time. A constant group
  # also prevents two differently typed version inputs from racing each other.
  group: pypi-production
  cancel-in-progress: false
jobs:
  # Fail before the expensive validation if the immutable release identity is
  # incomplete. This job has no package-index authority.
  preflight:
    name: release request preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.11.9
      - name: Validate branch, version, availability, and explicit confirmation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Publish must run from main, got ${GITHUB_REF}" >&2
            exit 1
          fi
          python meta/ci/release/validate_release_version.py \
            --github-event "${GITHUB_EVENT_PATH}" \
            --require-release-version \
            --require-publish-confirmation
          python meta/ci/release/check_pypi_version.py
          python meta/ci/release/check_github_release_state.py \
            --expected-main-sha "${GITHUB_SHA}"

  # A local reusable workflow is resolved from this same immutable commit.
  validation:
    name: canonical release validation
    needs: [preflight]
    uses: ./.github/workflows/ci.yml

  # Keep the OIDC trust boundary repository-code-free: retrieve the validated,
  # digest-checked artifact, reset only its exact path on a transport retry,
  # and invoke PyPI's maintained publisher action.
  publish:
    name: publish validated distributions
    needs: [preflight, validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Download the exact validated release set
        id: download-release-distributions
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-distributions
          path: release
      - name: Reset a partial release-artifact download
        if: ${{ steps.download-release-distributions.outcome == 'failure' }}
        shell: bash
        run: |-
          set -euo pipefail
          if [[ -e release ]]; then
            rm -rf -- release
          fi
      - name: Retry the exact validated release-set download
        if: ${{ steps.download-release-distributions.outcome == 'failure' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-distributions
          path: release
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: release/packages/
          attestations: true
