---
name: Native sanitizers

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: Clang ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: >-
          python -m pip install -U pip ninja 'cmake>=4.3,<4.4'
          scikit-build-core==0.11.6 pytest pyarrow
      - name: Build and install instrumented package
        run: >-
          python -m pip install -v --no-build-isolation
          --config-settings=cmake.define.CMAKE_C_COMPILER=clang
          --config-settings=cmake.define.CMAKE_CXX_COMPILER=clang++
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_LTO=OFF
          --config-settings=cmake.define.SCHEMA_SANITIZER_SANITIZER=asan-ubsan
          --config-settings=cmake.define.SCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_WERROR=ON
          .
      - name: Build sanitizer-first CPython launcher
        run: >-
          clang++ -std=c++17 -fsanitize=address,undefined
          -fno-omit-frame-pointer -fno-sanitize-recover=all
          meta/ci/asan_python_launcher.cc
          $(python3-config --embed --cflags --ldflags)
          -o python-asan
      - name: Malformed native input and lifecycle suite
        run: >-
          ./python-asan -m pytest -q
          tests/test_input_python_and_local.py
          tests/test_options_bytes.py
          tests/test_runtime_lifecycle_part01.py
          tests/test_runtime_lifecycle_part02.py
          tests/test_runtime_lifecycle_part03.py
      - name: Nested materialization and adversarial Parquet suite
        run: >-
          ./python-asan -m pytest -q
          tests/test_parquet_direct_io_runtime_part01.py
          tests/test_parquet_native_nested_list_map_combinators.py
          tests/test_parquet_native_recursive_shapes_part04.py
          tests/test_parquet_native_recursive_extreme_runtime.py
