---
name: Real GCP interoperability
on:
  schedule:
    - cron: 47 4 * * 3
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schema-sanitizer-real-gcp
  cancel-in-progress: false
jobs:
  gcs-bigquery:
    if: vars.SCHEMA_SANITIZER_RUN_REAL_GCP == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Configure Google application-default credentials
        shell: bash
        run: |
          mkdir -p "$HOME/.config/gcloud"
          cat > "$HOME/.config/gcloud/application_default_credentials.json" <<'SCHEMA_SANITIZER_CREDENTIALS'
          ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SCHEMA_SANITIZER_CREDENTIALS
          chmod 600 "$HOME/.config/gcloud/application_default_credentials.json"
      - name: Install package and real clients
        run: |
          python -m pip install -U pip
          python -m pip install -U '.[cloud,pyarrow]' pytest 'adbc-driver-bigquery[dbapi]'
      - name: Run GCS to BigQuery workflow
        run: >-
          pytest -q tests/test_cloud_real_services.py
          --run-real-gcp
          --real-gcp-project '${{ secrets.SCHEMA_SANITIZER_GCP_PROJECT }}'
          --real-gcs-bucket '${{ secrets.SCHEMA_SANITIZER_GCS_BUCKET }}'
          --real-bigquery-dataset '${{ secrets.SCHEMA_SANITIZER_BIGQUERY_DATASET }}'
          --real-bigquery-location '${{ secrets.SCHEMA_SANITIZER_BIGQUERY_LOCATION }}'
          --junitxml=real-gcp-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: real-gcp-results-${{ github.run_id }}
          path: real-gcp-results.xml
          if-no-files-found: ignore
