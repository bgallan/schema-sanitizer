---
name: CI
on:
  push:
    branches: [main]
  # Keep this as pull_request, not pull_request_target. The latter would run
  # untrusted fork code with elevated repository context.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install security tools
        run: |
          python -m pip install -U pip
          python -m pip install -U pip-audit bandit detect-secrets tomli
      - name: Build requirements for CVE checks
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject.get("project", {})
          runtime = list(project.get("dependencies", []))
          extras = []
          for values in project.get("optional-dependencies", {}).values():
              extras.extend(values)
          def _dedupe(items: list[str]) -> list[str]:
              out: list[str] = []
              seen: set[str] = set()
              for item in items:
                  if item not in seen:
                      seen.add(item)
                      out.append(item)
              return out
          Path("runtime-requirements.txt").write_text(
              "\n".join(_dedupe(runtime)) + "\n",
              encoding="utf-8",
          )
          Path("full-requirements.txt").write_text(
              "\n".join(_dedupe(runtime + extras)) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Dependency vulnerability audit
        run: |
          pip-audit -r runtime-requirements.txt --progress-spinner off
          pip-audit -r full-requirements.txt --progress-spinner off
      - name: Static security scan (Python)
        run: bandit -r src -ll
      - name: Secret scan
        run: |
          detect-secrets scan \
            --exclude-files '^(\.git/|build/|dist/|\.venv/|\.mypy_cache/|\.pytest_cache/|\.ruff_cache/)' \
            --all-files > .detect-secrets.ci.json
          python - <<'PY'
          import json
          from pathlib import Path
          def _is_notebook_cell_id(filename: str, line_number: int | None) -> bool:
              if not filename.endswith(".ipynb") or line_number is None:
                  return False
              try:
                  line = Path(filename).read_text(encoding="utf-8").splitlines()[line_number - 1]
              except (OSError, IndexError):
                  return False
              stripped = line.strip()
              return stripped.startswith('"id":') and (
                  stripped.endswith('"') or stripped.endswith('",')
              )
          report = json.loads(Path(".detect-secrets.ci.json").read_text(encoding="utf-8"))
          findings = {}
          for filename, items in report.get("results", {}).items():
              kept = [
                  item for item in items
                  if not _is_notebook_cell_id(filename, item.get("line_number"))
              ]
              if kept:
                  findings[filename] = kept
          if findings:
              total = sum(len(items) for items in findings.values())
              print(f"detect-secrets found {total} potential secret(s) in {len(findings)} file(s):")
              for filename, items in sorted(findings.items()):
                  for item in items:
                      kind = item.get("type", "unknown")
                      line = item.get("line_number", "?")
                      verified = item.get("is_verified", False)
                      print(f"- {filename}:{line}: {kind} (verified={verified})")
              raise SystemExit(f"detect-secrets found {total} potential secret(s) in {len(findings)} file(s)")
          print("detect-secrets: no findings")
          PY

  # Core lane: must build and import without pyarrow installed and without Arrow C++ linkage.
  core-only:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install -U pip pytest
      - name: Assert pyarrow is NOT installed
        run: |
          python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('pyarrow') is None else 1)"
      - name: Prevent Arrow C++ headers
        if: runner.os == 'Linux'
        shell: bash
        run: meta/ci/check_no_arrow_cpp.sh
      - name: Build wheel (no pyarrow)
        run: |
          python -m pip install -U build
          python -m build --wheel
      - name: Install wheel
        run: |
          python -c "import glob,subprocess,sys; ws=glob.glob('dist/*.whl'); ws or sys.exit('No wheel found in dist/'); subprocess.check_call([sys.executable,'-m','pip','install','-U',*ws])"
      - name: Import smoke (no adapters)
        run: |
          python -c "import schema_sanitizer as s; print('import ok', s.__version__)"
      - name: Parquet contract collection smoke (no pyarrow)
        run: >-
          pytest --collect-only -q
          tests/test_parquet_contract_gates_part01.py
          tests/test_parquet_contract_gates_part02.py
          tests/test_parquet_contract_gates_part03.py
      - name: Verify extension does not link libarrow/libparquet
        if: runner.os != 'Windows'
        shell: bash
        run: |
          EXT_PATH=$(python - <<'PY'
          import importlib
          m = importlib.import_module('schema_sanitizer._core_abi3')
          print(m.__file__)
          PY
          )
          echo "Extension: ${EXT_PATH}"
          meta/ci/check_no_libarrow_linkage.sh "${EXT_PATH}"
      - name: Upload abi3 wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: abi3-wheel-${{ matrix.artifact }}
          path: dist/*.whl

  # ABI smoke lane: install the CPython 3.11-built abi3 wheel per OS.
  abi3-runtime-compat:
    runs-on: ${{ matrix.os }}
    needs: [core-only]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download abi3 wheel (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-linux
          path: dist
      - name: Download abi3 wheel (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-windows
          path: dist
      - name: Download abi3 wheel (macOS x86_64)
        if: matrix.os == 'macos-15-intel'
        uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-macos-x86_64
          path: dist
      - name: Download abi3 wheel (macOS arm64)
        if: matrix.os == 'macos-14'
        uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-macos-arm64
          path: dist
      - name: Install built wheel
        run: |
          python -c "import glob,subprocess,sys; ws=glob.glob('dist/*.whl'); ws or sys.exit('No wheel downloaded to dist/'); subprocess.check_call([sys.executable,'-m','pip','install','-U',*ws])"
      - name: Import and ABI smoke
        run: |
          python -c "import sys, schema_sanitizer as s, schema_sanitizer._core_abi3 as c; print('python', sys.version.split()[0]); print('pkg', s.__version__); print('core', c.__name__)"

  # Adapter lane: pyarrow installed; run the contract+API gate tests (and then full suite).
  adapters:
    runs-on: ${{ matrix.os }}
    needs: [abi3-runtime-compat]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install (dev + pyarrow)
        run: |
          python -m pip install -U ".[dev,pyarrow]"
      - name: Compileall
        run: python -m compileall -q src
      - name: Parquet contract runtime readiness
        run: python meta/ci/check_parquet_contract_runtime.py
      - name: Parquet contract runtime gates
        run: >-
          pytest -q
          tests/test_parquet_contract_gates_part01.py
          tests/test_parquet_contract_gates_part02.py
          tests/test_parquet_contract_gates_part03.py
          -k "parquet_contract_runtime_readiness_status or parquet_contract_certification_status
          or native_parquet_writer_contract_status or native_parquet_nested_contract_status"
      - name: Parquet contract runtime suite
        run: |
          mkdir -p artifacts
          python meta/ci/check_parquet_contract_runtime_suite.py --certificate-output artifacts/parquet-contract-runtime-certificate.json
      - name: Upload Parquet contract certificate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parquet-contract-runtime-certificate
          path: artifacts/parquet-contract-runtime-certificate.json
          if-no-files-found: ignore
      - name: Gate tests
        run: |
          pytest -q tests/test_api.py::test_public_api_contract tests/test_contracts.py::test_skip_row_does_not_partially_append_columns tests/test_contracts.py::test_result_does_not_expose_bad_rows
      - name: Full test suite
        run: pytest -q

  # Publish parity lane: build and validate the same release artifacts before merge.
  validate-release-version:
    name: validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < meta/VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(\.post[0-9]+)?$ ]]; then
            echo "Invalid meta/VERSION: ${version}" >&2
            exit 1
          fi
          echo "package-version=${version}"
  sdist:
    name: sdist
    needs: [validate-release-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build sdist
        run: |
          python -m pip install -U pip build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*
  wheels:
    name: wheels (${{ matrix.name }})
    needs: [validate-release-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch_linux: x86_64
          - name: windows-amd64
            os: windows-latest
            arch_windows: AMD64
          - name: macos-x86_64
            os: macos-15-intel
            arch_macos: x86_64
          - name: macos-arm64
            os: macos-14
            arch_macos: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install cibuildwheel
        run: python -m pip install -U pip cibuildwheel
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install zlib:x64-windows-static
      - name: Build wheels (abi3, Linux)
        if: runner.os == 'Linux'
        env:
          # One build per platform: abi3 wheels, built with CPython 3.11.
          CIBW_BUILD: cp311-*
          CIBW_PROJECT_REQUIRES_PYTHON: '>=3.11'
          CIBW_BUILD_VERBOSITY: 1
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS_LINUX: ${{ matrix.arch_linux }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON"
          CIBW_TEST_REQUIRES: pyarrow
          CIBW_TEST_COMMAND: >-
            python -c "import tempfile; from pathlib import Path; import pyarrow as
            pa,
            pyarrow.parquet as pq; import schema_sanitizer as s,
            schema_sanitizer._core_abi3 as m; from schema_sanitizer.api_impl.file_conversion
            import
            native_writers as n; p=Path(tempfile.mkdtemp())/'gzip.parquet';
            b=pa.record_batch({'s': pa.array(['x']*32, type=pa.string())});
            n.write_parquet_native_first_stream(pa.RecordBatchReader.from_batches(b.schema,[b]),
            p, feature='wheel-gzip-smoke');
            c=pq.ParquetFile(p).metadata.row_group(0).column(0).compression;
            assert c == 'GZIP', c; print(s.__version__, m.__file__, c)"
        run: cibuildwheel --output-dir wheelhouse
      - name: Build wheels (abi3, Windows)
        if: runner.os == 'Windows'
        env:
          CIBW_BUILD: cp311-*
          CIBW_PROJECT_REQUIRES_PYTHON: '>=3.11'
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch_windows }}
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            -DVCPKG_TARGET_TRIPLET=x64-windows-static"
          CIBW_TEST_REQUIRES: pyarrow
          CIBW_TEST_COMMAND: >-
            python -c "import tempfile; from pathlib import Path; import pyarrow as
            pa,
            pyarrow.parquet as pq; import schema_sanitizer as s,
            schema_sanitizer._core_abi3 as m; from schema_sanitizer.api_impl.file_conversion
            import
            native_writers as n; p=Path(tempfile.mkdtemp())/'gzip.parquet';
            b=pa.record_batch({'s': pa.array(['x']*32, type=pa.string())});
            n.write_parquet_native_first_stream(pa.RecordBatchReader.from_batches(b.schema,[b]),
            p, feature='wheel-gzip-smoke');
            c=pq.ParquetFile(p).metadata.row_group(0).column(0).compression;
            assert c == 'GZIP', c; print(s.__version__, m.__file__, c)"
        run: cibuildwheel --output-dir wheelhouse
      - name: Build wheels (abi3, macOS)
        if: runner.os == 'macOS'
        env:
          CIBW_BUILD: cp311-*
          CIBW_PROJECT_REQUIRES_PYTHON: '>=3.11'
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_MACOS: ${{ matrix.arch_macos }}
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON"
          CIBW_TEST_REQUIRES: pyarrow
          CIBW_TEST_COMMAND: >-
            python -c "import tempfile; from pathlib import Path; import pyarrow as
            pa,
            pyarrow.parquet as pq; import schema_sanitizer as s,
            schema_sanitizer._core_abi3 as m; from schema_sanitizer.api_impl.file_conversion
            import
            native_writers as n; p=Path(tempfile.mkdtemp())/'gzip.parquet';
            b=pa.record_batch({'s': pa.array(['x']*32, type=pa.string())});
            n.write_parquet_native_first_stream(pa.RecordBatchReader.from_batches(b.schema,[b]),
            p, feature='wheel-gzip-smoke');
            c=pq.ParquetFile(p).metadata.row_group(0).column(0).compression;
            assert c == 'GZIP', c; print(s.__version__, m.__file__, c)"
        run: cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.name }}
          path: wheelhouse/*
  validate-artifacts:
    name: validate artifacts
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Validate built distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip twine packaging
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          files = sorted(Path("dist").iterdir())
          for path in files:
              print(path.name)
          sdists = [p for p in files if p.name.endswith(".tar.gz")]
          wheels = [p for p in files if p.suffix == ".whl"]
          if len(sdists) != 1:
              raise SystemExit(f"Expected exactly 1 sdist, found {len(sdists)}")
          if len(wheels) != 4:
              raise SystemExit(f"Expected exactly 4 wheels, found {len(wheels)}")
          sdist_name, sdist_version = parse_sdist_filename(sdists[0].name)
          wheel_versions = set()
          wheel_platforms = set()
          for wheel in wheels:
              name, version, _build, tags = parse_wheel_filename(wheel.name)
              if name != sdist_name:
                  raise SystemExit(f"Wheel project name {name!s} != sdist name {sdist_name!s}")
              wheel_versions.add(version)
              wheel_platforms.update(tag.platform for tag in tags)
          versions = {sdist_version, *wheel_versions}
          if len(versions) != 1:
              raise SystemExit(f"Mismatched distribution versions: {sorted(map(str, versions))}")
          required_platform_markers = ("manylinux_2_28_x86_64", "win_amd64", "macosx")
          joined_platforms = " ".join(sorted(wheel_platforms))
          for marker in required_platform_markers:
              if marker not in joined_platforms:
                  raise SystemExit(f"Missing wheel platform marker {marker!r}: {joined_platforms}")
          PY
  wheel-smoke:
    name: wheel smoke (${{ matrix.name }}, py${{ matrix.python-version }})
    needs: [wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        target: [linux-x86_64, windows-amd64, macos-x86_64, macos-arm64]
        include:
          - target: linux-x86_64
            name: linux-x86_64
            artifact: dist-wheels-linux-x86_64
            os: ubuntu-latest
          - target: windows-amd64
            name: windows-amd64
            artifact: dist-wheels-windows-amd64
            os: windows-latest
          - target: macos-x86_64
            name: macos-x86_64
            artifact: dist-wheels-macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            name: macos-arm64
            artifact: dist-wheels-macos-arm64
            os: macos-14
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install wheel and smoke test
        shell: bash
        run: |-
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import sys
          import schema_sanitizer as ss
          import schema_sanitizer._core_abi3 as core
          print("python", sys.version.split()[0])
          print("schema-sanitizer", ss.__version__)
          print("core", core.__file__)
          PY
