---
name: General sanity
on:
  workflow_call:
  push:
    branches: [main]
  # Keep this as pull_request, not pull_request_target. The latter would run
  # untrusted fork code with elevated repository context.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install security tools
        run: |
          python -m pip install -U pip
          python -m pip install -U pip-audit bandit detect-secrets tomli
      - name: Build requirements for CVE checks
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject.get("project", {})
          runtime = list(project.get("dependencies", []))
          extras = []
          for values in project.get("optional-dependencies", {}).values():
              extras.extend(values)
          def _dedupe(items: list[str]) -> list[str]:
              out: list[str] = []
              seen: set[str] = set()
              for item in items:
                  if item not in seen:
                      seen.add(item)
                      out.append(item)
              return out
          Path("runtime-requirements.txt").write_text(
              "\n".join(_dedupe(runtime)) + "\n",
              encoding="utf-8",
          )
          Path("full-requirements.txt").write_text(
              "\n".join(_dedupe(runtime + extras)) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Dependency vulnerability audit
        run: |
          pip-audit -r runtime-requirements.txt --progress-spinner off
          pip-audit -r full-requirements.txt --progress-spinner off
      - name: Static security scan (Python)
        run: bandit -r src -ll
      - name: Secret scan
        run: |
          detect-secrets scan \
            --exclude-files '^(\.git/|build/|dist/|\.venv/|\.mypy_cache/|\.pytest_cache/|\.ruff_cache/)' \
            --all-files > .detect-secrets.ci.json
          python - <<'PY'
          import json
          from pathlib import Path
          def _is_notebook_cell_id(filename: str, line_number: int | None) -> bool:
              if not filename.endswith(".ipynb") or line_number is None:
                  return False
              try:
                  line = Path(filename).read_text(encoding="utf-8").splitlines()[line_number - 1]
              except (OSError, IndexError):
                  return False
              stripped = line.strip()
              return stripped.startswith('"id":') and (
                  stripped.endswith('"') or stripped.endswith('",')
              )
          report = json.loads(Path(".detect-secrets.ci.json").read_text(encoding="utf-8"))
          findings = {}
          for filename, items in report.get("results", {}).items():
              kept = [
                  item for item in items
                  if not _is_notebook_cell_id(filename, item.get("line_number"))
              ]
              if kept:
                  findings[filename] = kept
          if findings:
              total = sum(len(items) for items in findings.values())
              print(f"detect-secrets found {total} potential secret(s) in {len(findings)} file(s):")
              for filename, items in sorted(findings.items()):
                  for item in items:
                      kind = item.get("type", "unknown")
                      line = item.get("line_number", "?")
                      verified = item.get("is_verified", False)
                      print(f"- {filename}:{line}: {kind} (verified={verified})")
              raise SystemExit(f"detect-secrets found {total} potential secret(s) in {len(findings)} file(s)")
          print("detect-secrets: no findings")
          PY
  quality:
    name: lint and static typing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install development tools
        run: python -m pip install -U pip '.[dev]'
      - name: Pre-commit checks
        run: pre-commit run --all-files
      - name: MyPy
        run: python -m mypy
      - name: Benchmark suite smoke
        run: python benchmarks/bench_ingest.py --rows 8 --width 2 --repeats 1

  # Core lane: must build and import without pyarrow installed and without Arrow C++ linkage.
  core-only:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install -U pip pytest
      - name: Assert pyarrow is NOT installed
        run: |
          python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('pyarrow') is None else 1)"
      - name: Prevent Arrow C++ headers
        if: runner.os == 'Linux'
        shell: bash
        run: meta/ci/check_no_arrow_cpp.sh
      - name: Build wheel (no pyarrow)
        run: |
          python -m pip install -U build
          python -m build --wheel
      - name: Install wheel
        run: |
          python -c "import glob,subprocess,sys; ws=glob.glob('dist/*.whl'); ws or sys.exit('No wheel found in dist/'); subprocess.check_call([sys.executable,'-m','pip','install','-U',*ws])"
      - name: Import smoke (no adapters)
        run: |
          python -c "import schema_sanitizer as s; print('import ok', s.__version__)"
      - name: Parquet contract collection smoke (no pyarrow)
        run: >-
          pytest --collect-only -q
          tests/test_parquet_contract_gates_part01.py
          tests/test_parquet_contract_gates_part02.py
          tests/test_parquet_contract_gates_part03.py
      - name: Verify extension does not link libarrow/libparquet
        if: runner.os != 'Windows'
        shell: bash
        run: |
          EXT_PATH=$(python - <<'PY'
          import importlib
          m = importlib.import_module('schema_sanitizer._core_abi3')
          print(m.__file__)
          PY
          )
          echo "Extension: ${EXT_PATH}"
          meta/ci/check_no_libarrow_linkage.sh "${EXT_PATH}"
      - name: Upload abi3 wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: abi3-wheel-${{ matrix.artifact }}
          path: dist/*.whl
  remote-http-fault-injection:
    name: remote HTTP faults (${{ matrix.artifact }})
    needs: [core-only]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-${{ matrix.artifact }}
          path: dist
      - name: Install wheel and HTTP emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip pytest aiohttp
          python -m pip install dist/*.whl
      - name: Exercise disconnect, truncation, cancellation, and shutdown
        run: >-
          python -m pytest -q
          tests/test_remote_http_fault_injection.py
          tests/test_remote_process_lifecycle.py
  benchmark-matrix-smoke:
    name: threading benchmark matrix (${{ matrix.artifact }})
    needs: [core-only]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-${{ matrix.artifact }}
          path: dist
      - name: Install wheel and benchmark adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip pyarrow
          python -m pip install dist/*.whl
      - name: Run cross-platform benchmark equivalence smoke
        run: >-
          python benchmarks/bench_threading_matrix.py
          --profile ci
          --rows 256
          --warmups 0
          --repeats 1
          --only parquet
          --output artifacts/threading-matrix-${{ matrix.artifact }}.json
      - uses: actions/upload-artifact@v6
        with:
          name: threading-benchmark-matrix-${{ matrix.artifact }}
          path: artifacts/threading-matrix-${{ matrix.artifact }}.json

  # ABI smoke lane: install the CPython 3.11-built abi3 wheel per OS.
  abi3-runtime-compat:
    runs-on: ${{ matrix.os }}
    needs: [core-only]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download abi3 wheel (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-linux
          path: dist
      - name: Download abi3 wheel (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-windows
          path: dist
      - name: Download abi3 wheel (macOS x86_64)
        if: matrix.os == 'macos-15-intel'
        uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-macos-x86_64
          path: dist
      - name: Download abi3 wheel (macOS arm64)
        if: matrix.os == 'macos-14'
        uses: actions/download-artifact@v7
        with:
          name: abi3-wheel-macos-arm64
          path: dist
      - name: Install built wheel
        run: |
          python -c "import glob,subprocess,sys; ws=glob.glob('dist/*.whl'); ws or sys.exit('No wheel downloaded to dist/'); subprocess.check_call([sys.executable,'-m','pip','install','-U',*ws])"
      - name: Import and ABI smoke
        run: |
          python -c "import sys, schema_sanitizer as s, schema_sanitizer._core_abi3 as c; print('python', sys.version.split()[0]); print('pkg', s.__version__); print('core', c.__name__)"

  # Adapter lane: pyarrow installed; run the contract+API gate tests (and then full suite).
  adapters:
    runs-on: ${{ matrix.os }}
    needs: [abi3-runtime-compat]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install (dev + pyarrow)
        run: |
          python -m pip install -U ".[dev,pyarrow]"
      - name: Compileall
        run: python -m compileall -q src
      - name: Parquet contract runtime readiness
        run: python meta/ci/check_parquet_contract_runtime.py
      - name: Parquet contract runtime gates
        run: >-
          pytest -q
          tests/test_parquet_contract_gates_part01.py
          tests/test_parquet_contract_gates_part02.py
          tests/test_parquet_contract_gates_part03.py
          -k "parquet_contract_runtime_readiness_status or parquet_contract_certification_status
          or native_parquet_writer_contract_status or native_parquet_nested_contract_status"
      - name: Parquet contract runtime suite
        run: |
          mkdir -p artifacts
          python meta/ci/check_parquet_contract_runtime_suite.py --certificate-output artifacts/parquet-contract-runtime-certificate.json
      - name: Upload Parquet contract certificate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parquet-contract-runtime-certificate-${{ matrix.os }}
          path: artifacts/parquet-contract-runtime-certificate.json
          if-no-files-found: ignore
      - name: Gate tests
        run: |
          pytest -q tests/test_api.py::test_public_api_contract tests/test_contracts.py::test_skip_row_does_not_partially_append_columns tests/test_contracts.py::test_result_does_not_expose_bad_rows
      - name: Full test suite
        run: pytest -q

  # Publish parity lane: build and validate the same release artifacts before merge.
  validate-release-version:
    name: validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate package version
        run: python meta/ci/validate_release_version.py
  sdist:
    name: sdist
    needs: [validate-release-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build sdist
        run: |
          python -m pip install -U pip build twine
          python -m build --sdist
          python -m twine check dist/*
          python meta/ci/check_distribution_contents.py dist/*.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*
  wheels:
    name: wheels (${{ matrix.name }})
    needs: [validate-release-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch_linux: x86_64
          - name: windows-amd64
            os: windows-latest
            arch_windows: AMD64
          - name: macos-x86_64
            os: macos-15-intel
            arch_macos: x86_64
          - name: macos-arm64
            os: macos-14
            arch_macos: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install cibuildwheel
        run: python -m pip install -U pip cibuildwheel
      - name: Build wheels (abi3, Linux)
        if: runner.os == 'Linux'
        run: >-
          python -m cibuildwheel --output-dir wheelhouse
          --archs '${{ matrix.arch_linux }}'
      - name: Build wheels (abi3, Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m cibuildwheel --output-dir wheelhouse
          --archs '${{ matrix.arch_windows }}'
      - name: Build wheels (abi3, macOS)
        if: runner.os == 'macOS'
        run: >-
          python -m cibuildwheel --output-dir wheelhouse
          --archs '${{ matrix.arch_macos }}'
      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.name }}
          path: wheelhouse/*
  validate-artifacts:
    name: validate artifacts
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Validate built distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip twine packaging
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          files = sorted(Path("dist").iterdir())
          for path in files:
              print(path.name)
          sdists = [p for p in files if p.name.endswith(".tar.gz")]
          wheels = [p for p in files if p.suffix == ".whl"]
          if len(sdists) != 1:
              raise SystemExit(f"Expected exactly 1 sdist, found {len(sdists)}")
          if len(wheels) != 4:
              raise SystemExit(f"Expected exactly 4 wheels, found {len(wheels)}")
          sdist_name, sdist_version = parse_sdist_filename(sdists[0].name)
          wheel_versions = set()
          wheel_platforms = set()
          for wheel in wheels:
              name, version, _build, tags = parse_wheel_filename(wheel.name)
              if name != sdist_name:
                  raise SystemExit(f"Wheel project name {name!s} != sdist name {sdist_name!s}")
              wheel_versions.add(version)
              wheel_platforms.update(tag.platform for tag in tags)
          versions = {sdist_version, *wheel_versions}
          if len(versions) != 1:
              raise SystemExit(f"Mismatched distribution versions: {sorted(map(str, versions))}")
          required_platform_markers = ("manylinux_2_28_x86_64", "win_amd64", "macosx")
          joined_platforms = " ".join(sorted(wheel_platforms))
          for marker in required_platform_markers:
              if marker not in joined_platforms:
                  raise SystemExit(f"Missing wheel platform marker {marker!r}: {joined_platforms}")
          PY
  wheel-smoke:
    name: wheel smoke (${{ matrix.name }}, py${{ matrix.python-version }})
    needs: [wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        target: [linux-x86_64, windows-amd64, macos-x86_64, macos-arm64]
        include:
          - target: linux-x86_64
            name: linux-x86_64
            artifact: dist-wheels-linux-x86_64
            os: ubuntu-latest
          - target: windows-amd64
            name: windows-amd64
            artifact: dist-wheels-windows-amd64
            os: windows-latest
          - target: macos-x86_64
            name: macos-x86_64
            artifact: dist-wheels-macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            name: macos-arm64
            artifact: dist-wheels-macos-arm64
            os: macos-14
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install wheel and smoke test
        shell: bash
        run: |-
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import sys
          import schema_sanitizer as ss
          import schema_sanitizer._core_abi3 as core
          print("python", sys.version.split()[0])
          print("schema-sanitizer", ss.__version__)
          print("core", core.__file__)
          PY
  coverage-python:
    name: coverage reports / python-branch-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package and coverage tools
        run: |
          python -m pip install -U pip coverage '.[dev,pyarrow]'
      - name: Collect contextual Python branch coverage
        run: |
          coverage erase
          coverage run --source=src/schema_sanitizer --branch --parallel-mode --context=regular -m pytest -q \
            tests/test_api.py \
            tests/test_input_python_and_local.py \
            tests/test_input_xml_and_public_api.py \
            tests/test_sinks_csv_jsonl.py
          coverage run --source=src/schema_sanitizer --branch --parallel-mode --context=adversarial -m pytest -q \
            tests/test_contracts.py \
            tests/test_runtime_lifecycle_part01.py \
            tests/test_runtime_lifecycle_part02.py \
            tests/test_runtime_lifecycle_part03.py \
            tests/test_streaming_writer_lifecycle.py \
            tests/test_async_remote_scheduler.py \
            tests/test_high_risk_coverage_gaps.py \
            tests/test_parquet_native_recursive_fuzz_runtime.py
          coverage run --source=src/schema_sanitizer --branch --parallel-mode --context=integration -m pytest -q \
            tests/test_input_remote_staging_part01.py \
            tests/test_input_remote_staging_part02.py \
            tests/test_input_remote_staging_part03.py \
            tests/test_cloud_emulator_configuration.py \
            tests/test_bigquery_integration.py
          coverage combine
          coverage report
          coverage html --show-contexts -d coverage-python-html
          coverage xml -o coverage-python.xml
          coverage json -o coverage-python.json
          python meta/ci/report_risk_coverage.py coverage-python.json \
            --output coverage-python-risk-gaps.txt
      - uses: actions/upload-artifact@v6
        with:
          name: python-branch-coverage
          path: |
            coverage-python-html/
            coverage-python.xml
            coverage-python.json
            coverage-python-risk-gaps.txt
  coverage-native:
    name: coverage reports / native-llvm-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install LLVM 18 coverage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          clang-18 --version
          llvm-profdata-18 --version
          llvm-cov-18 --version
      - name: Install instrumented package
        run: |
          python -m pip install -U pip ninja 'cmake>=4.3,<4.4' scikit-build-core==0.11.6
          python -m pip install -U pytest pyarrow
          mkdir -p coverage-native/raw
          python -m pip install --no-build-isolation -v \
            --config-settings=install.strip=false \
            --config-settings=cmake.define.CMAKE_C_COMPILER=clang-18 \
            --config-settings=cmake.define.CMAKE_CXX_COMPILER=clang++-18 \
            --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_LTO=OFF \
            --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_COVERAGE=ON \
            --config-settings=cmake.define.SCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
            --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_WERROR=ON \
            --config-settings=cmake.define.SCHEMA_SANITIZER_COVERAGE_PROFILE_PATTERN='${{ github.workspace }}/coverage-native/raw/schema-sanitizer-%p.profraw' \
            .
      - name: Run native coverage suites
        shell: bash
        run: |
          mkdir -p coverage-native/raw/regular
          pytest -q \
            tests/test_api.py \
            tests/test_input_xml_and_public_api.py \
            tests/test_sinks_csv_jsonl.py
          mv coverage-native/raw/schema-sanitizer-*.profraw \
            coverage-native/raw/regular/
          mkdir -p coverage-native/raw/adversarial
          pytest -q \
            tests/test_contracts.py \
            tests/test_runtime_lifecycle_part01.py \
            tests/test_runtime_lifecycle_part02.py \
            tests/test_runtime_lifecycle_part03.py \
            tests/test_streaming_writer_lifecycle.py \
            tests/test_async_remote_scheduler.py \
            tests/test_high_risk_coverage_gaps.py \
            tests/test_parquet_native_recursive_fuzz_runtime.py
          mv coverage-native/raw/schema-sanitizer-*.profraw \
            coverage-native/raw/adversarial/
          mkdir -p coverage-native/raw/integration
          pytest -q \
            tests/test_input_remote_staging_part01.py \
            tests/test_input_remote_staging_part02.py \
            tests/test_input_remote_staging_part03.py \
            tests/test_cloud_emulator_configuration.py \
            tests/test_bigquery_integration.py
          mv coverage-native/raw/schema-sanitizer-*.profraw \
            coverage-native/raw/integration/
      - name: Render LLVM reports
        shell: bash
        run: |
          EXTENSION=$(python - <<'PY'
          import schema_sanitizer._core_abi3 as core
          print(core.__file__)
          PY
          )
          for suite in regular adversarial integration; do
            llvm-profdata-18 merge -sparse coverage-native/raw/${suite}/*.profraw \
              -o coverage-native/${suite}.profdata
            llvm-cov-18 report "${EXTENSION}" \
              -instr-profile=coverage-native/${suite}.profdata \
              > coverage-native/${suite}-summary.txt
          done
          llvm-profdata-18 merge -sparse coverage-native/raw/*/*.profraw \
            -o coverage-native/combined.profdata
          llvm-cov-18 show "${EXTENSION}" \
            -instr-profile=coverage-native/combined.profdata \
            -format=html \
            -show-branches=count \
            -output-dir=coverage-native/html
          llvm-cov-18 report "${EXTENSION}" \
            -instr-profile=coverage-native/combined.profdata \
            > coverage-native/combined-summary.txt
          cat coverage-native/combined-summary.txt
      - uses: actions/upload-artifact@v6
        with:
          name: native-llvm-coverage
          path: coverage-native/
  downstream-wheel:
    name: downstream packaging / downstream-wheel
    needs: [sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: dist-sdist
          path: release-dist
      - name: Build wheel only from the generated sdist
        run: |
          python -m pip install -U pip
          mkdir -p downstream-wheel
          python -m pip wheel --no-deps --wheel-dir downstream-wheel release-dist/*.tar.gz
      - name: Validate wheel contents
        run: python meta/ci/check_distribution_contents.py downstream-wheel/*.whl
      - name: Install outside the repository
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/consumer-venv"
          source "${{ runner.temp }}/consumer-venv/bin/activate"
          python -m pip install -U pip mypy pyarrow downstream-wheel/*.whl
          mkdir -p "${{ runner.temp }}/consumer-work"
          cp meta/ci/downstream_smoke.py meta/ci/downstream_typecheck.py \
            "${{ runner.temp }}/consumer-work/"
          cd "${{ runner.temp }}/consumer-work"
          python -I downstream_smoke.py
          python -I -m mypy --strict downstream_typecheck.py
      - uses: actions/upload-artifact@v6
        with:
          name: downstream-wheel
          path: downstream-wheel/*.whl
  downstream-extras:
    name: downstream packaging / optional-extra (${{ matrix.extra }})
    needs: downstream-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extra: [core, pyarrow, pandas, polars, duckdb, cloud]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: downstream-wheel
          path: downstream-wheel
      - name: Install one consumer extra in isolation
        shell: bash
        run: |-
          python -m venv "${{ runner.temp }}/extra-venv"
          source "${{ runner.temp }}/extra-venv/bin/activate"
          python -m pip install -U pip
          WHEEL=$(find downstream-wheel -name '*.whl' -print -quit)
          if [[ "${{ matrix.extra }}" == "core" ]]; then
            python -m pip install "${WHEEL}"
          else
            python -m pip install "${WHEEL}[${{ matrix.extra }}]"
          fi
          cd "${{ runner.temp }}"
          python -I -c "import schema_sanitizer as s; print(s.__version__)"
          case "${{ matrix.extra }}" in
            pyarrow) python -I -c "import pyarrow" ;;
            pandas) python -I -c "import pandas" ;;
            polars) python -I -c "import polars" ;;
            duckdb) python -I -c "import duckdb" ;;
            cloud) python -I -c "import aiohttp, aiobotocore, azure.identity, azure.storage.blob, google.auth" ;;
          esac
  native-sanitizers:
    name: native sanitizers / Clang ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: >-
          python -m pip install -U pip ninja 'cmake>=4.3,<4.4'
          scikit-build-core==0.11.6 pytest pyarrow
      - name: Build and install instrumented package
        run: >-
          python -m pip install -v --no-build-isolation
          --config-settings=cmake.define.CMAKE_C_COMPILER=clang
          --config-settings=cmake.define.CMAKE_CXX_COMPILER=clang++
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_LTO=OFF
          --config-settings=cmake.define.SCHEMA_SANITIZER_SANITIZER=asan-ubsan
          --config-settings=cmake.define.SCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_WERROR=ON
          .
      - name: Build sanitizer-first CPython launcher
        run: >-
          clang++ -std=c++17 -fsanitize=address,undefined
          -fno-omit-frame-pointer -fno-sanitize-recover=all
          meta/ci/asan_python_launcher.cc
          $(python3-config --embed --cflags --ldflags)
          -o python-asan
      - name: Malformed native input and lifecycle suite
        run: >-
          ./python-asan -m pytest -q
          tests/test_input_python_and_local.py
          tests/test_options_bytes.py
          tests/test_runtime_lifecycle_part01.py
          tests/test_runtime_lifecycle_part02.py
          tests/test_runtime_lifecycle_part03.py
      - name: Nested materialization and adversarial Parquet suite
        run: >-
          ./python-asan -m pytest -q
          tests/test_parquet_direct_io_runtime_part01.py
          tests/test_parquet_native_nested_list_map_combinators.py
          tests/test_parquet_native_recursive_shapes_part04.py
          tests/test_parquet_native_recursive_extreme_runtime.py
      - name: Configure ASan/UBSan libFuzzer targets
        run: >-
          cmake -S . -B build/asan-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF
          -DSCHEMA_SANITIZER_SANITIZER=asan-ubsan
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON
          -DSCHEMA_SANITIZER_FUZZ_ENGINE=libfuzzer
          -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
      - name: Build ASan/UBSan libFuzzer targets
        run: >-
          cmake --build build/asan-fuzz
          --target schema_sanitizer_fuzz_json schema_sanitizer_fuzz_csv
          schema_sanitizer_fuzz_xml schema_sanitizer_fuzz_parquet
          --parallel 4
      - name: Run ASan/UBSan fuzz regressions and mutation campaigns
        run: >-
          python meta/ci/run_fuzz_regressions.py
          --build-root build/asan-fuzz/fuzz
          --campaign-runs 1000
          --seed 15172026
          --max-len 262144
  native-platform-sanitizers:
    name: native sanitizer concurrency (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64-asan
            os: windows-latest
            sanitizer: asan
          - name: macos-x86_64-asan-ubsan
            os: macos-15-intel
            sanitizer: asan-ubsan
          - name: macos-arm64-asan-ubsan
            os: macos-14
            sanitizer: asan-ubsan
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -U pip ninja 'cmake>=4.3,<4.4'
      - name: Configure Windows ASan native gates
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/platform-sanitizer
          -A x64
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF
          -DSCHEMA_SANITIZER_SANITIZER=${{ matrix.sanitizer }}
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON
          -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone
          -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
      - name: Configure macOS ASan/UBSan native gates
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build/platform-sanitizer -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF
          -DSCHEMA_SANITIZER_SANITIZER=${{ matrix.sanitizer }}
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON
          -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone
          -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
      - name: Build native concurrency and fuzz targets
        run: >-
          cmake --build build/platform-sanitizer
          --config RelWithDebInfo
          --target schema_sanitizer_sanitized_ordered_executor
          schema_sanitizer_fuzz_json schema_sanitizer_fuzz_csv
          schema_sanitizer_fuzz_xml schema_sanitizer_fuzz_parquet
          --parallel 4
      - name: Run repeated sanitized concurrency probe
        run: >-
          ctest --test-dir build/platform-sanitizer
          -C RelWithDebInfo
          -R schema_sanitizer_sanitized_ordered_executor
          --repeat until-fail:2
          --output-on-failure
      - name: Run native fuzz regressions and bounded mutation campaigns
        run: >-
          python meta/ci/run_fuzz_regressions.py
          --build-root build/platform-sanitizer/fuzz
          --campaign-runs 500
          --seed 15172026
          --max-len 262144
  native-thread-sanitizer:
    name: native threading / GCC ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install GCC 14 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          python -m pip install -U pip ninja 'cmake>=4.3,<4.4' pytest pyarrow
      - name: Configure fully instrumented extension
        run: >-
          cmake -S . -B build/tsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DPython3_EXECUTABLE=$(which python)
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF
          -DSCHEMA_SANITIZER_SANITIZER=tsan
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON
          -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone
          -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
      - name: Build extension, fuzzers, and bundled Parquet compression
        run: cmake --build build/tsan --parallel 4
      - name: TSan native fuzz regressions and bounded mutation campaigns
        run: >-
          python meta/ci/run_fuzz_regressions.py
          --build-root build/tsan/fuzz
          --campaign-runs 1000
          --seed 15172026
          --max-len 262144
      - name: Build sanitizer-first CPython launcher
        run: >-
          g++-14 -std=c++17 -fsanitize=thread
          -fno-omit-frame-pointer
          meta/ci/tsan_python_launcher.cc
          $(python3-config --embed --cflags --ldflags)
          -o python-tsan
      - name: Verify TSan extension and executor
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 1
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
          --verify-only
      - name: TSan native executor domain
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 2
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
          tests/test_threading_native_executor.py
      - name: TSan inference domain
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 2
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
          tests/test_threading_inference.py
      - name: TSan materialization domain
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 2
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
          tests/test_threading_materialization.py
      - name: TSan text output domain
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 2
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
          tests/test_threading_output.py
      - name: TSan Parquet output domain
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 2
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
          tests/test_threading_parquet_output.py
      - name: TSan fixed-clock golden domain
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 2
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
          tests/test_threading_golden_matrix.py
      - name: TSan partition lookahead domain
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 2
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
          tests/test_partition_lookahead.py
