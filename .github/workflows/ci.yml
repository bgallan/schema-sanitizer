---
name: General sanity
on:
  workflow_call:
  push:
    branches: [main]
  # Keep this as pull_request, not pull_request_target. The latter would run
  # untrusted fork code with elevated repository context.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: 23 3 * * 1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Source-only checks that do not need a platform matrix.
  checks:
    name: quality and security
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install development and security tools
        run: >-
          python -m pip install -U pip '.[dev]'
          pip-audit bandit detect-secrets tomli
      - name: Lint, format, and static typing
        run: pre-commit run --all-files
      - name: Build dependency inputs and audit them
        shell: bash
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject.get("project", {})
          runtime = list(project.get("dependencies", []))
          extras = [
              requirement
              for values in project.get("optional-dependencies", {}).values()
              for requirement in values
          ]
          for name, requirements in (
              ("runtime-requirements.txt", runtime),
              ("full-requirements.txt", runtime + extras),
          ):
              Path(name).write_text(
                  "\n".join(dict.fromkeys(requirements)) + "\n",
                  encoding="utf-8",
              )
          PY
          pip-audit -r runtime-requirements.txt --progress-spinner off
          pip-audit -r full-requirements.txt --progress-spinner off
      - name: Static Python security scan
        run: bandit -r src -ll
      - name: Secret scan
        shell: bash
        run: |
          detect-secrets scan \
            --exclude-files '^(\.git/|build/|dist/|\.venv/|\.mypy_cache/|\.pytest_cache/|\.ruff_cache/)' \
            --all-files > .detect-secrets.ci.json
          python meta/ci/check_detect_secrets_report.py .detect-secrets.ci.json
      - name: Benchmark harness smoke
        run: python benchmarks/bench_ingest.py --rows 8 --width 2 --repeats 1

  # One task per supported platform builds the release wheel once, then reuses
  # it for core-only, full-suite, benchmark, contract, and ABI checks.
  platform-wheels:
    name: platform and wheel (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            artifact: linux
            os: ubuntu-latest
            arch: x86_64
          - name: windows-amd64
            artifact: windows
            os: windows-latest
            arch: AMD64
          - name: macos-x86_64
            artifact: macos-x86_64
            os: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            artifact: macos-arm64
            os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install wheel tooling
        run: python -m pip install -U pip cibuildwheel pytest
      - name: Assert the build environment has no PyArrow
        run: >-
          python -c
          "import importlib.util,sys;
          sys.exit(0 if importlib.util.find_spec('pyarrow') is None else 1)"
      - name: Prevent Arrow C++ headers
        if: runner.os == 'Linux'
        shell: bash
        run: meta/ci/check_no_arrow_cpp.sh
      - name: Build and test the CPython 3.11 ABI3 wheel
        run: >-
          python -m cibuildwheel --output-dir wheelhouse
          --archs '${{ matrix.arch }}'
      - name: Install the built wheel without adapters
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install wheelhouse/*.whl
          python -c "import schema_sanitizer as s, schema_sanitizer._core_abi3 as c; print(s.__version__, c.__file__)"
          pytest --collect-only -q \
            tests/parquet/test_parquet_contract_gates_part01.py \
            tests/parquet/test_parquet_contract_gates_part02.py \
            tests/parquet/test_parquet_contract_gates_part03.py
      - name: Verify the extension does not link Arrow C++
        if: runner.os != 'Windows'
        shell: bash
        run: |
          EXT_PATH=$(python - <<'PY'
          import schema_sanitizer._core_abi3 as core
          print(core.__file__)
          PY
          )
          meta/ci/check_no_libarrow_linkage.sh "${EXT_PATH}"
      - name: Install full-suite dependencies
        run: >-
          python -m pip install -U
          pytest aiohttp pyarrow pandas polars duckdb
      - name: Compile and certify the Parquet runtime
        shell: bash
        run: |
          python -m compileall -q src
          python meta/ci/check_parquet_contract_runtime.py
          mkdir -p artifacts
          python meta/ci/check_parquet_contract_runtime_suite.py \
            --certificate-output artifacts/parquet-contract-runtime-certificate.json
      - name: Full suite including adapters, HTTP faults, and concurrency
        # Do not prepend src/: on Windows that bypasses the wheel's repaired DLL
        # bootstrap while still loading its native extension.
        run: pytest -q -o pythonpath=.
      - name: Cross-platform threading benchmark smoke
        run: >-
          python benchmarks/bench_threading_matrix.py
          --profile ci
          --rows 256
          --warmups 0
          --repeats 1
          --only parquet
          --output artifacts/threading-matrix-${{ matrix.artifact }}.json
      - name: Cross-platform reader linear-scaling smoke
        run: >-
          python benchmarks/bench_reader_linear_scaling.py
          --sizes 128,256
          --repeats 1
          --maximum-normalized-growth 8
          --output artifacts/reader-linear-scaling-${{ matrix.artifact }}.json
      - name: Set up the newest supported Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify the ABI3 wheel on Python 3.14
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install wheelhouse/*.whl
          python -c "import sys, schema_sanitizer as s, schema_sanitizer._core_abi3 as c; print(sys.version.split()[0], s.__version__, c.__file__)"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: platform-evidence-${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: ignore

  # Source distribution and version are checked once; platform wheels are
  # already produced by the platform matrix above.
  sdist:
    name: source distribution
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate version and build sdist
        run: |
          python meta/ci/validate_release_version.py
          python -m pip install -U pip build twine
          python -m build --sdist
          python -m twine check dist/*
          python meta/ci/check_distribution_contents.py dist/*.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*

  # A single packaging task validates the complete release set, rebuilds from
  # the sdist, and checks every optional extra in an isolated environment.
  distribution:
    name: release and downstream packaging
    if: github.event_name != 'schedule'
    needs: [sdist, platform-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Validate the complete release artifact set
        shell: bash
        run: |
          python -m pip install -U pip twine packaging
          python -m twine check dist/*
          python meta/ci/check_distribution_contents.py --release-set dist/*
      - name: Rebuild and test as an isolated downstream consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downstream-wheel
          python -m pip wheel --no-deps --wheel-dir downstream-wheel dist/*.tar.gz
          python meta/ci/check_distribution_contents.py downstream-wheel/*.whl
          WHEEL=$(find downstream-wheel -name '*.whl' -print -quit)
          python meta/ci/check_downstream_install.py "${WHEEL}" \
            --work-root "${{ runner.temp }}/downstream-checks"
  coverage-python:
    name: coverage / Python branches
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package and coverage tools
        run: |
          python -m pip install -U pip coverage '.[dev,pyarrow]'
      - name: Collect contextual Python branch coverage
        run: |
          coverage erase
          coverage run --source=src/schema_sanitizer --branch --parallel-mode --context=regular -m pytest -q \
            tests/io/test_api.py \
            tests/io/test_input_python_and_local.py \
            tests/io/test_input_xml_and_public_api.py \
            tests/sinks/test_sinks_csv_jsonl.py \
            tests/pipeline/test_modified_time_csv_phase1.py \
            tests/pipeline/test_modified_time_csv_phase2.py \
            tests/pipeline/test_modified_time_csv_phase3.py \
            tests/pipeline/test_modified_time_csv_phase4.py \
            tests/pipeline/test_modified_time_csv_phase5.py \
            tests/pipeline/test_modified_time_csv_phase6.py \
            tests/pipeline/test_modified_time_csv_phase8.py
          coverage run --source=src/schema_sanitizer --branch --parallel-mode --context=adversarial -m pytest -q \
            tests/io/test_contracts.py \
            tests/concurrency/test_runtime_lifecycle_part01.py \
            tests/concurrency/test_runtime_lifecycle_part02.py \
            tests/concurrency/test_runtime_lifecycle_part03.py \
            tests/sinks/test_streaming_writer_lifecycle.py \
            tests/remote/test_async_remote_scheduler.py \
            tests/quality/test_high_risk_coverage_gaps.py \
            tests/parquet/test_parquet_native_recursive_fuzz_runtime.py
          coverage run --source=src/schema_sanitizer --branch --parallel-mode --context=integration -m pytest -q \
            tests/io/test_input_remote_staging_part01.py \
            tests/io/test_input_remote_staging_part02.py \
            tests/io/test_input_remote_staging_part03.py \
            tests/remote/test_cloud_emulator_configuration.py \
            tests/remote/test_bigquery_integration.py \
            tests/pipeline/test_modified_time_csv_phase7.py \
            tests/pipeline/test_modified_time_csv_phase7_integration.py
          coverage combine
          coverage report
          coverage html --show-contexts -d coverage-python-html
          coverage xml -o coverage-python.xml
          coverage json -o coverage-python.json
          python meta/ci/report_risk_coverage.py coverage-python.json \
            --output coverage-python-risk-gaps.txt
      - uses: actions/upload-artifact@v6
        with:
          name: python-branch-coverage
          path: |
            coverage-python-html/
            coverage-python.xml
            coverage-python.json
            coverage-python-risk-gaps.txt
  coverage-native:
    name: coverage / native LLVM
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install LLVM 18 coverage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          clang-18 --version
          llvm-profdata-18 --version
          llvm-cov-18 --version
      - name: Install instrumented package
        run: |
          python -m pip install -U pip ninja 'cmake>=4.3,<4.4' scikit-build-core==0.11.6
          python -m pip install -U pytest pyarrow polars
          mkdir -p coverage-native/raw
          python -m pip install --no-build-isolation -v \
            --config-settings=install.strip=false \
            --config-settings=cmake.define.CMAKE_C_COMPILER=clang-18 \
            --config-settings=cmake.define.CMAKE_CXX_COMPILER=clang++-18 \
            --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_LTO=OFF \
            --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_COVERAGE=ON \
            --config-settings=cmake.define.SCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
            --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_WERROR=ON \
            --config-settings=cmake.define.SCHEMA_SANITIZER_COVERAGE_PROFILE_PATTERN='${{ github.workspace }}/coverage-native/raw/schema-sanitizer-%p.profraw' \
            .
      - name: Run native coverage suites
        shell: bash
        run: |
          mkdir -p coverage-native/raw/regular
          pytest -q \
            tests/io/test_api.py \
            tests/io/test_input_xml_and_public_api.py \
            tests/sinks/test_sinks_csv_jsonl.py \
            tests/pipeline/test_modified_time_csv_phase4.py \
            tests/pipeline/test_modified_time_csv_phase5.py
          mv coverage-native/raw/schema-sanitizer-*.profraw \
            coverage-native/raw/regular/
          mkdir -p coverage-native/raw/adversarial
          pytest -q \
            tests/io/test_contracts.py \
            tests/concurrency/test_runtime_lifecycle_part01.py \
            tests/concurrency/test_runtime_lifecycle_part02.py \
            tests/concurrency/test_runtime_lifecycle_part03.py \
            tests/sinks/test_streaming_writer_lifecycle.py \
            tests/remote/test_async_remote_scheduler.py \
            tests/quality/test_high_risk_coverage_gaps.py \
            tests/parquet/test_parquet_native_recursive_fuzz_runtime.py
          mv coverage-native/raw/schema-sanitizer-*.profraw \
            coverage-native/raw/adversarial/
          mkdir -p coverage-native/raw/integration
          pytest -q \
            tests/io/test_input_remote_staging_part01.py \
            tests/io/test_input_remote_staging_part02.py \
            tests/io/test_input_remote_staging_part03.py \
            tests/remote/test_cloud_emulator_configuration.py \
            tests/remote/test_bigquery_integration.py \
            tests/pipeline/test_modified_time_csv_phase1.py \
            tests/pipeline/test_modified_time_csv_phase2.py \
            tests/pipeline/test_modified_time_csv_phase3.py \
            tests/pipeline/test_modified_time_csv_phase6.py \
            tests/pipeline/test_modified_time_csv_phase7.py \
            tests/pipeline/test_modified_time_csv_phase7_integration.py \
            tests/pipeline/test_modified_time_csv_phase8.py
          mv coverage-native/raw/schema-sanitizer-*.profraw \
            coverage-native/raw/integration/
      - name: Render LLVM reports
        shell: bash
        run: |
          EXTENSION=$(python - <<'PY'
          import schema_sanitizer._core_abi3 as core
          print(core.__file__)
          PY
          )
          for suite in regular adversarial integration; do
            llvm-profdata-18 merge -sparse coverage-native/raw/${suite}/*.profraw \
              -o coverage-native/${suite}.profdata
            llvm-cov-18 report "${EXTENSION}" \
              -instr-profile=coverage-native/${suite}.profdata \
              > coverage-native/${suite}-summary.txt
          done
          llvm-profdata-18 merge -sparse coverage-native/raw/*/*.profraw \
            -o coverage-native/combined.profdata
          llvm-cov-18 show "${EXTENSION}" \
            -instr-profile=coverage-native/combined.profdata \
            -format=html \
            -show-branches=count \
            -output-dir=coverage-native/html
          llvm-cov-18 report "${EXTENSION}" \
            -instr-profile=coverage-native/combined.profdata \
            > coverage-native/combined-summary.txt
          cat coverage-native/combined-summary.txt
      - uses: actions/upload-artifact@v6
        with:
          name: native-llvm-coverage
          path: coverage-native/
  address-sanitizer:
    name: sanitizer / Linux ASan + UBSan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: >-
          python -m pip install -U pip ninja 'cmake>=4.3,<4.4'
          scikit-build-core==0.11.6 pytest pyarrow
      - name: Build and install instrumented package
        run: >-
          python -m pip install -v --no-build-isolation
          --config-settings=cmake.define.CMAKE_C_COMPILER=clang
          --config-settings=cmake.define.CMAKE_CXX_COMPILER=clang++
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_LTO=OFF
          --config-settings=cmake.define.SCHEMA_SANITIZER_SANITIZER=asan-ubsan
          --config-settings=cmake.define.SCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          --config-settings=cmake.define.SCHEMA_SANITIZER_ENABLE_WERROR=ON
          .
      - name: Build sanitizer-first CPython launcher
        run: >-
          clang++ -std=c++17 -fsanitize=address,undefined
          -fno-omit-frame-pointer -fno-sanitize-recover=all
          meta/ci/asan_python_launcher.cc
          $(python3-config --embed --cflags --ldflags)
          -o python-asan
      - name: Exercise malformed input, lifecycle, and nested Parquet
        run: >-
          ./python-asan -m pytest -q
          tests/io/test_input_python_and_local.py
          tests/schema/test_options_bytes.py
          tests/concurrency/test_runtime_lifecycle_part01.py
          tests/concurrency/test_runtime_lifecycle_part02.py
          tests/concurrency/test_runtime_lifecycle_part03.py
          tests/parquet/test_parquet_direct_io_runtime_part01.py
          tests/parquet/test_parquet_native_nested_list_map_combinators.py
          tests/parquet/test_parquet_native_recursive_shapes_part04.py
          tests/parquet/test_parquet_native_recursive_extreme_runtime.py
          tests/pipeline/test_modified_time_csv_phase5.py
      - name: Configure and build ASan/UBSan libFuzzer targets
        run: |
          cmake -S . -B build/asan-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSCHEMA_SANITIZER_ENABLE_LTO=OFF \
            -DSCHEMA_SANITIZER_SANITIZER=asan-ubsan \
            -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON \
            -DSCHEMA_SANITIZER_FUZZ_ENGINE=libfuzzer \
            -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled \
            -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
            -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
          cmake --build build/asan-fuzz \
            --target schema_sanitizer_fuzz_json schema_sanitizer_fuzz_csv \
            schema_sanitizer_fuzz_xml schema_sanitizer_fuzz_parquet \
            --parallel 4
      - name: Run ASan/UBSan fuzz regressions and mutation campaigns
        run: >-
          python meta/ci/run_fuzz_regressions.py
          --build-root build/asan-fuzz/fuzz
          --engine libfuzzer
          --campaign-runs 1000
          --seed 15172026
          --max-len 262144
  platform-sanitizers:
    name: sanitizer / ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64-asan
            os: windows-latest
            sanitizer: asan
          - name: macos-x86_64-asan-ubsan
            os: macos-15-intel
            sanitizer: asan-ubsan
          - name: macos-arm64-asan-ubsan
            os: macos-14
            sanitizer: asan-ubsan
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -U pip ninja 'cmake>=4.3,<4.4'
      - name: Configure Windows ASan
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/platform-sanitizer
          -A x64
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF
          -DSCHEMA_SANITIZER_SANITIZER=${{ matrix.sanitizer }}
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON
          -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone
          -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
      - name: Configure macOS ASan/UBSan
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build/platform-sanitizer -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF
          -DSCHEMA_SANITIZER_SANITIZER=${{ matrix.sanitizer }}
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON
          -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone
          -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
      - name: Build native concurrency and fuzz targets
        run: >-
          cmake --build build/platform-sanitizer
          --config RelWithDebInfo
          --target schema_sanitizer_sanitized_ordered_executor
          schema_sanitizer_fuzz_json schema_sanitizer_fuzz_csv
          schema_sanitizer_fuzz_xml schema_sanitizer_fuzz_parquet
          --parallel 4
      - name: Run repeated sanitized concurrency probe
        # MSVC ASan can hang outside the probe watchdog. Windows still builds
        # the probe and executes all four native fuzzers below; Linux TSan owns
        # the repeated race-sensitive concurrency gate.
        if: runner.os != 'Windows'
        run: >-
          ctest --test-dir build/platform-sanitizer
          -C RelWithDebInfo
          -R schema_sanitizer_sanitized_ordered_executor
          --repeat until-fail:2
          --output-on-failure
      - name: Run native fuzz regressions and mutation campaigns
        run: >-
          python meta/ci/run_fuzz_regressions.py
          --build-root build/platform-sanitizer/fuzz
          --campaign-runs 500
          --seed 15172026
          --max-len 262144
  thread-sanitizer:
    name: sanitizer / Linux GCC ThreadSanitizer
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install GCC 14 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          python -m pip install -U pip ninja 'cmake>=4.3,<4.4' pytest pyarrow
      - name: Configure and build the fully instrumented extension
        run: |
          cmake -S . -B build/tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPython3_EXECUTABLE=$(which python) \
            -DSCHEMA_SANITIZER_ENABLE_LTO=OFF \
            -DSCHEMA_SANITIZER_SANITIZER=tsan \
            -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON \
            -DSCHEMA_SANITIZER_FUZZ_ENGINE=standalone \
            -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled \
            -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
            -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
          cmake --build build/tsan --parallel 4
      - name: Run TSan fuzz regressions and mutation campaigns
        run: >-
          python meta/ci/run_fuzz_regressions.py
          --build-root build/tsan/fuzz
          --campaign-runs 1000
          --seed 15172026
          --max-len 262144
      - name: Build sanitizer-first CPython launcher
        run: >-
          g++-14 -std=c++17 -fsanitize=thread
          -fno-omit-frame-pointer
          meta/ci/tsan_python_launcher.cc
          $(python3-config --embed --cflags --ldflags)
          -o python-tsan
      - name: Run the executor and all full-extension TSan domains
        run: >-
          meta/ci/run_tsan_extension_suite.sh
          build/tsan ./python-tsan 2
          "$(python -c 'import site; print(site.getsitepackages()[0])')"
  scheduled-native-fuzz:
    name: scheduled native fuzz campaign
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Clang and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python -m pip install -U pip ninja 'cmake>=4.3,<4.4'
      - name: Configure and build ASan/UBSan libFuzzer targets
        run: |
          cmake -S . -B build/scheduled-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSCHEMA_SANITIZER_ENABLE_LTO=OFF \
            -DSCHEMA_SANITIZER_SANITIZER=asan-ubsan \
            -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON \
            -DSCHEMA_SANITIZER_FUZZ_ENGINE=libfuzzer \
            -DSCHEMA_SANITIZER_ZLIB_PROVIDER=bundled \
            -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON \
            -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
          cmake --build build/scheduled-fuzz \
            --target schema_sanitizer_fuzz_json schema_sanitizer_fuzz_csv \
            schema_sanitizer_fuzz_xml schema_sanitizer_fuzz_parquet \
            --parallel 4
      - name: Run extended deterministic mutation campaigns
        run: >-
          python meta/ci/run_fuzz_regressions.py
          --build-root build/scheduled-fuzz/fuzz
          --engine libfuzzer
          --campaign-runs 10000
          --seed 15172026
          --max-len 1048576
          --max-input-ms 10000
          --max-rss-mb 4096
          --evidence-output artifacts/reader-fuzz-evidence.json
      - name: Build the periodic reader-limit review artifact
        run: >-
          python meta/ci/review_reader_limits.py
          --fuzz-evidence artifacts/reader-fuzz-evidence.json
          --output artifacts/reader-limit-review.json
      - name: Upload periodic reader-limit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-reader-limit-review
          path: artifacts/
          if-no-files-found: warn
      - name: Upload sanitizer crash artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-native-fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
