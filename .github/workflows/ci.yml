---
name: CI
on:
  workflow_call:
  push:
    branches: [main]
  # Keep this as pull_request, not pull_request_target. The latter would run
  # untrusted fork code with elevated repository context.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
env:
  # All Python package downloads are bounded and non-interactive, including
  # pip subprocesses created by downstream-isolation checks.
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PIP_RETRIES: '10'
  PIP_TIMEOUT: '60'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  TZ: UTC
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number
    || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Build the four release wheels as one homogeneous platform matrix.
  platform-wheel-builds:
    name: wheel / ${{ matrix['display-name'] }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - display-name: Linux x86-64
            runner: ubuntu-24.04
            platform-name: linux-x86_64
            artifact: linux
            arch: x86_64
          - display-name: Windows AMD64
            runner: windows-2022
            platform-name: windows-amd64
            artifact: windows
            arch: AMD64
          - display-name: macOS x86-64
            runner: macos-15-intel
            platform-name: macos-x86_64
            artifact: macos-x86_64
            arch: x86_64
          - display-name: macOS ARM64
            runner: macos-15
            platform-name: macos-arm64
            artifact: macos-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-platform-wheel
        with:
          platform-name: ${{ matrix['platform-name'] }}
          artifact: ${{ matrix.artifact }}
          arch: ${{ matrix.arch }}

  # Four one-axis matrices keep every platform/shard pair independently named.
  # Failed wheel builds do not suppress tests for the platform artifacts that
  # were produced; cancellation still prevents new test work from starting.
  platform-tests-linux-x86-64:
    if: ${{ !cancelled() }}
    needs: [platform-wheel-builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [io-pipeline, memory-parquet, concurrency]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-platform-wheel
        with:
          platform-name: linux-x86_64
          artifact: linux
          minimum-cpu-capacity: 4
          shard: ${{ matrix.shard }}
  platform-tests-windows-amd64:
    if: ${{ !cancelled() }}
    needs: [platform-wheel-builds]
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [io-pipeline, memory-parquet, concurrency]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-platform-wheel
        with:
          platform-name: windows-amd64
          artifact: windows
          minimum-cpu-capacity: 4
          shard: ${{ matrix.shard }}
  platform-tests-macos-x86-64:
    if: ${{ !cancelled() }}
    needs: [platform-wheel-builds]
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [io-pipeline, memory-parquet, concurrency]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-platform-wheel
        with:
          platform-name: macos-x86_64
          artifact: macos-x86_64
          minimum-cpu-capacity: 4
          shard: ${{ matrix.shard }}
  platform-tests-macos-arm64:
    if: ${{ !cancelled() }}
    needs: [platform-wheel-builds]
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [io-pipeline, memory-parquet, concurrency]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-platform-wheel
        with:
          platform-name: macos-arm64
          artifact: macos-arm64
          minimum-cpu-capacity: 3
          shard: ${{ matrix.shard }}

  # Source, quality, coverage, and sanitizer workloads are one heterogeneous
  # validation matrix. An explicit include list preserves every runner and SLA.
  validation-matrix:
    name: validation / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quality, security, and Python coverage
            task: quality
            runner: ubuntu-24.04
            python: 3.11.9
            timeout: 50
          - name: source distribution and downstream packaging
            task: source-distribution
            runner: ubuntu-24.04
            python: 3.11.9
            timeout: 90
          - name: coverage / native LLVM
            task: native-llvm-coverage
            runner: ubuntu-24.04
            python: 3.11.9
            timeout: 50
          - name: sanitizer / Linux GCC ThreadSanitizer
            task: thread-sanitizer
            runner: ubuntu-24.04
            python: 3.13.15
            timeout: 45
          - name: sanitizer / linux-x86_64-asan-ubsan
            task: platform-sanitizer
            runner: ubuntu-24.04
            python: 3.11.9
            timeout: 70
            sanitizer: asan-ubsan
            mode: linux-full
          - name: sanitizer / windows-amd64-asan
            task: platform-sanitizer
            runner: windows-2022
            python: 3.11.9
            timeout: 70
            sanitizer: asan
            mode: native
          - name: sanitizer / macos-x86_64-asan-ubsan
            task: platform-sanitizer
            runner: macos-15-intel
            python: 3.11.9
            timeout: 70
            sanitizer: asan-ubsan
            mode: native
          - name: sanitizer / macos-arm64-asan-ubsan
            task: platform-sanitizer
            runner: macos-15
            python: 3.11.9
            timeout: 70
            sanitizer: asan-ubsan
            mode: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.task == 'quality'
        uses: ./.github/actions/restore-pip-cache
        with:
          owner: quality
          python-version: ${{ matrix.python }}
          dependency-paths: |-
            pyproject.toml
            meta/ci/requirements/build-tools.txt
            meta/ci/requirements/quality.txt
            meta/ci/requirements/pre-commit-hooks.txt
      - if: matrix.task == 'source-distribution'
        uses: ./.github/actions/restore-pip-cache
        with:
          owner: source-distribution
          python-version: ${{ matrix.python }}
          dependency-paths: |-
            pyproject.toml
            meta/ci/requirements/build-tools.txt
            meta/ci/requirements/downstream.txt
      - if: matrix.task == 'native-llvm-coverage'
        uses: ./.github/actions/restore-pip-cache
        with:
          owner: native-llvm-coverage
          python-version: ${{ matrix.python }}
          dependency-paths: |-
            pyproject.toml
            meta/ci/requirements/build-tools.txt
            meta/ci/requirements/platform-tests.txt
      - if: matrix.task == 'thread-sanitizer'
        uses: ./.github/actions/restore-pip-cache
        with:
          owner: thread-sanitizer
          python-version: ${{ matrix.python }}
          dependency-paths: meta/ci/requirements/build-tools.txt
      - if: matrix.task == 'platform-sanitizer'
        uses: ./.github/actions/restore-pip-cache
        with:
          owner: platform-sanitizer
          python-version: ${{ matrix.python }}
          dependency-paths: |-
            pyproject.toml
            meta/ci/requirements/build-tools.txt
      - name: Require a known validation workload
        env:
          VALIDATION_TASK: ${{ matrix.task }}
        shell: bash
        run: |-
          set -euo pipefail
          case "${VALIDATION_TASK}" in
            quality|source-distribution|native-llvm-coverage|thread-sanitizer|platform-sanitizer) ;;
            *)
              echo "Unknown validation workload: ${VALIDATION_TASK}" >&2
              exit 2
              ;;
          esac
      - if: matrix.task == 'quality'
        uses: ./.github/actions/quality-validation
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.task == 'source-distribution'
        uses: ./.github/actions/source-distribution
      - if: matrix.task == 'native-llvm-coverage'
        uses: ./.github/actions/native-llvm-coverage
      - if: matrix.task == 'thread-sanitizer'
        uses: ./.github/actions/thread-sanitizer
      - if: matrix.task == 'platform-sanitizer'
        uses: ./.github/actions/platform-sanitizer
        with:
          sanitizer: ${{ matrix.sanitizer }}
          mode: ${{ matrix.mode }}

  # This is the only final job and the only stable check branch protection
  # needs. Release assembly starts only after every matrix is green.
  validation-gate:
    name: validation gate
    if: always()
    needs:
      - platform-wheel-builds
      - platform-tests-linux-x86-64
      - platform-tests-windows-amd64
      - platform-tests-macos-x86-64
      - platform-tests-macos-arm64
      - validation-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require every validation matrix to succeed
        env:
          WHEEL_BUILDS_RESULT: ${{ needs.platform-wheel-builds.result }}
          PLATFORM_TESTS_LINUX_X86_64_RESULT: ${{ needs.platform-tests-linux-x86-64.result }}
          PLATFORM_TESTS_WINDOWS_AMD64_RESULT: ${{ needs.platform-tests-windows-amd64.result }}
          PLATFORM_TESTS_MACOS_X86_64_RESULT: ${{ needs.platform-tests-macos-x86-64.result }}
          PLATFORM_TESTS_MACOS_ARM64_RESULT: ${{ needs.platform-tests-macos-arm64.result }}
          VALIDATION_MATRIX_RESULT: ${{ needs.validation-matrix.result }}
        shell: bash
        run: |-
          set -euo pipefail
          for result in \
            "${WHEEL_BUILDS_RESULT}" \
            "${PLATFORM_TESTS_LINUX_X86_64_RESULT}" \
            "${PLATFORM_TESTS_WINDOWS_AMD64_RESULT}" \
            "${PLATFORM_TESTS_MACOS_X86_64_RESULT}" \
            "${PLATFORM_TESTS_MACOS_ARM64_RESULT}" \
            "${VALIDATION_MATRIX_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "A validation matrix ended with ${result}" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # This packaging-only gate uses an exact runner-native interpreter;
          # release wheels retain their complete 3.11-3.14 ABI coverage above.
          python-version: 3.13.15
      - uses: ./.github/actions/restore-pip-cache
        with:
          owner: validation-gate
          python-version: 3.13.15
          dependency-paths: meta/ci/requirements/build-tools.txt
      - name: Reset release-assembly destinations
        shell: bash
        run: |-
          set -euo pipefail
          rm -rf -- download dist release
      - id: download-source-distribution
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: source-distribution
          path: download/source
      - name: Remove a partial source-distribution download before retrying
        id: reset-source-distribution-download
        if: ${{ always() && steps.download-source-distribution.outcome == 'failure' }}
        shell: bash
        run: |-
          set -euo pipefail
          rm -rf -- download/source
      - name: Retry the source-distribution download
        if: ${{ always() && steps.download-source-distribution.outcome == 'failure' && steps.reset-source-distribution-download.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: source-distribution
          path: download/source
      - id: download-platform-wheels
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: download/wheels
          pattern: dist-wheels-*
          merge-multiple: true
      - name: Remove partial platform-wheel downloads before retrying
        id: reset-platform-wheel-downloads
        if: ${{ always() && steps.download-platform-wheels.outcome == 'failure' }}
        shell: bash
        run: |-
          set -euo pipefail
          rm -rf -- download/wheels
      - name: Retry the platform-wheel downloads
        if: ${{ always() && steps.download-platform-wheels.outcome == 'failure' && steps.reset-platform-wheel-downloads.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: download/wheels
          pattern: dist-wheels-*
          merge-multiple: true
      - id: download-platform-test-evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: download/platform-tests
          pattern: platform-test-evidence-*
      - name: Remove partial platform-test evidence before retrying
        id: reset-platform-test-evidence
        if: ${{ always() && steps.download-platform-test-evidence.outcome == 'failure' }}
        shell: bash
        run: |-
          set -euo pipefail
          rm -rf -- download/platform-tests
      - name: Retry the platform-test evidence download
        if: ${{ always() && steps.download-platform-test-evidence.outcome == 'failure' && steps.reset-platform-test-evidence.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: download/platform-tests
          pattern: platform-test-evidence-*
      - id: download-native-coverage-certificate
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: native-coverage-certificate
          path: download/native-coverage
      - name: Remove a partial native-coverage certificate before retrying
        id: reset-native-coverage-certificate
        if: ${{ always() && steps.download-native-coverage-certificate.outcome == 'failure' }}
        shell: bash
        run: |-
          set -euo pipefail
          rm -rf -- download/native-coverage
      - name: Retry the native-coverage certificate download
        if: ${{ always() && steps.download-native-coverage-certificate.outcome == 'failure' && steps.reset-native-coverage-certificate.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: native-coverage-certificate
          path: download/native-coverage
      - id: download-sanitizer-certificates
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: download/sanitizers
          pattern: sanitizer-certificate-*
          merge-multiple: true
      - name: Remove partial sanitizer certificates before retrying
        id: reset-sanitizer-certificates
        if: ${{ always() && steps.download-sanitizer-certificates.outcome == 'failure' }}
        shell: bash
        run: |-
          set -euo pipefail
          rm -rf -- download/sanitizers
      - name: Retry the sanitizer certificate downloads
        if: ${{ always() && steps.download-sanitizer-certificates.outcome == 'failure' && steps.reset-sanitizer-certificates.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: download/sanitizers
          pattern: sanitizer-certificate-*
          merge-multiple: true
      - name: Verify the native-coverage gate evidence
        shell: bash
        run: |-
          set -euo pipefail
          python meta/ci/native/check_llvm_coverage.py verify \
            --certificate download/native-coverage/native-coverage-certificate.json \
            --github-sha "${GITHUB_SHA}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
      - name: Verify every platform-wheel certificate
        shell: bash
        run: |-
          set -euo pipefail
          shopt -s nullglob
          certificates=(download/wheels/platform-wheel-certificate-*.json)
          if [[ "${#certificates[@]}" -ne 4 ]]; then
            echo "Expected four platform-wheel certificates, found ${#certificates[@]}" >&2
            exit 2
          fi
          platforms=(linux-x86_64 macos-arm64 macos-x86_64 windows-amd64)
          for platform in "${platforms[@]}"; do
            certificate="download/wheels/platform-wheel-certificate-${platform}.json"
            if [[ ! -f "${certificate}" || -L "${certificate}" ]]; then
              echo "Missing regular platform-wheel certificate: ${certificate}" >&2
              exit 2
            fi
            python meta/ci/native/certify_platform_wheel.py verify \
              --certificate "${certificate}" \
              --wheel-directory download/wheels \
              --platform "${platform}" \
              --github-sha "${GITHUB_SHA}" \
              --github-run-id "${GITHUB_RUN_ID}" \
              --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
          done
      - name: Verify the complete sanitizer evidence matrix
        shell: bash
        run: |-
          set -euo pipefail
          python meta/ci/sanitizers/certify_sanitizer_run.py verify-directory \
            --evidence-directory download/sanitizers \
            --github-sha "${GITHUB_SHA}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
      - name: Verify every platform-test evidence set
        shell: bash
        run: |-
          set -euo pipefail
          shopt -s nullglob
          expected=(
            'platform-test-evidence-linux-x86_64-concurrency:linux:concurrency'
            'platform-test-evidence-linux-x86_64-io-pipeline:linux:io-pipeline'
            'platform-test-evidence-linux-x86_64-memory-parquet:linux:memory-parquet'
            'platform-test-evidence-macos-arm64-concurrency:macos-arm64:concurrency'
            'platform-test-evidence-macos-arm64-io-pipeline:macos-arm64:io-pipeline'
            'platform-test-evidence-macos-arm64-memory-parquet:macos-arm64:memory-parquet'
            'platform-test-evidence-macos-x86_64-concurrency:macos-x86_64:concurrency'
            'platform-test-evidence-macos-x86_64-io-pipeline:macos-x86_64:io-pipeline'
            'platform-test-evidence-macos-x86_64-memory-parquet:macos-x86_64:memory-parquet'
            'platform-test-evidence-windows-amd64-concurrency:windows:concurrency'
            'platform-test-evidence-windows-amd64-io-pipeline:windows:io-pipeline'
            'platform-test-evidence-windows-amd64-memory-parquet:windows:memory-parquet'
          )
          actual=(download/platform-tests/platform-test-evidence-*)
          if [[ "${#actual[@]}" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} platform-test evidence sets, found ${#actual[@]}" >&2
            exit 2
          fi
          for specification in "${expected[@]}"; do
            artifact=${specification%%:*}
            remainder=${specification#*:}
            platform=${remainder%%:*}
            shard=${remainder#*:}
            directory="download/platform-tests/${artifact}"
            [[ -d "${directory}" && ! -L "${directory}" ]] || {
              echo "Platform-test evidence directory is missing or unsafe: ${directory}" >&2
              exit 2
            }
            python meta/ci/quality/platform_test_evidence.py verify \
              --evidence-dir "${directory}" \
              --certificate "${directory}/platform-test-certificate-${platform}-${shard}.json" \
              --platform "${platform}" \
              --shard "${shard}" \
              --github-sha "${GITHUB_SHA}" \
              --github-run-id "${GITHUB_RUN_ID}" \
              --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
          done
      - name: Validate the complete release artifact set
        env:
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
          PIP_CONSTRAINT: ${{ github.workspace }}/meta/ci/requirements/build-tools.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp download/source/*.tar.gz download/wheels/*.whl dist/
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          [[ "${SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]
          export SOURCE_DATE_EPOCH
          python meta/ci/quality/ensure_pinned_pip.py
          python -m pip install --only-binary=:all: twine==7.0.0 packaging==26.3
          python -m twine check dist/*
          python meta/ci/release/check_distribution_contents.py --release-set dist/*
      - name: Assemble the auditable release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/packages
          cp dist/*.whl dist/*.tar.gz release/packages/
          python meta/ci/release/release_manifest.py create \
            --manifest release/release-manifest.json \
            --github-sha "${GITHUB_SHA}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --github-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            release/packages/*
      - name: Upload the only publishable release set
        id: upload-release-distributions
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Retry the publishable release-set upload after a transport failure
        if: ${{ always() && steps.upload-release-distributions.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
