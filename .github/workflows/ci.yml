---
name: CI
on:
  workflow_call:
  push:
    branches: [main]
  # Keep this as pull_request, not pull_request_target. The latter would run
  # untrusted fork code with elevated repository context.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Build the four release wheels as one homogeneous platform matrix.
  platform-wheel-builds:
    name: wheel / ${{ matrix['display-name'] }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - display-name: Linux x86-64
            runner: ubuntu-24.04
            platform-name: linux-x86_64
            artifact: linux
            arch: x86_64
          - display-name: Windows AMD64
            runner: windows-2025
            platform-name: windows-amd64
            artifact: windows
            arch: AMD64
          - display-name: macOS x86-64
            runner: macos-15-intel
            platform-name: macos-x86_64
            artifact: macos-x86_64
            arch: x86_64
          - display-name: macOS ARM64
            runner: macos-15
            platform-name: macos-arm64
            artifact: macos-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-platform-wheel
        with:
          platform-name: ${{ matrix['platform-name'] }}
          artifact: ${{ matrix.artifact }}
          arch: ${{ matrix.arch }}

  # Twelve independent cells keep all platform/shard pairs visible while
  # collecting them under one thematic test owner.
  platform-tests:
    name: tests / ${{ matrix.shard }} / ${{ matrix['display-name'] }}
    needs: [platform-wheel-builds]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - display-name: Linux x86-64
            runner: ubuntu-24.04
            platform-name: linux-x86_64
            artifact: linux
            shard: concurrency
          - display-name: Windows AMD64
            runner: windows-2025
            platform-name: windows-amd64
            artifact: windows
            shard: concurrency
          - display-name: macOS x86-64
            runner: macos-15-intel
            platform-name: macos-x86_64
            artifact: macos-x86_64
            shard: concurrency
          - display-name: macOS ARM64
            runner: macos-15
            platform-name: macos-arm64
            artifact: macos-arm64
            shard: concurrency
          - display-name: Linux x86-64
            runner: ubuntu-24.04
            platform-name: linux-x86_64
            artifact: linux
            shard: memory-parquet
          - display-name: Windows AMD64
            runner: windows-2025
            platform-name: windows-amd64
            artifact: windows
            shard: memory-parquet
          - display-name: macOS x86-64
            runner: macos-15-intel
            platform-name: macos-x86_64
            artifact: macos-x86_64
            shard: memory-parquet
          - display-name: macOS ARM64
            runner: macos-15
            platform-name: macos-arm64
            artifact: macos-arm64
            shard: memory-parquet
          - display-name: Linux x86-64
            runner: ubuntu-24.04
            platform-name: linux-x86_64
            artifact: linux
            shard: io-pipeline
          - display-name: Windows AMD64
            runner: windows-2025
            platform-name: windows-amd64
            artifact: windows
            shard: io-pipeline
          - display-name: macOS x86-64
            runner: macos-15-intel
            platform-name: macos-x86_64
            artifact: macos-x86_64
            shard: io-pipeline
          - display-name: macOS ARM64
            runner: macos-15
            platform-name: macos-arm64
            artifact: macos-arm64
            shard: io-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-platform-wheel
        with:
          platform-name: ${{ matrix['platform-name'] }}
          artifact: ${{ matrix.artifact }}
          shard: ${{ matrix.shard }}

  # Source, quality, coverage, and sanitizer workloads are one heterogeneous
  # validation matrix. An explicit include list preserves every runner and SLA.
  validation-matrix:
    name: validation / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quality, security, and Python coverage
            task: quality
            runner: ubuntu-24.04
            python: '3.11'
            timeout: 50
          - name: source distribution and downstream packaging
            task: source-distribution
            runner: ubuntu-24.04
            python: '3.11'
            timeout: 90
          - name: coverage / native LLVM
            task: native-llvm-coverage
            runner: ubuntu-24.04
            python: '3.11'
            timeout: 50
          - name: sanitizer / Linux GCC ThreadSanitizer
            task: thread-sanitizer
            runner: ubuntu-24.04
            python: '3.13'
            timeout: 45
          - name: sanitizer / linux-x86_64-asan-ubsan
            task: platform-sanitizer
            runner: ubuntu-24.04
            python: '3.11'
            timeout: 70
            sanitizer: asan-ubsan
            mode: linux-full
          - name: sanitizer / windows-amd64-asan
            task: platform-sanitizer
            runner: windows-2025
            python: '3.11'
            timeout: 70
            sanitizer: asan
            mode: native
          - name: sanitizer / macos-x86_64-asan-ubsan
            task: platform-sanitizer
            runner: macos-15-intel
            python: '3.11'
            timeout: 70
            sanitizer: asan-ubsan
            mode: native
          - name: sanitizer / macos-arm64-asan-ubsan
            task: platform-sanitizer
            runner: macos-15
            python: '3.11'
            timeout: 70
            sanitizer: asan-ubsan
            mode: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Require a known validation workload
        env:
          VALIDATION_TASK: ${{ matrix.task }}
        shell: bash
        run: |-
          case "${VALIDATION_TASK}" in
            quality|source-distribution|native-llvm-coverage|thread-sanitizer|platform-sanitizer) ;;
            *)
              echo "Unknown validation workload: ${VALIDATION_TASK}" >&2
              exit 2
              ;;
          esac
      - if: matrix.task == 'quality'
        uses: ./.github/actions/quality-validation
      - if: matrix.task == 'source-distribution'
        uses: ./.github/actions/source-distribution
      - if: matrix.task == 'native-llvm-coverage'
        uses: ./.github/actions/native-llvm-coverage
      - if: matrix.task == 'thread-sanitizer'
        uses: ./.github/actions/thread-sanitizer
      - if: matrix.task == 'platform-sanitizer'
        uses: ./.github/actions/platform-sanitizer
        with:
          sanitizer: ${{ matrix.sanitizer }}
          mode: ${{ matrix.mode }}

  # This is the only final job and the only stable check branch protection
  # needs. Release assembly starts only after every matrix is green.
  validation-gate:
    name: validation gate
    if: always()
    needs: [platform-wheel-builds, platform-tests, validation-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require every validation matrix to succeed
        env:
          WHEEL_BUILDS_RESULT: ${{ needs.platform-wheel-builds.result }}
          PLATFORM_TESTS_RESULT: ${{ needs.platform-tests.result }}
          VALIDATION_MATRIX_RESULT: ${{ needs.validation-matrix.result }}
        shell: bash
        run: |-
          set -euo pipefail
          for result in \
            "${WHEEL_BUILDS_RESULT}" \
            "${PLATFORM_TESTS_RESULT}" \
            "${VALIDATION_MATRIX_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "A validation matrix ended with ${result}" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: source-distribution
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          pattern: dist-wheels-*
          merge-multiple: true
      - name: Validate the complete release artifact set
        shell: bash
        run: |
          python -m pip install -U pip twine==7.0.0 packaging==26.3
          python -m twine check dist/*
          python meta/ci/release/check_distribution_contents.py --release-set dist/*
      - name: Assemble the auditable release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/packages
          cp dist/*.whl dist/*.tar.gz release/packages/
          python meta/ci/release/release_manifest.py create \
            --manifest release/release-manifest.json \
            --github-sha "${GITHUB_SHA}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --github-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            release/packages/*
      - name: Upload the only publishable release set
        id: upload-release-distributions
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retry the publishable release-set upload after a transport failure
        if: ${{ always() && steps.upload-release-distributions.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
