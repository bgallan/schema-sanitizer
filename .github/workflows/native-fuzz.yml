---
name: Native fuzz campaign
on:
  schedule:
    - cron: 23 3 * * 0
permissions:
  contents: read
jobs:
  fuzz:
    name: Bounded parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install native build tools
        run: python -m pip install -U ninja 'cmake>=4.3,<4.4'
      - name: Configure fuzz targets
        run: >-
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSCHEMA_SANITIZER_ENABLE_LTO=OFF
          -DSCHEMA_SANITIZER_SANITIZER=asan-ubsan
          -DSCHEMA_SANITIZER_BUILD_FUZZERS=ON
          -DSCHEMA_SANITIZER_REQUIRE_ZLIB=ON
          -DSCHEMA_SANITIZER_ENABLE_WERROR=ON
      - name: Build fuzz targets
        run: cmake --build build-fuzz --target schema_sanitizer_fuzz_json schema_sanitizer_fuzz_csv
          schema_sanitizer_fuzz_xml schema_sanitizer_fuzz_parquet --parallel 2
      - name: Run deterministic promoted crash regressions
        run: python meta/ci/run_fuzz_regressions.py --build-root build-fuzz/fuzz
      - name: Prepare writable corpora and artifacts
        shell: bash
        run: |
          mkdir -p fuzz-run artifacts
          for target in json csv xml parquet; do
            cp -R "fuzz/corpus/${target}" "fuzz-run/${target}"
            mkdir -p "artifacts/${target}"
          done
      - name: Run bounded campaigns
        shell: bash
        run: |
          set -o pipefail
          for target in json csv xml parquet; do
            "build-fuzz/fuzz/schema_sanitizer_fuzz_${target}" \
              "fuzz-run/${target}" \
              -max_total_time=180 \
              -timeout=10 \
              -rss_limit_mb=4096 \
              -print_final_stats=1 \
              -artifact_prefix="artifacts/${target}/" \
              2>&1 | tee "artifacts/${target}/campaign.log"
          done
      - name: Upload corpora and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-fuzz-${{ github.run_id }}
          path: |
            artifacts/**
            fuzz-run/**
          if-no-files-found: error
