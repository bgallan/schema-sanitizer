---
version: 2
updates:
  - package-ecosystem: github-actions
    # The root job scans workflows; each composite action is its own manifest.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      action-pins:
        patterns:
          - "*"
        group-by: dependency-name
